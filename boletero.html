<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Boletero Inteligente · Sistema de Cobro</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <style>
    :root {
      --negro: #0a0a0a;
      --amarillo: #f59e0b;
      --amarillo-texto: #fbbf24;
      --naranja: #e85d04;
      --blanco: #f8fafc;
      --gris: #1e293b;
      --gris2: #334155;
      --verde: #22c55e;
      --rojo: #ef4444;
      --azul: #3b82f6;
      --morado: #a855f7;
      --gris-texto: #94a3b8;
      --alerta-rojo: #ff4444;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--negro); color: var(--blanco);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      height: 100vh; width: 100vw; overflow: hidden; display: flex; flex-direction: column;
      user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
    }

    .header {
      background: var(--gris); padding: 1.5vh 4vw; height: 8vh;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 0.4vh solid var(--amarillo); flex-shrink: 0;
    }
    .header-info { display: flex; flex-direction: column; flex: 1; min-width: 0; }
    .header-ruta { font-size: 4.5vw; font-weight: 700; color: var(--amarillo); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .header-operador { font-size: 3vw; color: var(--gris-texto); }
    .btn-itinerario {
      background: transparent; border: 0.2vh solid var(--amarillo); color: var(--amarillo);
      padding: 1vh 3vw; border-radius: 1vh; font-size: 4vw; cursor: pointer; text-decoration: none; margin-left: 2vw;
    }

    .main-content { flex: 1; display: flex; flex-direction: column; padding: 2vh 4vw; gap: 1.5vh; min-height: 0; }

    .indicadores { display: flex; gap: 1.5vw; flex-shrink: 0; }
    .indicador { flex: 1; padding: 1.5vh 2vw; border-radius: 1.5vh; text-align: center; font-weight: 700; }
    .indicador-abordo { background: var(--gris); border: 0.3vh solid var(--verde); }
    .indicador-abordo .num { font-size: 7vw; color: var(--verde); line-height: 1; }
    .indicador-abordo .etq { font-size: 2.5vw; color: var(--gris-texto); text-transform: uppercase; letter-spacing: 1px; }
    .indicador-bajan { background: var(--gris); border: 0.3vh solid var(--naranja); }
    .indicador-bajan .num { font-size: 7vw; color: var(--naranja); line-height: 1; }
    .indicador-bajan .etq { font-size: 2.5vw; color: var(--gris-texto); text-transform: uppercase; letter-spacing: 1px; }
    .indicador-bajan.alerta { animation: alertaBajada 0.6s ease 3; border-color: var(--rojo); }
    .indicador-bajan.alerta .num { color: var(--rojo); }
    @keyframes alertaBajada { 0%,100% { transform: scale(1) } 50% { transform: scale(1.08) } }
    .btn-reporte {
      background: var(--gris); border: 0.3vh solid var(--amarillo-texto); border-radius: 1.5vh;
      color: var(--amarillo-texto); font-size: 3vw; font-weight: 700; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 1.5vh 2vw; min-width: 18vw;
    }
    .btn-reporte .ico { font-size: 6vw; line-height: 1; }
    .btn-reporte .txt { font-size: 2.5vw; text-transform: uppercase; letter-spacing: 1px; }

    .btn-pasajero {
      padding: 3vh; background: var(--amarillo); color: var(--negro); border: none; border-radius: 2vh;
      font-size: 6.5vw; font-weight: 800; cursor: pointer; flex-shrink: 0;
      box-shadow: 0 1vh 3vh rgba(245,158,11,0.35);
    }

    .card-localidad {
      background: var(--gris); border: 0.3vh solid var(--gris2); border-radius: 2vh;
      flex: 1; display: flex; flex-direction: column; overflow: hidden; min-height: 0;
    }
    .localidad-header { padding: 1vh 4vw; text-align: center; flex-shrink: 0; }
    .localidad-etiqueta { font-size: 2.5vw; color: var(--gris-texto); text-transform: uppercase; letter-spacing: 2px; }
    .localidad-nombre { font-size: 7vw; font-weight: 900; color: var(--amarillo-texto); }
    .localidad-precision { font-size: 2.5vw; color: var(--verde); }
    .mapa-contenedor {
      flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center;
      padding-bottom: 1vh; position: relative;
    }
    #minimapa { width: 80%; height: 85%; border-radius: 1.5vh; border: 0.2vh solid #333; }

    .btn-qr-flotante {
      position: absolute; bottom: 12vh; right: 5vw; width: 12vw; height: 12vw;
      min-width: 44px; min-height: 44px; border-radius: 50%; background: var(--negro);
      border: 0.3vh solid var(--amarillo); color: var(--amarillo); font-size: 6vw;
      cursor: pointer; z-index: 1000; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0.5vh 2vh rgba(0,0,0,0.6);
    }

    .btn-alerta-flotante {
      position: absolute; top: 2vh; right: 5vw; width: 12vw; height: 12vw;
      min-width: 44px; min-height: 44px; border-radius: 50%; background: var(--negro);
      border: 0.3vh solid var(--rojo); color: var(--rojo); font-size: 7vw;
      cursor: pointer; z-index: 1001; display: none; align-items: center; justify-content: center;
      box-shadow: 0 0.5vh 2vh rgba(239,68,68,0.5);
    }
    .btn-alerta-flotante.tiene-alertas {
      display: flex; animation: parpadeoAlerta 1.5s ease infinite;
    }
    @keyframes parpadeoAlerta {
      0%,100% { box-shadow: 0 0 1vh rgba(239,68,68,0.5); transform: scale(1); }
      50% { box-shadow: 0 0 4vh rgba(239,68,68,0.9); transform: scale(1.1); }
    }

    .popup-alerta-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(10,10,10,0.95); z-index: 8000; display: none;
      justify-content: center; align-items: center; padding: 5vh 6vw;
    }
    .popup-alerta-overlay.active { display: flex; }
    .popup-alerta {
      background: var(--gris); border: 0.5vh solid var(--alerta-rojo); border-radius: 2vh;
      padding: 5vh 6vw; width: 100%; max-width: 400px; text-align: center;
      animation: entradaAlerta 0.4s ease;
    }
    @keyframes entradaAlerta { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .popup-alerta .alerta-icono { font-size: 20vw; line-height: 1; animation: latido 1s ease infinite; }
    @keyframes latido { 0%,100% { transform: scale(1); } 15% { transform: scale(1.3); } 30% { transform: scale(1); } }
    .popup-alerta .alerta-titulo { font-size: 6vw; font-weight: 900; color: var(--alerta-rojo); text-transform: uppercase; letter-spacing: 2px; margin: 2vh 0; }
    .popup-alerta .alerta-mensaje { font-size: 4.5vw; color: var(--blanco); line-height: 1.4; margin-bottom: 2vh; }
    .popup-alerta .alerta-fecha { font-size: 3vw; color: var(--gris-texto); margin-bottom: 3vh; }
    .popup-alerta .alerta-ok {
      width: 100%; padding: 3vh; background: var(--verde); color: var(--blanco);
      border: none; border-radius: 1.5vh; font-size: 5vw; font-weight: 700; cursor: pointer;
    }

    /* MODALES */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(10,10,10,0.98); z-index: 3000; display: none; flex-direction: column; padding: 3vh 4vw;
    }
    .modal-overlay.active { display: flex; }
    .modal-title { font-size: 7vw; font-weight: 700; color: var(--amarillo-texto); text-align: center; flex-shrink: 0; margin-bottom: 1vh; }
    .modal-subtitle { font-size: 3.5vw; color: var(--gris-texto); text-align: center; margin-bottom: 2vh; }
    .modal-cerrar {
      width: 100%; padding: 2.5vh; background: transparent; color: var(--rojo);
      border: 0.2vh solid var(--rojo); border-radius: 1.5vh; font-size: 4.5vw; font-weight: 700; cursor: pointer; flex-shrink: 0; margin-top: 1.5vh;
    }

    .destino-lista { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 1.5vh; }
    .destino-item {
      background: var(--gris); padding: 2.5vh 4vw; border-radius: 1.5vh;
      display: flex; justify-content: space-between; align-items: center; cursor: pointer;
    }
    .destino-nombre { font-size: 5vw; font-weight: 600; }
    .destino-tarifa { font-size: 6vw; font-weight: 800; color: var(--amarillo-texto); }

    /* COBRO */
    .cobro-contenido { display: flex; flex-direction: column; height: 100%; gap: 1.5vh; overflow: hidden; }
    .cobro-header-ruta {
      background: var(--gris); border-radius: 1.5vh; padding: 1.5vh 3vw;
      display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;
    }
    .cobro-lugar-nombre { font-size: 4vw; font-weight: 700; color: var(--blanco); }
    .cobro-flecha { font-size: 6vw; color: var(--amarillo); }

    .tipos-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5vw; flex-shrink: 0; }
    .tipo-card {
      background: var(--gris); border-radius: 2vh; padding: 1.5vh 2vw;
      display: flex; flex-direction: column; gap: 1vh; border: 0.25vh solid var(--gris2);
    }
    .tipo-card-top { display: flex; align-items: center; gap: 2vw; }
    .tipo-icono { font-size: 6vw; }
    .tipo-info { flex: 1; }
    .tipo-nombre { font-size: 3.5vw; font-weight: 700; }
    .tipo-precio { font-size: 3vw; font-weight: 600; }
    .tipo-controles { display: flex; align-items: center; justify-content: space-between; gap: 1vw; }
    .btn-menos, .btn-mas {
      width: 9vw; height: 9vw; min-width: 34px; min-height: 34px;
      border-radius: 50%; border: none; font-size: 5.5vw; font-weight: 900;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .btn-menos { background: var(--gris2); color: var(--blanco); }
    .btn-menos:disabled { opacity: 0.3; }
    .tipo-cantidad { font-size: 7vw; font-weight: 900; min-width: 8vw; text-align: center; }
    .tipo-subtotal { font-size: 3vw; font-weight: 700; color: var(--verde); text-align: right; }

    .tipo-normal .btn-mas { background: var(--amarillo); color: var(--negro); }
    .tipo-normal .tipo-precio, .tipo-normal .tipo-cantidad { color: var(--amarillo-texto); }
    .tipo-adulto .btn-mas { background: var(--naranja); color: var(--blanco); }
    .tipo-adulto .tipo-precio, .tipo-adulto .tipo-cantidad { color: var(--naranja); }
    .tipo-estudiante .btn-mas { background: var(--azul); color: var(--blanco); }
    .tipo-estudiante .tipo-precio, .tipo-estudiante .tipo-cantidad { color: var(--azul); }
    .tipo-maestro .btn-mas { background: var(--morado); color: var(--blanco); }
    .tipo-maestro .tipo-precio, .tipo-maestro .tipo-cantidad { color: var(--morado); }

    .cobro-total-bar {
      background: var(--gris); border-radius: 1.5vh; padding: 1.5vh 4vw;
      display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;
    }
    .cobro-total-label { font-size: 3.5vw; color: var(--gris-texto); text-transform: uppercase; }
    .cobro-total-monto { font-size: 10vw; font-weight: 900; color: var(--verde); }

    .cobro-vuelto {
      background: var(--negro); border-radius: 1.5vh; padding: 1.5vh 4vw;
      display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; gap: 2vw;
    }
    .vuelto-label { font-size: 3vw; color: var(--gris-texto); }
    .vuelto-billetes { display: flex; gap: 2vw; flex-wrap: wrap; }
    .billete-btn {
      padding: 1vh 3vw; border-radius: 1vh; border: none; font-size: 3.5vw; font-weight: 700; cursor: pointer;
      background: var(--gris2); color: var(--blanco);
    }
    .vuelto-resultado { font-size: 5vw; font-weight: 800; color: var(--azul); min-width: 20vw; text-align: right; }

    .btn-cobrar-final {
      width: 100%; padding: 3vh; background: var(--verde); color: var(--blanco);
      border: none; border-radius: 2vh; font-size: 6.5vw; font-weight: 800; cursor: pointer; flex-shrink: 0;
    }
    .btn-cobrar-final:disabled { background: var(--gris2); color: #555; }

    .qr-contenedor {
      text-align: center; display: flex; flex-direction: column; justify-content: center; align-items: center;
      height: 100%; gap: 3vh;
    }
    #qrcode { background: white; padding: 2vh; border-radius: 2vh; }
    #qrcode img { width: 60vw; height: 60vw; }

    /* TOAST COBRO */
    .toast-cobro {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(10,10,10,0.97); z-index: 9000; display: none;
      flex-direction: column; justify-content: center; align-items: center;
      padding: 6vw; gap: 3vh;
    }
    .toast-cobro.active { display: flex; animation: fadeInToast 0.25s ease; }
    @keyframes fadeInToast { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    .toast-check { font-size: 20vw; animation: popCheck 0.4s cubic-bezier(.36,1.6,.6,1); }
    @keyframes popCheck { from { transform: scale(0); } to { transform: scale(1); } }
    .toast-titulo { font-size: 9vw; font-weight: 900; color: var(--verde); text-transform: uppercase; letter-spacing: 2px; }
    .toast-monto { font-size: 22vw; font-weight: 900; color: var(--amarillo-texto); line-height: 1; }
    .toast-btn-ok {
      width: 100%; padding: 3.5vh; background: var(--verde); color: var(--blanco);
      border: none; border-radius: 2vh; font-size: 6.5vw; font-weight: 800; cursor: pointer; margin-top: 1vh;
    }
  </style>
</head>
<body>
<div class="header">
  <div class="header-info">
    <div class="header-ruta" id="headerRuta">🎫 Boletero</div>
    <div class="header-operador" id="headerOperador">Sin ruta asignada</div>
  </div>
  <a class="btn-itinerario" href="index.html">📋</a>
</div>

<div class="main-content">
  <div class="indicadores">
    <div class="indicador indicador-abordo"><div class="num" id="numABordo">0</div><div class="etq">👥 A BORDO</div></div>
    <div class="indicador indicador-bajan" id="indicadorBajan"><div class="num" id="numBajan">0</div><div class="etq">🔻 POR BAJAR</div></div>
    <button class="btn-reporte" onclick="mostrarReporte()"><div class="ico">💰</div><div class="txt">REPORTE</div></button>
  </div>
  <button class="btn-pasajero" onclick="abrirModalDestino()">🚌 PASAJERO A BORDO</button>
  <div class="card-localidad">
    <div class="localidad-header">
      <div class="localidad-etiqueta">📍 LOCALIDAD GPS</div>
      <div class="localidad-nombre" id="nombreLocalidad">—</div>
      <div class="localidad-precision">Precisión: <span id="precisionGPS">—</span></div>
    </div>
    <div class="mapa-contenedor">
      <div id="minimapa"></div>
      <button class="btn-qr-flotante" onclick="mostrarQR()">⬢</button>
      <button class="btn-alerta-flotante" id="btnAlertaFlotante" onclick="mostrarAlerta()">⚠️</button>
    </div>
  </div>
</div>

<!-- POP-UP ALERTA -->
<div class="popup-alerta-overlay" id="popupAlertaOverlay">
  <div class="popup-alerta">
    <div class="alerta-icono">⚠️</div>
    <div class="alerta-titulo">ALERTA DE RUTA</div>
    <div class="alerta-mensaje" id="alertaMensaje">—</div>
    <div class="alerta-fecha" id="alertaFecha">—</div>
    <button class="alerta-ok" onclick="cerrarAlerta()">✅ ENTENDIDO</button>
  </div>
</div>

<!-- MODAL DESTINO -->
<div class="modal-overlay" id="modalDestino">
  <div class="modal-title">SELECCIONAR DESTINO</div>
  <div class="modal-subtitle">📍 Origen: <span id="origenModal">—</span></div>
  <div class="destino-lista" id="listaDestinos"></div>
  <button class="modal-cerrar" onclick="cerrarModalDestino()">❌ CANCELAR</button>
</div>

<!-- MODAL COBRO -->
<div class="modal-overlay" id="modalCobro">
  <div class="cobro-contenido">
    <div class="modal-title">COBRAR</div>
    <div class="cobro-header-ruta">
      <div class="cobro-lugar-nombre" id="cobroOrigenNombre">—</div>
      <div class="cobro-flecha">→</div>
      <div class="cobro-lugar-nombre" id="cobroDestinoNombre">—</div>
    </div>
    <div class="tipos-grid">
      <div class="tipo-card tipo-normal"><div class="tipo-card-top"><div class="tipo-icono">👤</div><div class="tipo-info"><div class="tipo-nombre">Normal</div><div class="tipo-precio" id="precio-normal">$0</div></div></div><div class="tipo-controles"><button class="btn-menos" onclick="cambiarCantidad('normal',-1)" disabled>−</button><div class="tipo-cantidad" id="cant-normal">0</div><button class="btn-mas" onclick="cambiarCantidad('normal',1)">+</button></div><div class="tipo-subtotal" id="sub-normal"></div></div>
      <div class="tipo-card tipo-adulto"><div class="tipo-card-top"><div class="tipo-icono">🧓</div><div class="tipo-info"><div class="tipo-nombre">Adulto Mayor</div><div class="tipo-precio" id="precio-adulto">$0</div></div></div><div class="tipo-controles"><button class="btn-menos" onclick="cambiarCantidad('adulto',-1)" disabled>−</button><div class="tipo-cantidad" id="cant-adulto">0</div><button class="btn-mas" onclick="cambiarCantidad('adulto',1)">+</button></div><div class="tipo-subtotal" id="sub-adulto"></div></div>
      <div class="tipo-card tipo-estudiante"><div class="tipo-card-top"><div class="tipo-icono">🎓</div><div class="tipo-info"><div class="tipo-nombre">Estudiante</div><div class="tipo-precio" id="precio-estudiante">$0</div></div></div><div class="tipo-controles"><button class="btn-menos" onclick="cambiarCantidad('estudiante',-1)" disabled>−</button><div class="tipo-cantidad" id="cant-estudiante">0</div><button class="btn-mas" onclick="cambiarCantidad('estudiante',1)">+</button></div><div class="tipo-subtotal" id="sub-estudiante"></div></div>
      <div class="tipo-card tipo-maestro"><div class="tipo-card-top"><div class="tipo-icono">📚</div><div class="tipo-info"><div class="tipo-nombre">Maestro</div><div class="tipo-precio" id="precio-maestro">$0</div></div></div><div class="tipo-controles"><button class="btn-menos" onclick="cambiarCantidad('maestro',-1)" disabled>−</button><div class="tipo-cantidad" id="cant-maestro">0</div><button class="btn-mas" onclick="cambiarCantidad('maestro',1)">+</button></div><div class="tipo-subtotal" id="sub-maestro"></div></div>
    </div>
    <div class="cobro-total-bar"><div class="cobro-total-label">TOTAL</div><div class="cobro-total-monto" id="cobroTotalMonto">$0</div></div>
    <div class="cobro-vuelto">
      <div class="vuelto-label">Vuelto:</div>
      <div class="vuelto-billetes">
        <button class="billete-btn" onclick="calcularVuelto(20)">$20</button>
        <button class="billete-btn" onclick="calcularVuelto(50)">$50</button>
        <button class="billete-btn" onclick="calcularVuelto(100)">$100</button>
        <button class="billete-btn" onclick="calcularVuelto(200)">$200</button>
        <button class="billete-btn" onclick="calcularVuelto(500)">$500</button>
      </div>
      <div class="vuelto-resultado" id="vueltoResultado"></div>
    </div>
    <button class="btn-cobrar-final" id="btnCobrarFinal" onclick="confirmarCobro()" disabled>✅ COBRAR</button>
    <button class="modal-cerrar" onclick="cerrarModalCobro()">❌ CANCELAR</button>
  </div>
</div>

<!-- TOAST COBRO EXITOSO -->
<div class="toast-cobro" id="toastCobro">
  <div class="toast-check">✅</div>
  <div class="toast-titulo">COBRO EXITOSO</div>
  <div class="toast-monto" id="toastMonto">$0</div>
  <button class="toast-btn-ok" onclick="cerrarToast()">👍 LISTO</button>
</div>

<!-- MODAL QR -->
<div class="modal-overlay" id="modalQR">
  <div class="qr-contenedor"><div class="modal-title">CÓDIGO QR</div><div id="qrcode"></div><button class="modal-cerrar" onclick="document.getElementById('modalQR').classList.remove('active')">❌ CERRAR</button></div>
</div>

<script>
// ============================================================
// ⚠️ CONFIGURACIÓN GOOGLE SHEETS
// ============================================================
const CONFIG = {
  USAR_SHEETS: false,
  APPS_SCRIPT_URL: 'TU_URL_DE_APPS_SCRIPT',
  SHEET_ID: 'TU_SHEET_ID_AQUI'
};

const TARIFA_POR_KM = 1.50, TARIFA_MINIMA = 12.00, RADIO_KM = 0.8;
const MATRIZ_TARIFAS = {"1-2":12,"1-3":17,"2-3":12,"9-10":17,"10-11":15};
const DESCUENTOS = {normal:0,adulto:0.50,estudiante:0.50,maestro:0.50};
const localidades = [
  {id:1,nombre:"Central Querétaro",km:0,lat:20.5831,lon:-100.3896},
  {id:2,nombre:"Parque B. Quintana",km:8,lat:20.5950,lon:-100.3700},
  {id:3,nombre:"La Piedad",km:18,lat:20.6100,lon:-100.3200},
  {id:4,nombre:"Galeras",km:28,lat:20.6300,lon:-100.2600},
  {id:5,nombre:"Buena Vista",km:38,lat:20.6500,lon:-100.2000},
  {id:6,nombre:"Pie de Gallo",km:48,lat:20.6700,lon:-100.1400},
  {id:7,nombre:"Ajuchitlán",km:58,lat:20.6900,lon:-100.0800},
  {id:8,nombre:"Peña de Bernal",km:70,lat:20.7404,lon:-99.9411},
  {id:9,nombre:"Ezequiel Montes",km:80,lat:20.7167,lon:-99.8833},
  {id:10,nombre:"Cadereyta",km:95,lat:20.7000,lon:-99.8000},
  {id:11,nombre:"Bizarrón",km:110,lat:20.7800,lon:-99.7200},
  {id:12,nombre:"Peña Blanca",km:125,lat:20.9000,lon:-99.6500},
  {id:13,nombre:"Pinal de Amoles",km:145,lat:21.1354,lon:-99.6256},
  {id:14,nombre:"Jalpan de Serra",km:200,lat:21.2167,lon:-99.4667}
];

let estado = {
  localidadActual:null,destinoSeleccionado:null,tarifaBaseUnitaria:0,
  gpsActivo:false,metodoCalculo:'',
  cantidades:{normal:0,adulto:0,estudiante:0,maestro:0},
  pasajerosABordo:[],alertaMostradaEn:null,billeteSeleccionado:null,
  alertaActual:null
};

// ============ VALIDACIÓN RUTA ACTIVA ============
const rutaActiva = JSON.parse(localStorage.getItem('rutaActiva'));
if (!rutaActiva || rutaActiva.estado === 'terminado') {
  alert('⚠ Esta ruta ya fue terminada.\nNo se puede acceder al boletero.');
  window.location.href = 'index.html';
} else {
  document.getElementById('headerRuta').textContent = `🎫 ${rutaActiva.origen} → ${rutaActiva.destino}`;
  document.getElementById('headerOperador').textContent = `👤 ${rutaActiva.operador} · 🚛 ${rutaActiva.unidad}`;
}

// ============ ALERTAS ============
let intervaloAlertas = null;
async function verificarAlertas() {
  if (CONFIG.USAR_SHEETS && CONFIG.APPS_SCRIPT_URL !== 'TU_URL_DE_APPS_SCRIPT') {
    try {
      const resp = await fetch(`${CONFIG.APPS_SCRIPT_URL}?action=getAlertas&operadorId=${rutaActiva?.operadorId || 'OPE001'}`);
      const data = await resp.json();
      if (data.alerta && data.alerta.id !== estado.alertaActual?.id) {
        estado.alertaActual = data.alerta;
        document.getElementById('btnAlertaFlotante').classList.add('tiene-alertas');
      }
    } catch(e) {}
  }
}
function mostrarAlerta() {
  if (!estado.alertaActual) return;
  document.getElementById('alertaMensaje').textContent = estado.alertaActual.mensaje;
  document.getElementById('alertaFecha').textContent = '📅 ' + estado.alertaActual.fecha;
  document.getElementById('popupAlertaOverlay').classList.add('active');
}
function cerrarAlerta() {
  document.getElementById('popupAlertaOverlay').classList.remove('active');
  document.getElementById('btnAlertaFlotante').classList.remove('tiene-alertas');
  estado.alertaActual = null;
}

// ============ GPS + MAPA ============
let mapa=null, marcadorBus=null, gpsWatch=null;
function iniciarMapa() {
  if(mapa) return;
  mapa = L.map('minimapa',{zoomControl:false,attributionControl:false,dragging:false,scrollWheelZoom:false,touchZoom:false}).setView([20.85,-99.95],9);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{maxZoom:16}).addTo(mapa);
  L.polyline(localidades.map(l=>[l.lat,l.lon]),{color:'#f59e0b',weight:2,opacity:0.4,dashArray:'6,4'}).addTo(mapa);
  localidades.forEach(loc=>{L.marker([loc.lat,loc.lon],{icon:L.divIcon({html:'<div style="width:8px;height:8px;background:#f59e0b;border-radius:50%"></div>',iconSize:[8,8]})}).addTo(mapa).bindTooltip(loc.nombre)});
}
function actualizarMapa(lat,lon) {
  const iconBus = L.divIcon({html:'<div style="font-size:22px;filter:drop-shadow(0 0 4px #22c55e)">🚌</div>',iconSize:[28,28],iconAnchor:[14,14]});
  if(!marcadorBus) marcadorBus = L.marker([lat,lon],{icon:iconBus,zIndexOffset:1000}).addTo(mapa);
  else marcadorBus.setLatLng([lat,lon]);
  mapa.setView([lat,lon],12);
}
function distKm(lat1,lon1,lat2,lon2){const R=6371,dL=(lat2-lat1)*Math.PI/180,dO=(lon2-lon1)*Math.PI/180;return R*2*Math.atan2(Math.sqrt(Math.sin(dL/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dO/2)**2),Math.sqrt(1-Math.sin(dL/2)**2-Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dO/2)**2))}
function onPosicion(pos) {
  document.getElementById('precisionGPS').textContent = Math.round(pos.coords.accuracy)+'m';
  actualizarMapa(pos.coords.latitude, pos.coords.longitude);
  let best=null,min=Infinity;
  localidades.forEach(l=>{const d=distKm(pos.coords.latitude,pos.coords.longitude,l.lat,l.lon);if(d<min){min=d;best=l}});
  if(min<=RADIO_KM&&best){estado.localidadActual=best;document.getElementById('nombreLocalidad').textContent=best.nombre;document.getElementById('nombreLocalidad').style.color='var(--amarillo-texto)';verificarBajada(best)}
  else if(best){estado.localidadActual=best;document.getElementById('nombreLocalidad').textContent='→ '+best.nombre;document.getElementById('nombreLocalidad').style.color='var(--gris-texto)'}
  actualizarIndicadores();
}
function iniciarGPS(){if(!navigator.geolocation)return;iniciarMapa();if(gpsWatch)navigator.geolocation.clearWatch(gpsWatch);gpsWatch=navigator.geolocation.watchPosition(onPosicion,()=>{},{enableHighAccuracy:true,maximumAge:1000,timeout:15000});estado.gpsActivo=true}
function verificarBajada(localidad){if(estado.alertaMostradaEn===localidad.id)return;const grupos=estado.pasajerosABordo.filter(g=>g.destinoId===localidad.id);if(!grupos.length)return;let total=0;grupos.forEach(g=>{Object.values(g.cantidades).forEach(c=>total+=c)});if(confirm(`🔻 BAJAN PASAJEROS\n\n📍 ${localidad.nombre}\n${total} pasajero(s) bajan aquí\nQuedan ${totalABordo()-total} a bordo\n\n¿Confirmar bajada?`)){estado.pasajerosABordo=estado.pasajerosABordo.filter(g=>g.destinoId!==localidad.id);estado.alertaMostradaEn=localidad.id;actualizarIndicadores()}}

// ============ HELPERS ============
function totalABordo(){let t=0;estado.pasajerosABordo.forEach(g=>{Object.values(g.cantidades).forEach(c=>t+=c)});return t}
function pasajerosPorBajarEn(lid){let t=0;estado.pasajerosABordo.filter(g=>g.destinoId===lid).forEach(g=>{Object.values(g.cantidades).forEach(c=>t+=c)});return t}
function calcularTarifa(oid,did,ko,kd){const c=`${oid}-${did}`;if(MATRIZ_TARIFAS[c]!==undefined){estado.metodoCalculo='matriz';return MATRIZ_TARIFAS[c]}estado.metodoCalculo='kilometro';return Math.round(Math.max(TARIFA_MINIMA+(kd-ko)*TARIFA_POR_KM,TARIFA_MINIMA))}
function precioPorTipo(tipo){return Math.round(estado.tarifaBaseUnitaria*(1-(DESCUENTOS[tipo]||0)))}
function totalGeneral(){let t=0;Object.keys(estado.cantidades).forEach(tipo=>t+=estado.cantidades[tipo]*precioPorTipo(tipo));return t}
function totalPasajerosGrupo(){return Object.values(estado.cantidades).reduce((a,b)=>a+b,0)}
function actualizarIndicadores(){document.getElementById('numABordo').textContent=totalABordo();const pb=estado.localidadActual?pasajerosPorBajarEn(estado.localidadActual.id):0;document.getElementById('numBajan').textContent=pb;document.getElementById('indicadorBajan').classList.toggle('alerta',pb>0)}

// ============ COBRO ============
function cambiarCantidad(tipo,delta){if(estado.cantidades[tipo]+delta<0)return;if(totalPasajerosGrupo()+delta>10)return;estado.cantidades[tipo]+=delta;document.getElementById(`cant-${tipo}`).textContent=estado.cantidades[tipo];document.getElementById(`sub-${tipo}`).textContent=estado.cantidades[tipo]>0?`${estado.cantidades[tipo]}×$${precioPorTipo(tipo)}=$${estado.cantidades[tipo]*precioPorTipo(tipo)}`:'';document.querySelector(`#card-${tipo} .btn-menos`).disabled=estado.cantidades[tipo]===0;const total=totalGeneral();document.getElementById('cobroTotalMonto').textContent='$'+total;document.getElementById('btnCobrarFinal').disabled=total===0}
function calcularVuelto(billete){const total=totalGeneral();if(total===0)return;if(estado.billeteSeleccionado===billete){estado.billeteSeleccionado=null;document.getElementById('vueltoResultado').textContent='';return}estado.billeteSeleccionado=billete;const vuelto=billete-total;document.getElementById('vueltoResultado').textContent=vuelto<0?'⚠ Insuf.':'$'+vuelto}
function abrirModalCobro(destino,tarifa){estado.destinoSeleccionado=destino;estado.tarifaBaseUnitaria=tarifa;estado.cantidades={normal:0,adulto:0,estudiante:0,maestro:0};estado.billeteSeleccionado=null;document.getElementById('cobroOrigenNombre').textContent=estado.localidadActual.nombre;document.getElementById('cobroDestinoNombre').textContent=destino.nombre;['normal','adulto','estudiante','maestro'].forEach(tipo=>{document.getElementById(`precio-${tipo}`).textContent='$'+precioPorTipo(tipo);document.getElementById(`cant-${tipo}`).textContent='0';document.getElementById(`sub-${tipo}`).textContent='';document.querySelector(`#card-${tipo} .btn-menos`).disabled=true});document.getElementById('cobroTotalMonto').textContent='$0';document.getElementById('btnCobrarFinal').disabled=true;document.getElementById('vueltoResultado').textContent='';document.getElementById('modalDestino').classList.remove('active');document.getElementById('modalCobro').classList.add('active')}
function cerrarModalCobro(){document.getElementById('modalCobro').classList.remove('active')}
function confirmarCobro(){if(totalPasajerosGrupo()===0)return;estado.pasajerosABordo.push({destinoId:estado.destinoSeleccionado.id,destinoNombre:estado.destinoSeleccionado.nombre,cantidades:{...estado.cantidades}});const historial=JSON.parse(localStorage.getItem('viajes')||'[]');historial.push({fecha:new Date().toISOString(),origen:estado.localidadActual.nombre,destino:estado.destinoSeleccionado.nombre,tarifaBase:estado.tarifaBaseUnitaria,metodo:estado.metodoCalculo,cantidades:{...estado.cantidades},total:totalGeneral()});localStorage.setItem('viajes',JSON.stringify(historial));estado.alertaMostradaEn=null;actualizarIndicadores();document.getElementById('toastMonto').textContent='$'+totalGeneral();document.getElementById('toastCobro').classList.add('active');cerrarModalCobro()}
function cerrarToast(){document.getElementById('toastCobro').classList.remove('active')}

// ============ DESTINO ============
function abrirModalDestino(){if(!estado.localidadActual){alert('⚠ Esperando GPS...');return}document.getElementById('origenModal').textContent=estado.localidadActual.nombre;const lista=document.getElementById('listaDestinos');lista.innerHTML='';localidades.filter(l=>l.km>estado.localidadActual.km).forEach(d=>{const tarifa=calcularTarifa(estado.localidadActual.id,d.id,estado.localidadActual.km,d.km);const item=document.createElement('div');item.className='destino-item';item.innerHTML=`<span class="destino-nombre">📍 ${d.nombre}</span><span class="destino-tarifa">$${tarifa}</span>`;item.onclick=()=>abrirModalCobro(d,tarifa);lista.appendChild(item)});document.getElementById('modalDestino').classList.add('active')}
function cerrarModalDestino(){document.getElementById('modalDestino').classList.remove('active')}

// ============ REPORTE ============
function mostrarReporte(){alert('📊 Reporte de ingresos disponible en Google Sheets')}

// ============ QR ============
function mostrarQR(){document.getElementById('modalQR').classList.add('active');const qr=document.getElementById('qrcode');qr.innerHTML='';new QRCode(qr,{text:window.location.href,width:256,height:256,colorDark:'#0a0a0a',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M})}

// ============ INICIO ============
iniciarMapa();iniciarGPS();actualizarIndicadores();
verificarAlertas();
intervaloAlertas = setInterval(verificarAlertas, 30000);
</script>
