<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Matriz Multi-Estado</title>
    <style>
        :root {
            --bg: #0a0a0a; --surface: #1e293b; --text: #f1f5f9;
            --amber: #f59e0b; --green: #22c55e; --muted: #94a3b8; --red: #ef4444; --blue: #3b82f6;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg); color: var(--text);
            font-family: 'Segoe UI', sans-serif; padding: 20px; min-height: 100vh;
        }
        .container { max-width: 700px; margin: 0 auto; }
        h1 { color: var(--amber); text-align: center; font-size: 20px; margin-bottom: 4px; }
        .sub { color: var(--muted); text-align: center; font-size: 12px; margin-bottom: 18px; }

        .status-bar {
            background: var(--surface); padding: 12px 14px; border-radius: 10px;
            margin-bottom: 14px; font-size: 11px; text-align: center;
            border: 1px solid #334155; line-height: 1.6;
        }
        .status-bar.conectado { border-color: var(--green); }
        .status-bar.error { border-color: var(--red); color: var(--red); }

        .card {
            background: var(--surface); padding: 16px; border-radius: 12px;
            margin-bottom: 12px; border: 1px solid #334155;
        }
        .card h3 { color: var(--amber); font-size: 14px; margin-bottom: 10px; }
        .card label { color: var(--amber); font-size: 11px; font-weight: 600; display: block; margin-bottom: 5px; }
        .card input, .card select {
            width: 100%; padding: 10px; background: #0f172a; color: var(--text);
            border: 1px solid #475569; border-radius: 8px; font-size: 13px; margin-bottom: 8px;
        }
        .card input:focus, .card select:focus { outline: none; border-color: var(--amber); }

        .btn {
            padding: 10px 16px; border: none; border-radius: 8px;
            font-weight: 700; cursor: pointer; font-size: 12px; transition: all .15s; width: 100%;
        }
        .btn:active { transform: scale(.96); }
        .btn-amber { background: var(--amber); color: #0a0a0a; }
        .btn-green { background: var(--green); color: #fff; }
        .btn-red { background: transparent; color: var(--red); border: 1px solid var(--red); }
        .btn-blue { background: var(--blue); color: #fff; }
        .btn-row { display: flex; gap: 8px; }
        .btn-row .btn { flex: 1; }

        .lista-item {
            background: #0f172a; padding: 7px 10px; border-radius: 6px;
            font-size: 11px; margin-bottom: 3px; display: flex; justify-content: space-between;
            border-left: 3px solid var(--amber); align-items: center;
        }
        .lista-item .info { color: var(--muted); font-size: 10px; flex: 1; margin: 0 8px; }
        .lista-item .nombre { color: var(--amber); font-weight: 600; }
        .lista-item .delete { color: var(--red); cursor: pointer; font-weight: 700; font-size: 14px; }

        .output-card {
            background: var(--surface); padding: 16px; border-radius: 12px;
            margin-top: 12px; border: 2px solid var(--green); display: none;
        }
        .output-card h3 { color: var(--green); margin-bottom: 10px; font-size: 14px; }
        pre {
            background: #0f172a; color: #22c55e; padding: 12px; border-radius: 8px;
            font-size: 10px; overflow-x: auto; white-space: pre-wrap; max-height: 400px; overflow-y: auto;
        }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.9); display: none; justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-overlay.active { display: flex; }
        .modal-box {
            background: var(--surface); padding: 20px; border-radius: 12px;
            text-align: center; border: 2px solid var(--amber); max-width: 400px; width: 90%;
        }
        .modal-box h3 { color: var(--amber); margin-bottom: 12px; }
        .modal-box .btn { margin: 6px 0; }

        .tag {
            display: inline-block; padding: 3px 8px; border-radius: 12px;
            font-size: 10px; font-weight: 700; margin: 2px;
        }
        .tag-qro { background: rgba(34,197,94,.2); color: var(--green); }
        .tag-chih { background: rgba(59,130,246,.2); color: var(--blue); }
        .tag-yuc { background: rgba(245,158,11,.2); color: var(--amber); }

        .toast {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: var(--green); color: #fff; padding: 8px 18px;
            border-radius: 20px; font-size: 12px; opacity: 0; transition: opacity .3s; z-index: 2000;
        }
        .toast.show { opacity: 1; }
        .toast.warn { background: var(--red); }
    </style>
</head>
<body>
<div class="container">
    <h1>🗺️ Generador de Matriz Multi-Estado</h1>
    <p class="sub">Conectado a matriz_queretaro.js · Agrega estados, municipios y subparadas</p>

    <div class="status-bar" id="statusBar">⏳ Cargando matriz...</div>

    <!-- Paso 0: Elegir acción -->
    <div class="card" id="cardAccion">
        <h3>📋 ¿Qué deseas hacer?</h3>
        <div id="resumenEstados" style="font-size:11px;color:var(--muted);margin-bottom:12px;"></div>
        <div class="btn-row">
            <button class="btn btn-amber" onclick="mostrarNuevoEstado()">➕ NUEVO ESTADO</button>
            <button class="btn btn-blue" onclick="mostrarEstadosExistentes()">📂 ESTADO EXISTENTE</button>
        </div>
    </div>

    <!-- Paso 1: Nuevo estado -->
    <div class="card" id="cardNuevoEstado" style="display:none;">
        <h3>➕ Agregar Nuevo Estado</h3>
        <label>Nombre del estado</label>
        <input type="text" id="inputEstadoNombre" placeholder="Ej: Chihuahua">
        <label>Clave (abreviatura para bKm)</label>
        <input type="text" id="inputEstadoClave" placeholder="Ej: CHIH">
        <label>bKm (costo por kilómetro)</label>
        <input type="text" id="inputEstadoBKm" placeholder="Ej: 1.80">
        <label>ID base (siguiente disponible: <span id="idBaseSugerido">1000</span>)</label>
        <input type="text" id="inputEstadoIdBase" placeholder="Ej: 1000">
        <div class="btn-row">
            <button class="btn btn-amber" onclick="crearEstado()">✅ CREAR ESTADO</button>
            <button class="btn btn-red" onclick="volverInicio()">❌ CANCELAR</button>
        </div>
    </div>

    <!-- Paso 2: Agregar subparadas -->
    <div class="card" id="cardSubparadas" style="display:none;">
        <h3>📍 Agregar Subparadas — <span id="tituloEstadoActivo"></span></h3>
        <label>Municipio (ID y nombre)</label>
        <div class="btn-row">
            <input type="text" id="inputMunicipioId" placeholder="ID municipio" style="flex:1;">
            <input type="text" id="inputMunicipioNombre" placeholder="Nombre municipio" style="flex:2;">
        </div>
        <button class="btn btn-amber" onclick="agregarMunicipio()" style="margin-bottom:10px;">🏙️ AGREGAR MUNICIPIO</button>
        
        <label>📌 Coordenadas de subparada</label>
        <input type="text" id="inputCoordenadas" placeholder="Ej: 20.5711, -100.2814">
        <label>✏️ Nombre de subparada</label>
        <input type="text" id="inputNombre" placeholder="Ej: Parque Bernardo Quintana">
        <button class="btn btn-amber" onclick="agregarSubparada()">📍 AGREGAR SUBPARADA</button>
        
        <h3 style="margin-top:12px;">📋 Acumulado (<span id="contador">0</span>)</h3>
        <div id="listaSubparadas" style="max-height:200px;overflow-y:auto;"><span style="color:var(--muted);font-size:11px;">Sin subparadas</span></div>
        
        <div class="btn-row" style="margin-top:10px;">
            <button class="btn btn-green" onclick="abrirModalFinalizar()">✅ FINALIZAR</button>
            <button class="btn btn-red" onclick="volverInicio()">🗑️ CANCELAR</button>
        </div>
    </div>

    <!-- Modal finalizar -->
    <div class="modal-overlay" id="modalFinalizar">
        <div class="modal-box">
            <h3>✅ ¿Qué deseas generar?</h3>
            <button class="btn btn-blue" onclick="generarTXT('parcial')">📄 Opción A: TXT con subparadas nuevas</button>
            <button class="btn btn-green" onclick="generarTXT('completa')">🗺️ Opción B: matriz_queretaro.js COMPLETA</button>
            <button class="btn btn-red" onclick="cerrarModal()">❌ CANCELAR</button>
        </div>
    </div>

    <!-- Output -->
    <div class="output-card" id="outputCard">
        <h3>📄 Archivo Generado</h3>
        <pre id="codigoOutput"></pre>
        <div class="btn-row">
            <button class="btn btn-green" onclick="descargarArchivo()">💾 DESCARGAR</button>
            <button class="btn btn-blue" onclick="copiarTXT()">📋 COPIAR</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script src="matriz_queretaro.js"></script>

<script>
    // ===== VARIABLES GLOBALES =====
    var matrizCargada = false;
    var estadosDetectados = [];
    var subparadas = [];
    var municipios = [];
    var estadoActivo = null;
    var idBaseActual = 100;
    var tipoGeneracion = 'parcial';

    // ===== INICIALIZACIÓN =====
    function verificarMatriz() {
        var bar = document.getElementById('statusBar');
        if (typeof localidadesObj !== 'undefined' && typeof coordenadasLocalidades !== 'undefined' && typeof MATRIZ_QUERETARO !== 'undefined') {
            matrizCargada = true;
            detectarEstados();
            var totalLoc = Object.keys(localidadesObj).length;
            bar.innerHTML = '✅ Matriz cargada · ' + estadosDetectados.length + ' estado(s) · ' + totalLoc + ' localidades';
            bar.className = 'status-bar conectado';
            actualizarResumen();
        } else {
            bar.textContent = '❌ Error: No se encontró matriz_queretaro.js';
            bar.className = 'status-bar error';
        }
    }

    function detectarEstados() {
        estadosDetectados = [];
        var ids = Object.keys(localidadesObj).map(Number).filter(function(n) { return !isNaN(n); });
        if (ids.length === 0) return;
        
        // Detectar estados por comentarios en el código (no se puede leer el source desde JS)
        // Por ahora, usamos la estructura: cada bloque de 1000 IDs es un estado
        var maxId = Math.max.apply(null, ids);
        var numEstados = Math.ceil(maxId / 1000);
        
        // Buscar constantes bKm en window
        var claves = Object.keys(window).filter(function(k) { return k.indexOf('bKm_') === 0; });
        
        for (var i = 0; i < numEstados; i++) {
            var base = i * 1000 + 1;
            if (base === 1) base = 1; // Primer estado empieza en 1
            else base = i * 1000;
            
            var nombreEstado = 'Estado ' + (i+1);
            // Intentar detectar nombre de la primera localidad del rango
            if (localidadesObj[base]) {
                nombreEstado = localidadesObj[base].replace(' (Centro)', '').replace(' terminal', '');
            }
            
            var clave = '';
            if (claves.length > i) clave = claves[i].replace('bKm_', '');
            
            estadosDetectados.push({
                indice: i,
                nombre: nombreEstado,
                idBase: base,
                idMax: base + 998,
                clave: clave || 'EST' + (i+1),
                bKm: window[claves[i]] || 1.50
            });
        }
        
        idBaseActual = (estadosDetectados.length * 1000);
    }

    function actualizarResumen() {
        var div = document.getElementById('resumenEstados');
        if (estadosDetectados.length === 0) {
            div.innerHTML = '<span style="color:var(--muted);">No se detectaron estados. Crea el primero.</span>';
            document.getElementById('idBaseSugerido').textContent = '1';
            return;
        }
        var html = '<span style="color:var(--green);">Estados detectados:</span><br>';
        estadosDetectados.forEach(function(e) {
            html += '• ' + e.nombre + ' (IDs ' + e.idBase + '-' + e.idMax + ') bKm_' + e.clave + ' = ' + e.bKm + '<br>';
        });
        html += '<span style="color:var(--amber);">Siguiente ID base: ' + idBaseActual + '</span>';
        div.innerHTML = html;
        document.getElementById('idBaseSugerido').textContent = idBaseActual;
    }

    // ===== NAVEGACIÓN =====
    function mostrarNuevoEstado() {
        document.getElementById('cardAccion').style.display = 'none';
        document.getElementById('cardNuevoEstado').style.display = 'block';
        document.getElementById('cardSubparadas').style.display = 'none';
        document.getElementById('inputEstadoIdBase').value = idBaseActual;
    }

    function mostrarEstadosExistentes() {
        if (estadosDetectados.length === 0) {
            mostrarToast('⚠️ No hay estados. Crea uno primero.', true);
            return;
        }
        // Seleccionar el primer estado existente por ahora
        estadoActivo = estadosDetectados[0];
        iniciarSubparadas();
    }

    function crearEstado() {
        var nombre = document.getElementById('inputEstadoNombre').value.trim();
        var clave = document.getElementById('inputEstadoClave').value.trim();
        var bKm = parseFloat(document.getElementById('inputEstadoBKm').value.trim());
        var idBase = parseInt(document.getElementById('inputEstadoIdBase').value.trim());

        if (!nombre || !clave || isNaN(bKm) || isNaN(idBase)) {
            mostrarToast('⚠️ Llena todos los campos', true);
            return;
        }

        estadoActivo = {
            nombre: nombre,
            clave: clave.toUpperCase(),
            bKm: bKm,
            idBase: idBase,
            idMax: idBase + 998,
            esNuevo: true
        };

        document.getElementById('cardNuevoEstado').style.display = 'none';
        iniciarSubparadas();
        mostrarToast('✅ Estado creado: ' + nombre + ' (bKm_' + clave + ' = ' + bKm + ')');
    }

    function iniciarSubparadas() {
        subparadas = [];
        municipios = [];
        document.getElementById('cardAccion').style.display = 'none';
        document.getElementById('cardNuevoEstado').style.display = 'none';
        document.getElementById('cardSubparadas').style.display = 'block';
        document.getElementById('tituloEstadoActivo').textContent = estadoActivo.nombre + ' (IDs ' + estadoActivo.idBase + '-' + estadoActivo.idMax + ')';
        document.getElementById('contador').textContent = '0';
        document.getElementById('listaSubparadas').innerHTML = '<span style="color:var(--muted);font-size:11px;">Sin subparadas</span>';
        document.getElementById('inputCoordenadas').focus();
    }

    function volverInicio() {
        document.getElementById('cardAccion').style.display = 'block';
        document.getElementById('cardNuevoEstado').style.display = 'none';
        document.getElementById('cardSubparadas').style.display = 'none';
        document.getElementById('outputCard').style.display = 'none';
        subparadas = [];
        municipios = [];
        estadoActivo = null;
        actualizarResumen();
    }

    // ===== AGREGAR =====
    function agregarMunicipio() {
        var id = parseInt(document.getElementById('inputMunicipioId').value.trim());
        var nombre = document.getElementById('inputMunicipioNombre').value.trim();
        if (isNaN(id) || !nombre) { mostrarToast('⚠️ Llena ID y nombre del municipio', true); return; }
        
        var yaExiste = municipios.find(function(m) { return m.id === id; });
        if (yaExiste) { mostrarToast('⚠️ Ese ID ya existe', true); return; }
        
        municipios.push({ id: id, nombre: nombre });
        document.getElementById('inputMunicipioId').value = '';
        document.getElementById('inputMunicipioNombre').value = '';
        mostrarToast('🏙️ Municipio agregado: ' + nombre + ' (ID ' + id + ')');
    }

    function agregarSubparada() {
        if (!estadoActivo) return;
        var inputCoord = document.getElementById('inputCoordenadas').value.trim();
        var inputNombre = document.getElementById('inputNombre').value.trim();
        if (!inputCoord) { mostrarToast('⚠️ Pega las coordenadas', true); return; }
        if (!inputNombre) { mostrarToast('⚠️ Pon el nombre', true); return; }

        var partes = inputCoord.split(/[,;\s]+/).filter(function(p) { return p.length > 0; });
        if (partes.length < 2) { mostrarToast('⚠️ Formato: 20.5711, -100.2814', true); return; }
        var lat = parseFloat(partes[0]), lng = parseFloat(partes[1]);
        if (isNaN(lat) || isNaN(lng)) { mostrarToast('⚠️ Coordenadas no válidas', true); return; }

        var idNuevo = estadoActivo.idBase + subparadas.length + 1;
        if (estadoActivo.idBase === 1 && subparadas.length === 0) idNuevo = 101; // Para Qro

        subparadas.push({
            id: idNuevo, nombre: inputNombre, lat: lat, lng: lng
        });

        document.getElementById('inputCoordenadas').value = '';
        document.getElementById('inputNombre').value = '';
        document.getElementById('inputCoordenadas').focus();
        actualizarListaSubparadas();
        mostrarToast('✅ ID ' + idNuevo + ': ' + inputNombre);
    }

    function actualizarListaSubparadas() {
        document.getElementById('contador').textContent = subparadas.length;
        var lista = document.getElementById('listaSubparadas');
        if (subparadas.length === 0) {
            lista.innerHTML = '<span style="color:var(--muted);font-size:11px;">Sin subparadas</span>';
            return;
        }
        lista.innerHTML = '';
        subparadas.forEach(function(s, i) {
            var div = document.createElement('div');
            div.className = 'lista-item';
            div.innerHTML = 
                '<span>ID ' + s.id + '</span>' +
                '<span class="nombre">' + s.nombre + '</span>' +
                '<span class="info">' + s.lat.toFixed(4) + ', ' + s.lng.toFixed(4) + '</span>' +
                '<span class="delete" onclick="eliminarSubparada(' + i + ')">✕</span>';
            lista.appendChild(div);
        });
    }

    function eliminarSubparada(i) {
        subparadas.splice(i, 1);
        actualizarListaSubparadas();
        mostrarToast('🗑️ Eliminada');
    }

    // ===== FINALIZAR =====
    function abrirModalFinalizar() {
        if (subparadas.length === 0 && municipios.length === 0) {
            mostrarToast('⚠️ Agrega al menos una subparada o municipio', true);
            return;
        }
        document.getElementById('modalFinalizar').classList.add('active');
    }

    function cerrarModal() {
        document.getElementById('modalFinalizar').classList.remove('active');
    }

    function generarTXT(tipo) {
        tipoGeneracion = tipo;
        cerrarModal();
        
        var txt = '';
        var bKmVar = 'bKm_' + estadoActivo.clave;
        var bKmValor = estadoActivo.bKm;

        if (tipo === 'completa') {
            // Generar matriz completa con todos los estados existentes + nuevo
            txt += '// ============================================================\n';
            txt += '// MATRIZ DE TARIFAS — MÉXICO\n';
            txt += '// ============================================================\n\n';
            
            // bKm por estado
            var todosEstados = estadosDetectados.slice();
            if (estadoActivo.esNuevo) todosEstados.push(estadoActivo);
            
            txt += '// ===== TARIFAS POR ESTADO =====\n';
            todosEstados.forEach(function(e) {
                txt += 'const bKm_' + e.clave + ' = ' + e.bKm + ';\n';
            });
            txt += '\n';
            
            txt += 'const localidadesObj = {\n';
            // Estados existentes
            Object.keys(localidadesObj).forEach(function(id) {
                txt += '    ' + id + ': "' + localidadesObj[id] + '",\n';
            });
            // Nuevos municipios
            municipios.forEach(function(m) {
                txt += '    ' + m.id + ': "' + m.nombre + '",\n';
            });
            // Nuevas subparadas
            subparadas.forEach(function(s) {
                txt += '    ' + s.id + ': "' + s.nombre + '",\n';
            });
            txt += '};\n\n';
            
            txt += 'const coordenadasLocalidades = {\n';
            Object.keys(coordenadasLocalidades).forEach(function(id) {
                var c = coordenadasLocalidades[id];
                txt += '    ' + id + ': { lat: ' + c.lat + ', lng: ' + c.lng + ' },\n';
            });
            municipios.forEach(function(m) {
                txt += '    ' + m.id + ': { lat: 0, lng: 0 },  // ' + m.nombre + '\n';
            });
            subparadas.forEach(function(s) {
                txt += '    ' + s.id + ': { lat: ' + s.lat + ', lng: ' + s.lng + ' },\n';
            });
            txt += '};\n\n';
            
            txt += 'const MATRIZ_QUERETARO = {\n';
            Object.keys(MATRIZ_QUERETARO).forEach(function(k) {
                txt += '    "' + k + '":{km:' + MATRIZ_QUERETARO[k].km + ', tarifa: ' + MATRIZ_QUERETARO[k].km + ' * bKm_' + (estadosDetectados[0] ? estadosDetectados[0].clave : 'QRO') + '},\n';
            });
            subparadas.forEach(function(s) {
                var munId = estadoActivo.idBase;
                if (estadoActivo.idBase === 1) munId = 1;
                txt += '    "' + munId + '-' + s.id + '":{km:0, tarifa: 0 * ' + bKmVar + '},  // ' + s.nombre + '\n';
            });
            txt += '};\n';
        } else {
            // Solo subparadas nuevas
            txt += '// ===== ' + estadoActivo.nombre.toUpperCase() + ' =====\n';
            txt += 'const ' + bKmVar + ' = ' + bKmValor + ';\n\n';
            
            txt += '// --- Agregar en localidadesObj ---\n';
            municipios.forEach(function(m) {
                txt += m.id + ': "' + m.nombre + '",\n';
            });
            subparadas.forEach(function(s) {
                txt += s.id + ': "' + s.nombre + '",\n';
            });
            
            txt += '\n// --- Agregar en coordenadasLocalidades ---\n';
            municipios.forEach(function(m) {
                txt += m.id + ': { lat: 0, lng: 0 },  // ' + m.nombre + '\n';
            });
            subparadas.forEach(function(s) {
                txt += s.id + ': { lat: ' + s.lat + ', lng: ' + s.lng + ' },\n';
            });
            
            txt += '\n// --- Agregar en MATRIZ_QUERETARO ---\n';
            var munId = estadoActivo.idBase;
            if (estadoActivo.idBase === 1) munId = 1;
            subparadas.forEach(function(s) {
                txt += '"' + munId + '-' + s.id + '":{km:0, tarifa: 0 * ' + bKmVar + '},  // ' + s.nombre + '\n';
            });
        }

        document.getElementById('codigoOutput').textContent = txt;
        document.getElementById('outputCard').style.display = 'block';
        document.getElementById('outputCard').scrollIntoView({ behavior: 'smooth' });
        mostrarToast('✅ Archivo generado (' + (tipo === 'completa' ? 'Matriz completa' : 'Subparadas nuevas') + ')');
    }

    function descargarArchivo() {
        var txt = document.getElementById('codigoOutput').textContent;
        if (!txt) return;
        var nombre = tipoGeneracion === 'completa' ? 'matriz_queretaro.js' : 'subparadas_' + (estadoActivo ? estadoActivo.clave.toLowerCase() : 'nuevo') + '.txt';
        var blob = new Blob([txt], { type: 'text/plain' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = nombre;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        mostrarToast('💾 Descargado: ' + nombre);
    }

    function copiarTXT() {
        var txt = document.getElementById('codigoOutput').textContent;
        navigator.clipboard.writeText(txt).then(function() {
            mostrarToast('✅ Copiado al portapapeles');
        }).catch(function() {
            mostrarToast('⚠️ Copia manualmente', true);
        });
    }

    function mostrarToast(msg, warn) {
        var t = document.getElementById('toast');
        t.textContent = msg;
        t.className = 'toast show' + (warn ? ' warn' : '');
        clearTimeout(window._tt);
        window._tt = setTimeout(function() { t.classList.remove('show', 'warn'); }, 2500);
    }

    // Enter para agregar
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && e.target.id === 'inputCoordenadas') {
            e.preventDefault();
            document.getElementById('inputNombre').focus();
        }
        if (e.key === 'Enter' && e.target.id === 'inputNombre') {
            e.preventDefault();
            agregarSubparada();
        }
    });

    verificarMatriz();
</script>
</body>
</html>
