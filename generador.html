<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Subparadas — Conectado a Matriz</title>
    <style>
        :root {
            --bg: #0a0a0a; --surface: #1e293b; --text: #f1f5f9;
            --amber: #f59e0b; --green: #22c55e; --muted: #94a3b8; --red: #ef4444; --blue: #3b82f6;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg); color: var(--text);
            font-family: 'Segoe UI', sans-serif; padding: 20px; min-height: 100vh;
        }
        .container { max-width: 650px; margin: 0 auto; }
        h1 { color: var(--amber); text-align: center; font-size: 20px; margin-bottom: 4px; }
        .sub { color: var(--muted); text-align: center; font-size: 12px; margin-bottom: 18px; }

        .status-bar {
            background: var(--surface); padding: 10px 14px; border-radius: 10px;
            margin-bottom: 12px; font-size: 11px; text-align: center;
            border: 1px solid #334155;
        }
        .status-bar.conectado { border-color: var(--green); color: var(--green); }
        .status-bar.error { border-color: var(--red); color: var(--red); }

        .input-card {
            background: var(--surface); padding: 16px; border-radius: 12px;
            margin-bottom: 10px; border: 1px solid #334155;
        }
        .input-card label { color: var(--amber); font-size: 12px; font-weight: 600; display: block; margin-bottom: 6px; }
        .input-card input {
            width: 100%; padding: 10px; background: #0f172a; color: var(--text);
            border: 1px solid #475569; border-radius: 8px; font-size: 13px;
        }
        .input-card input:focus { outline: none; border-color: var(--amber); }
        .btn {
            padding: 10px 16px; border: none; border-radius: 8px;
            font-weight: 700; cursor: pointer; font-size: 12px; transition: all .15s;
        }
        .btn:active { transform: scale(.96); }
        .btn-agregar { background: var(--amber); color: #0a0a0a; width: 100%; margin-top: 8px; }
        .btn-finalizar { background: var(--green); color: #fff; width: 100%; margin-top: 6px; }
        .btn-limpiar { background: transparent; color: var(--red); border: 1px solid var(--red); width: 100%; margin-top: 4px; }

        .lista-card {
            background: var(--surface); padding: 14px; border-radius: 12px;
            margin-bottom: 10px; border: 1px solid #334155;
        }
        .lista-card h3 { color: var(--amber); font-size: 13px; margin-bottom: 8px; }
        .lista-item {
            background: #0f172a; padding: 7px 10px; border-radius: 6px;
            font-size: 11px; margin-bottom: 3px; display: flex; justify-content: space-between;
            border-left: 3px solid var(--amber); align-items: center;
        }
        .lista-item .info { color: var(--muted); font-size: 10px; flex: 1; margin: 0 8px; }
        .lista-item .delete { color: var(--red); cursor: pointer; font-weight: 700; font-size: 14px; }

        .output-card {
            background: var(--surface); padding: 16px; border-radius: 12px;
            margin-top: 12px; border: 2px solid var(--green); display: none;
        }
        .output-card h3 { color: var(--green); margin-bottom: 10px; font-size: 14px; }
        pre {
            background: #0f172a; color: #22c55e; padding: 12px; border-radius: 8px;
            font-size: 10px; overflow-x: auto; white-space: pre-wrap; max-height: 350px; overflow-y: auto;
        }
        .btn-descargar { background: var(--green); color: #fff; width: 100%; margin-top: 8px; }
        .btn-copiar { background: var(--blue); color: #fff; width: 100%; margin-top: 4px; }

        .toast {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: var(--green); color: #fff; padding: 8px 18px;
            border-radius: 20px; font-size: 12px; opacity: 0; transition: opacity .3s; z-index: 2000;
        }
        .toast.show { opacity: 1; }
        .toast.warn { background: var(--red); }
    </style>
</head>
<body>
<div class="container">
    <h1>📍 Generador de Subparadas</h1>
    <p class="sub">Conectado a matriz_queretaro.js · Pega coordenadas de Google Maps</p>

    <div class="status-bar" id="statusBar">⏳ Cargando matriz...</div>

    <div class="input-card">
        <label>📌 Pegar coordenadas (tal cual de Google Maps)</label>
        <input type="text" id="inputCoordenadas" placeholder="Ej: 20.5711, -100.2814">
        <button class="btn btn-agregar" onclick="agregarCoordenada()">➕ AGREGAR</button>
    </div>

    <div class="lista-card">
        <h3>📋 Subparadas acumuladas (<span id="contador">0</span>)</h3>
        <div id="listaSubparadas"><span style="color:var(--muted);font-size:11px;">Sin subparadas aún</span></div>
    </div>

    <button class="btn btn-finalizar" onclick="generarTXT()">✅ FINALIZAR Y GENERAR TXT</button>
    <button class="btn btn-limpiar" onclick="limpiarTodo()">🗑️ Limpiar todo</button>

    <div class="output-card" id="outputCard">
        <h3>📄 TXT Generado — Listo para pegar en matriz_queretaro.js</h3>
        <pre id="codigoOutput"></pre>
        <button class="btn btn-descargar" onclick="descargarTXT()">💾 DESCARGAR TXT</button>
        <button class="btn btn-copiar" onclick="copiarTXT()">📋 COPIAR AL PORTAPAPELES</button>
    </div>
</div>

<div class="toast" id="toast"></div>

<!-- Carga de la matriz -->
<script src="matriz_queretaro.js"></script>

<script>
    var subparadas = [];
    var idBase = 100;
    var matrizCargada = false;
    var municipioDetectado = null;
    var municipioNombre = '';

    function verificarMatriz() {
        var bar = document.getElementById('statusBar');
        if (typeof localidadesObj !== 'undefined' && typeof coordenadasLocalidades !== 'undefined' && typeof MATRIZ_QUERETARO !== 'undefined') {
            matrizCargada = true;
            bar.textContent = '✅ Conectado a matriz_queretaro.js — ' + Object.keys(localidadesObj).length + ' localidades cargadas';
            bar.className = 'status-bar conectado';
        } else {
            bar.textContent = '❌ Error: No se encontró matriz_queretaro.js';
            bar.className = 'status-bar error';
        }
    }

    function detectarMunicipio(lat, lng) {
        var minDist = Infinity;
        var idDetectado = null;
        Object.keys(coordenadasLocalidades).forEach(function(id) {
            var c = coordenadasLocalidades[id];
            var dist = haversine(lat, lng, c.lat, c.lng);
            if (dist < minDist) {
                minDist = dist;
                idDetectado = parseInt(id);
            }
        });
        if (minDist < 30 && idDetectado && localidadesObj[idDetectado]) {
            return { id: idDetectado, nombre: localidadesObj[idDetectado], distancia: minDist.toFixed(2) };
        }
        return null;
    }

    function agregarCoordenada() {
        if (!matrizCargada) {
            mostrarToast('⚠️ La matriz no se ha cargado. Verifica matriz_queretaro.js', true);
            return;
        }
        var input = document.getElementById('inputCoordenadas').value.trim();
        if (!input) {
            mostrarToast('⚠️ Pega las coordenadas', true);
            return;
        }
        var partes = input.split(/[,;\s]+/).filter(function(p) { return p.length > 0; });
        if (partes.length < 2) {
            mostrarToast('⚠️ Formato inválido. Pega como: 20.5711, -100.2814', true);
            return;
        }
        var lat = parseFloat(partes[0]);
        var lng = parseFloat(partes[1]);
        if (isNaN(lat) || isNaN(lng)) {
            mostrarToast('⚠️ Coordenadas no válidas', true);
            return;
        }

        var detectado = detectarMunicipio(lat, lng);
        var municipioTxt = detectado ? ' → ' + detectado.nombre + ' (' + detectado.distancia + ' km)' : ' → No detectado';
        var idNuevo = idBase + subparadas.length + 1;

        var yaExiste = false;
        Object.keys(coordenadasLocalidades).forEach(function(id) {
            var c = coordenadasLocalidades[id];
            var dist = haversine(lat, lng, c.lat, c.lng);
            if (dist < 0.05) { yaExiste = id; }
        });
        if (yaExiste) {
            mostrarToast('⚠️ Ya existe ID ' + yaExiste + ': ' + localidadesObj[yaExiste] + ' — Verifica', true);
        }

        subparadas.push({
            id: idNuevo,
            lat: lat,
            lng: lng,
            municipioId: detectado ? detectado.id : null,
            municipioNombre: detectado ? detectado.nombre : 'No detectado',
            distanciaMunicipio: detectado ? detectado.distancia : '-',
            yaExiste: yaExiste ? true : false,
            existeId: yaExiste || null
        });

        if (detectado && !municipioDetectado) {
            municipioDetectado = detectado.id;
            municipioNombre = detectado.nombre;
        }

        document.getElementById('inputCoordenadas').value = '';
        document.getElementById('inputCoordenadas').focus();
        actualizarLista();
        mostrarToast('✅ Agregado ID ' + idNuevo + municipioTxt);
    }

    function actualizarLista() {
        var contador = document.getElementById('contador');
        var lista = document.getElementById('listaSubparadas');
        contador.textContent = subparadas.length;
        if (subparadas.length === 0) {
            lista.innerHTML = '<span style="color:var(--muted);font-size:11px;">Sin subparadas aún</span>';
            return;
        }
        lista.innerHTML = '';
        subparadas.forEach(function(s, i) {
            var div = document.createElement('div');
            div.className = 'lista-item';
            div.innerHTML = 
                '<span>ID ' + s.id + '</span>' +
                '<span class="info">' + s.lat.toFixed(4) + ', ' + s.lng.toFixed(4) + ' → ' + s.municipioNombre + ' (' + s.distanciaMunicipio + ' km)' + (s.yaExiste ? ' ⚠️ Ya existe' : '') + '</span>' +
                '<span class="delete" onclick="eliminarSubparada(' + i + ')">✕</span>';
            lista.appendChild(div);
        });
        if (subparadas.length > 0) {
            var conteo = {};
            subparadas.forEach(function(s) {
                if (s.municipioId) { conteo[s.municipioId] = (conteo[s.municipioId] || 0) + 1; }
            });
            var maxId = null, maxCount = 0;
            Object.keys(conteo).forEach(function(id) {
                if (conteo[id] > maxCount) { maxCount = conteo[id]; maxId = id; }
            });
            if (maxId) {
                municipioDetectado = parseInt(maxId);
                municipioNombre = localidadesObj[municipioDetectado];
            }
        }
    }

    function eliminarSubparada(i) {
        subparadas.splice(i, 1);
        actualizarLista();
        mostrarToast('🗑️ Subparada eliminada');
    }

    function generarTXT() {
        if (!matrizCargada) { mostrarToast('⚠️ Matriz no cargada', true); return; }
        if (subparadas.length === 0) { mostrarToast('⚠️ Agrega al menos una coordenada', true); return; }
        var bKm = (typeof bKm !== 'undefined') ? bKm : 1.50;
        var munId = municipioDetectado || 1;
        var munNombre = localidadesObj[munId] || 'Municipio ' + munId;
        var txt = '';
        txt += '// ===========================================\n';
        txt += '// SUBPARADAS PARA MUNICIPIO ' + munId + ' — ' + munNombre + '\n';
        txt += '// Generado: ' + new Date().toLocaleDateString('es-MX') + '\n';
        txt += '// Total subparadas: ' + subparadas.length + '\n';
        txt += '// bKm actual: ' + bKm + '\n';
        txt += '// ===========================================\n\n';
        txt += '// ——— Agregar en localidadesObj ———\n';
        subparadas.forEach(function(s) {
            txt += s.id + ': "",  // ← Pon el nombre aquí (detectado: ' + s.municipioNombre + ')\n';
        });
        txt += '\n// ——— Agregar en coordenadasLocalidades ———\n';
        subparadas.forEach(function(s) {
            txt += s.id + ': { lat: ' + s.lat + ', lng: ' + s.lng + ' },\n';
        });
        txt += '\n// ——— Agregar en MATRIZ_QUERETARO ———\n';
        subparadas.forEach(function(s) {
            txt += '"' + munId + '-' + s.id + '":{km:0, tarifa: 0 * bKm},  // ← Pon los km reales\n';
        });
        document.getElementById('codigoOutput').textContent = txt;
        document.getElementById('outputCard').style.display = 'block';
        document.getElementById('outputCard').scrollIntoView({ behavior: 'smooth' });
        mostrarToast('✅ TXT generado para municipio ' + munId + ' — ' + munNombre);
    }

    function descargarTXT() {
        if (!document.getElementById('codigoOutput').textContent) return;
        var blob = new Blob([document.getElementById('codigoOutput').textContent], { type: 'text/plain' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'subparadas_municipio_' + (municipioDetectado || 'x') + '.txt';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        mostrarToast('💾 TXT descargado');
    }

    function copiarTXT() {
        var txt = document.getElementById('codigoOutput').textContent;
        navigator.clipboard.writeText(txt).then(function() {
            mostrarToast('✅ Copiado al portapapeles');
        }).catch(function() {
            mostrarToast('⚠️ Copia manualmente', true);
        });
    }

    function limpiarTodo() {
        subparadas = [];
        municipioDetectado = null;
        municipioNombre = '';
        document.getElementById('outputCard').style.display = 'none';
        document.getElementById('codigoOutput').textContent = '';
        actualizarLista();
        mostrarToast('🗑️ Todo limpio');
    }

    function haversine(lat1, lng1, lat2, lng2) {
        var R = 6371;
        var dL = (lat2 - lat1) * Math.PI / 180;
        var dO = (lng2 - lng1) * Math.PI / 180;
        var a = Math.sin(dL/2) * Math.sin(dL/2) + Math.cos(lat1 * Math.PI/180) * Math.cos(lat2 * Math.PI/180) * Math.sin(dO/2) * Math.sin(dO/2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function mostrarToast(msg, warn) {
        var t = document.getElementById('toast');
        t.textContent = msg;
        t.className = 'toast show' + (warn ? ' warn' : '');
        clearTimeout(window._tt);
        window._tt = setTimeout(function() { t.classList.remove('show', 'warn'); }, 2500);
    }

    document.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && e.target.id === 'inputCoordenadas') {
            e.preventDefault();
            agregarCoordenada();
        }
    });

    verificarMatriz();
</script>
</body>
          </html>
