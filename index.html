<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Boletero Inteligente · Inicio</title>
    <style>
        :root {
            --negro:#0a0a0a;--amarillo:#f59e0b;--amarillo-texto:#fbbf24;--blanco:#f8fafc;
            --gris:#1e293b;--gris2:#334155;--verde:#22c55e;--rojo:#ef4444;--azul:#3b82f6;
            --morado:#a855f7;--naranja:#e85d04;--gris-texto:#94a3b8;
        }
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            background:var(--negro);color:var(--blanco);
            font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
            height:100vh;width:100vw;overflow:hidden;display:flex;flex-direction:column;
            user-select:none;-webkit-user-select:none;
        }
        .header{
            background:var(--gris);padding:1.5vh 4vw;height:8vh;
            display:flex;align-items:center;justify-content:space-between;
            border-bottom:0.4vh solid var(--amarillo);flex-shrink:0;
        }
        .header-titulo{font-size:5vw;font-weight:700;color:var(--amarillo)}
        .header-rol{font-size:3vw;color:var(--gris-texto);background:var(--gris2);padding:0.5vh 2vw;border-radius:1vh}
        .main-content{flex:1;overflow-y:auto;padding:2vh 4vw;display:flex;flex-direction:column;gap:2vh}
        .login-card{background:var(--gris);border-radius:2vh;padding:3vh 4vw;border:0.3vh solid var(--gris2);}
        .login-titulo{font-size:5vw;font-weight:700;margin-bottom:2vh;text-align:center}
        .login-input{
            width:100%;padding:2vh 3vw;background:var(--negro);color:var(--blanco);
            border:0.2vh solid var(--gris2);border-radius:1vh;font-size:4.5vw;margin-bottom:1.5vh;
        }
        .login-btn{
            width:100%;padding:2.5vh;background:var(--amarillo);color:var(--negro);
            border:none;border-radius:1.5vh;font-size:5vw;font-weight:700;cursor:pointer;
        }
        .login-error{color:var(--rojo);font-size:3.5vw;text-align:center;margin-top:1vh}
        .perfil-card{background:var(--gris);border-radius:2vh;padding:2vh 4vw;border:0.3vh solid var(--gris2);}
        .perfil-titulo{font-size:4vw;font-weight:700;margin-bottom:1vh}
        .perfil-info{font-size:3.5vw;color:var(--gris-texto);margin-bottom:0.5vh}
        .corridas-card{background:var(--gris);border-radius:2vh;padding:2vh 4vw;border:0.3vh solid var(--gris2);margin-top:2vh;}
        .corridas-titulo{font-size:4vw;font-weight:700;margin-bottom:1.5vh}
        .corrida-item{
            background:var(--negro);padding:1.5vh 3vw;border-radius:1vh;
            display:flex;justify-content:space-between;align-items:center;margin-bottom:1vh;border-left:1vw solid var(--verde);
        }
        .corrida-ruta{font-size:3.5vw;font-weight:600}
        .corrida-fecha{font-size:2.5vw;color:var(--gris-texto)}
        .corrida-total{font-size:4vw;font-weight:700;color:var(--verde)}
        .btn-nueva-corrida{
            padding:3vh;background:var(--verde);color:var(--blanco);border:none;border-radius:2vh;
            font-size:6vw;font-weight:800;cursor:pointer;text-align:center;width:100%;
            box-shadow:0 1vh 3vh rgba(34,197,94,0.3);margin-top:2vh;
        }
        .btn-ruta-nueva{
            padding:2.5vh;background:var(--azul);color:var(--blanco);border:none;border-radius:2vh;
            font-size:5vw;font-weight:700;cursor:pointer;text-align:center;width:100%;
        }
        .btn-salir{
            padding:2vh;background:transparent;color:var(--rojo);
            border:0.2vh solid var(--rojo);border-radius:1.5vh;font-size:4vw;cursor:pointer;text-align:center;
        }
        .modal-overlay{
            position:fixed;top:0;left:0;width:100vw;height:100vh;
            background:rgba(10,10,10,0.98);z-index:3000;display:none;flex-direction:column;padding:3vh 4vw;overflow-y:auto;
        }
        .modal-overlay.active{display:flex}
        .modal-title{font-size:7vw;font-weight:700;color:var(--amarillo-texto);text-align:center;margin-bottom:3vh}
        .modal-label{font-size:4vw;color:var(--gris-texto);margin-bottom:1vh}
        
        .search-container{position:relative;margin-bottom:2vh}
        .search-input{
            width:100%;padding:2vh 3vw;background:var(--negro);color:var(--blanco);
            border:0.2vh solid var(--amarillo);border-radius:1vh;font-size:4.5vw;
        }
        .search-input:focus{outline:none;border-color:var(--amarillo-texto)}
        .search-results{
            position:absolute;top:100%;left:0;right:0;max-height:30vh;overflow-y:auto;
            background:var(--gris);border:0.2vh solid var(--amarillo);border-radius:0 0 1vh 1vh;
            z-index:100;display:none;
        }
        .search-results.active{display:block}
        .search-item{
            padding:1.5vh 3vw;cursor:pointer;border-bottom:0.1vh solid var(--gris2);
            font-size:3.5vw;transition:background .15s;
        }
        .search-item:hover,.search-item.selected{background:var(--gris2);color:var(--amarillo-texto)}
        .search-item .km{color:var(--gris-texto);font-size:3vw;margin-left:2vw}
        
        .modal-btn{
            width:100%;padding:3vh;background:var(--verde);color:var(--blanco);
            border:none;border-radius:2vh;font-size:5.5vw;font-weight:700;cursor:pointer;margin-top:2vh;
        }
        .modal-cerrar{
            width:100%;padding:2.5vh;background:transparent;color:var(--rojo);
            border:0.2vh solid var(--rojo);border-radius:1.5vh;font-size:4.5vw;font-weight:700;cursor:pointer;margin-top:1.5vh;
        }
        .sin-datos{text-align:center;color:#555;padding:2vh;font-size:3.5vw}
        .seleccion-actual{
            background:var(--gris2);padding:1.5vh 3vw;border-radius:1vh;margin-bottom:1.5vh;
            font-size:3.5vw;color:var(--amarillo-texto);text-align:center;
        }
        .btn-invertir{
            width:100%;padding:2vh;background:var(--naranja);color:var(--blanco);
            border:none;border-radius:1.5vh;font-size:4.5vw;font-weight:700;cursor:pointer;
            margin-bottom:2vh;transition:all .15s;
        }
        .btn-invertir:active{transform:scale(.96)}
    </style>
</head>
<body>
<div class="header">
    <div class="header-titulo">🚌 BOLETERO INTELIGENTE</div>
    <div class="header-rol" id="headerRol" style="display:none;"></div>
</div>
<div class="main-content">
    <div class="login-card" id="loginCard">
        <div class="login-titulo">🔐 Iniciar Sesión</div>
        <input type="email" class="login-input" id="loginEmail" placeholder="Correo electrónico">
        <input type="password" class="login-input" id="loginPassword" placeholder="Contraseña">
        <button class="login-btn" onclick="iniciarSesion()">INGRESAR</button>
        <div class="login-error" id="loginError"></div>
    </div>
    <div id="panelOperador" style="display:none;">
        <div class="perfil-card">
            <div class="perfil-titulo">👤 Mi Perfil</div>
            <div class="perfil-info" id="perfilNombre"></div>
            <div class="perfil-info" id="perfilCamion"></div>
            <div class="perfil-info" id="perfilEmail"></div>
        </div>
        <div class="corridas-card">
            <div class="corridas-titulo">📋 Mis corridas anteriores</div>
            <div id="corridasLista"></div>
        </div>
        <button class="btn-nueva-corrida" onclick="abrirModalNuevaCorrida()">➕ AGREGAR NUEVA CORRIDA</button>
        <button class="btn-ruta-nueva" onclick="window.location.href='rutas_predefinidas.html'">🗺️ CREAR NUEVA RUTA</button>
    </div>
    <button class="btn-salir" id="btnSalir" onclick="cerrarSesion()" style="display:none;">🚪 Cerrar sesión</button>
</div>

<div class="modal-overlay" id="modalNuevaCorrida">
    <div class="modal-title">➕ NUEVA CORRIDA</div>
    
    <label class="modal-label">📁 Ruta guardada</label>
    <select id="selectRutaGuardada" onchange="cargarRutaGuardada()" style="width:100%;padding:2vh 3vw;background:var(--negro);color:var(--blanco);border:0.2vh solid var(--gris2);border-radius:1vh;font-size:5vw;margin-bottom:1.5vh;">
        <option value="">— Seleccionar ruta guardada —</option>
    </select>
    
    <button class="btn-invertir" id="btnInvertir" onclick="invertirRuta()" style="display:none;">🔄 INVERTIR RUTA</button>
    
    <label class="modal-label">🔍 Buscar ORIGEN</label>
    <div class="search-container">
        <input type="text" class="search-input" id="searchOrigen" placeholder="Escribe para buscar localidad..." oninput="filtrarLocalidades('origen')" onfocus="mostrarResultados('origen')" autocomplete="off">
        <div class="search-results" id="resultsOrigen"></div>
    </div>
    <div class="seleccion-actual" id="selOrigenTxt" style="display:none;"></div>
    <input type="hidden" id="selectOrigen" value="">

    <label class="modal-label">🔍 Buscar DESTINO</label>
    <div class="search-container">
        <input type="text" class="search-input" id="searchDestino" placeholder="Escribe para buscar localidad..." oninput="filtrarLocalidades('destino')" onfocus="mostrarResultados('destino')" autocomplete="off">
        <div class="search-results" id="resultsDestino"></div>
    </div>
    <div class="seleccion-actual" id="selDestinoTxt" style="display:none;"></div>
    <input type="hidden" id="selectDestino" value="">

    <button class="modal-btn" onclick="iniciarNuevaCorrida()">✅ INICIAR CORRIDA</button>
    <button class="modal-cerrar" onclick="cerrarModalNuevaCorrida()">❌ CANCELAR</button>
</div>

<script>

var MATRIZ_QUERETARO = {};
// Solo distancias desde Querétaro (id=1)
var kms={1:0,2:1,3:15,4:5,5:4,6:5,7:3,8:7,9:13,10:8,11:6,12:15,13:16,14:16,15:7,16:5,17:4,18:15,19:12,20:17,

115:190,116:195,117:188,118:210,119:215,120:205,121:200,122:212,123:218,
124:155,125:150,126:160,127:148,128:145,129:152,130:145,131:150,132:142,133:148,134:140,135:138};
Object.keys(kms).forEach(function(id){ MATRIZ_QUERETARO['1-'+id]={km:kms[id],tarifa:0}; });

var usuarios = JSON.parse(localStorage.getItem('usuarios')) || [
    {usuario_id:"USR001",nombre:"Juan Pérez Hernández",camion:"UH-1234",email:"juan@email.com",password:"123456",rol:"operador",estado:"Activo"},
    {usuario_id:"USR003",nombre:"Admin Sistema",camion:"—",email:"admin@email.com",password:"admin123",rol:"admin",estado:"Activo"}
];
var sesionActiva = null;
var localidadesFiltradas = [];

function inicializarLocalidades() {
    localidadesFiltradas = Object.keys(localidadesObj).map(function(id) {
        var idn = parseInt(id);
        var km = (MATRIZ_QUERETARO['1-'+idn]) ? MATRIZ_QUERETARO['1-'+idn].km : 0;
        return { id: idn, nombre: localidadesObj[idn], km: km };
    });
    localidadesFiltradas.sort(function(a, b) { return a.km - b.km; });
}

// BUSCADOR
function filtrarLocalidades(tipo) {
    var input = document.getElementById('search' + (tipo === 'origen' ? 'Origen' : 'Destino'));
    var resultsDiv = document.getElementById('results' + (tipo === 'origen' ? 'Origen' : 'Destino'));
    var query = input.value.trim().toLowerCase();
    if (query.length === 0) { resultsDiv.innerHTML = ''; resultsDiv.classList.remove('active'); return; }
    var filtradas = localidadesFiltradas.filter(function(loc) { return loc.nombre.toLowerCase().indexOf(query) >= 0; });
    if (filtradas.length === 0) { resultsDiv.innerHTML = '<div class="search-item" style="color:var(--gris-texto);">Sin resultados</div>'; }
    else { resultsDiv.innerHTML = filtradas.slice(0, 15).map(function(loc) { return '<div class="search-item" onclick="seleccionarLocalidad(\'' + tipo + '\', ' + loc.id + ', \'' + loc.nombre.replace(/'/g, "\\'") + '\')">📍 ' + loc.nombre + ' <span class="km">(' + loc.km + ' km)</span></div>'; }).join(''); }
    resultsDiv.classList.add('active');
}
function mostrarResultados(tipo) {
    var input = document.getElementById('search' + (tipo === 'origen' ? 'Origen' : 'Destino'));
    if (input.value.trim().length > 0) document.getElementById('results' + (tipo === 'origen' ? 'Origen' : 'Destino')).classList.add('active');
}
function seleccionarLocalidad(tipo, id, nombre) {
    document.getElementById('select' + (tipo === 'origen' ? 'Origen' : 'Destino')).value = id;
    document.getElementById('search' + (tipo === 'origen' ? 'Origen' : 'Destino')).value = nombre;
    document.getElementById('sel' + (tipo === 'origen' ? 'Origen' : 'Destino') + 'Txt').textContent = '✅ Seleccionado: ' + nombre;
    document.getElementById('sel' + (tipo === 'origen' ? 'Origen' : 'Destino') + 'Txt').style.display = 'block';
    document.getElementById('results' + (tipo === 'origen' ? 'Origen' : 'Destino')).classList.remove('active');
    if (document.getElementById('selectOrigen').value && document.getElementById('selectDestino').value) {
        document.getElementById('btnInvertir').style.display = 'block';
    }
}
document.addEventListener('click', function(e) {
    if (!e.target.closest('.search-container')) {
        document.querySelectorAll('.search-results').forEach(function(el) { el.classList.remove('active'); });
    }
});

// INVERTIR RUTA
function invertirRuta() {
    var origenId = parseInt(document.getElementById('selectOrigen').value);
    var destinoId = parseInt(document.getElementById('selectDestino').value);
    if (!origenId || !destinoId) { alert('⚠ Selecciona origen y destino primero'); return; }
    var tempId = origenId, tempNombre = document.getElementById('searchOrigen').value;
    document.getElementById('selectOrigen').value = destinoId;
    document.getElementById('searchOrigen').value = localidadesObj[destinoId] || '';
    document.getElementById('selOrigenTxt').textContent = '✅ Seleccionado: ' + (localidadesObj[destinoId] || '');
    document.getElementById('selOrigenTxt').style.display = 'block';
    document.getElementById('selectDestino').value = tempId;
    document.getElementById('searchDestino').value = tempNombre;
    document.getElementById('selDestinoTxt').textContent = '✅ Seleccionado: ' + tempNombre;
    document.getElementById('selDestinoTxt').style.display = 'block';
}

// LOGIN
function iniciarSesion() {
    var email = document.getElementById('loginEmail').value.trim();
    var password = document.getElementById('loginPassword').value.trim();
    var errorEl = document.getElementById('loginError');
    if(!email||!password){errorEl.textContent='Ingresa correo y contraseña';return}
    var usuario = usuarios.find(function(u){return u.email===email && u.estado==='Activo'});
    if(!usuario){errorEl.textContent='Usuario no encontrado';return}
    if(usuario.password!==password){errorEl.textContent='Contraseña incorrecta';return}
    errorEl.textContent='';sesionActiva=usuario;
    localStorage.setItem('sesionActiva',JSON.stringify(usuario));
    document.getElementById('loginCard').style.display='none';
    document.getElementById('panelOperador').style.display='flex';
    document.getElementById('panelOperador').style.flexDirection='column';
    document.getElementById('btnSalir').style.display='block';
    document.getElementById('headerRol').style.display='block';
    document.getElementById('headerRol').textContent='🚌 Operador';
    renderPanelOperador();
}
function cerrarSesion(){sesionActiva=null;localStorage.removeItem('sesionActiva');document.getElementById('loginCard').style.display='block';document.getElementById('panelOperador').style.display='none';document.getElementById('btnSalir').style.display='none';document.getElementById('headerRol').style.display='none';}
function renderPanelOperador(){
    if(!sesionActiva)return;
    document.getElementById('perfilNombre').textContent='👤 '+sesionActiva.nombre;
    document.getElementById('perfilCamion').textContent='🚛 Camión: '+sesionActiva.camion;
    document.getElementById('perfilEmail').textContent='📧 '+sesionActiva.email;
    var corridas=JSON.parse(localStorage.getItem('corridas')||'[]');
    var misCorridas=corridas.filter(function(c){return c.usuario_id===sesionActiva.usuario_id}).slice(-5).reverse();
    var lista=document.getElementById('corridasLista');
    if(misCorridas.length===0){lista.innerHTML='<div class="sin-datos">Sin corridas anteriores</div>';return}
    lista.innerHTML='';
    misCorridas.forEach(function(c){
        var item=document.createElement('div');item.className='corrida-item';
        item.innerHTML='<div><div class="corrida-ruta">📍 '+c.origen+' → '+c.destino+'</div><div class="corrida-fecha">📅 '+c.fecha+'</div></div><div class="corrida-total">$'+c.total+'</div>';
        lista.appendChild(item);
    });
}

// RUTAS GUARDADAS
function cargarRutasGuardadas() {
    var sel = document.getElementById('selectRutaGuardada');
    sel.innerHTML = '<option value="">— Seleccionar ruta guardada —</option>';
    var rutas = JSON.parse(localStorage.getItem('rutasPredefinidas') || '[]');
    rutas.forEach(function(r, i) {
        sel.innerHTML += '<option value="'+i+'">'+r.nombre+' ('+r.origen+' → '+r.destino+')</option>';
    });
}
function cargarRutaGuardada() {
    var index = parseInt(document.getElementById('selectRutaGuardada').value);
    if (isNaN(index)) { document.getElementById('btnInvertir').style.display = 'none'; return; }
    var rutas = JSON.parse(localStorage.getItem('rutasPredefinidas') || '[]');
    var ruta = rutas[index];
    if (!ruta) return;
    window._rutaGuardadaIndex = index;
    var locO = localidadesFiltradas.find(function(l) { return l.id === ruta.origenId; });
    var locD = localidadesFiltradas.find(function(l) { return l.id === ruta.destinoId; });
    if (locO) seleccionarLocalidad('origen', locO.id, locO.nombre);
    if (locD) seleccionarLocalidad('destino', locD.id, locD.nombre);
    document.getElementById('btnInvertir').style.display = 'block';
}

// NUEVA CORRIDA
function abrirModalNuevaCorrida() {
    if (!sesionActiva) { alert('⚠ Inicia sesión primero'); return; }
    document.getElementById('searchOrigen').value = '';
    document.getElementById('searchDestino').value = '';
    document.getElementById('selectOrigen').value = '';
    document.getElementById('selectDestino').value = '';
    document.getElementById('selOrigenTxt').style.display = 'none';
    document.getElementById('selDestinoTxt').style.display = 'none';
    document.getElementById('resultsOrigen').classList.remove('active');
    document.getElementById('resultsDestino').classList.remove('active');
    document.getElementById('btnInvertir').style.display = 'none';
    window._rutaGuardadaIndex = undefined;
    cargarRutasGuardadas();
    document.getElementById('modalNuevaCorrida').classList.add('active');
}
function cerrarModalNuevaCorrida() { document.getElementById('modalNuevaCorrida').classList.remove('active'); }
function iniciarNuevaCorrida() {
    var origenId = parseInt(document.getElementById('selectOrigen').value);
    var destinoId = parseInt(document.getElementById('selectDestino').value);
    if (!origenId || !destinoId) { alert('⚠ Selecciona origen y destino'); return; }
    if (origenId === destinoId) { alert('⚠ Origen y destino no pueden ser iguales'); return; }
    sesionActiva.origen = localidadesObj[origenId] || 'Sin ruta';
    sesionActiva.destino = localidadesObj[destinoId] || 'Sin ruta';
    sesionActiva.rutaGuardadaIndex = window._rutaGuardadaIndex;
    sesionActiva.hora_inicio = new Date().toLocaleTimeString('es-MX', {hour:'2-digit', minute:'2-digit'});
    localStorage.setItem('sesionActiva', JSON.stringify(sesionActiva));
    window.location.href = 'boletero.html';
}

// INICIO
inicializarLocalidades();
var sesionGuardada = JSON.parse(localStorage.getItem('sesionActiva'));
if (sesionGuardada) {
    sesionActiva = sesionGuardada;
    document.getElementById('loginCard').style.display = 'none';
    document.getElementById('panelOperador').style.display = 'flex';
    document.getElementById('panelOperador').style.flexDirection = 'column';
    document.getElementById('btnSalir').style.display = 'block';
    document.getElementById('headerRol').style.display = 'block';
    document.getElementById('headerRol').textContent = '🚌 Operador';
    renderPanelOperador();
}
</script>
