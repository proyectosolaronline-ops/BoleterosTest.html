<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Boletero Inteligente · Inicio</title>
    <style>
        :root {
            --negro:#0a0a0a;--amarillo:#f59e0b;--amarillo-texto:#fbbf24;--naranja:#e85d04;
            --blanco:#f8fafc;--gris:#1e293b;--gris2:#334155;--verde:#22c55e;--rojo:#ef4444;
            --azul:#3b82f6;--gris-texto:#94a3b8;
        }
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            background:var(--negro);color:var(--blanco);
            font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
            height:100vh;width:100vw;overflow:hidden;display:flex;flex-direction:column;
            user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
        }

        .header{
            background:var(--gris);padding:1.5vh 4vw;height:8vh;
            display:flex;align-items:center;justify-content:center;
            border-bottom:0.4vh solid var(--amarillo);flex-shrink:0;
        }
        .header-titulo{font-size:5vw;font-weight:700;color:var(--amarillo)}

        .main-content{flex:1;overflow-y:auto;padding:2vh 4vw;display:flex;flex-direction:column;gap:2vh}

        /* LOGIN */
        .login-card{
            background:var(--gris);border-radius:2vh;padding:2vh 4vw;
            border:0.3vh solid var(--gris2);
        }
        .login-titulo{font-size:4vw;font-weight:700;margin-bottom:1.5vh}
        .login-input{
            width:100%;padding:2vh 3vw;background:var(--negro);color:var(--blanco);
            border:0.2vh solid var(--gris2);border-radius:1vh;font-size:4.5vw;margin-bottom:1.5vh;
        }
        .login-input:focus{outline:none;border-color:var(--amarillo)}
        .login-btn{
            width:100%;padding:2.5vh;background:var(--amarillo);color:var(--negro);
            border:none;border-radius:1.5vh;font-size:5vw;font-weight:700;cursor:pointer;
        }
        .login-error{color:var(--rojo);font-size:3.5vw;text-align:center;margin-top:1vh}

        .selector-card{
            background:var(--gris);border-radius:2vh;padding:2vh 4vw;
            border:0.3vh solid var(--gris2);
        }
        .selector-titulo{font-size:4vw;font-weight:700;margin-bottom:1.5vh}
        .operador-lista{display:flex;flex-direction:column;gap:1vh}
        .operador-item{
            background:var(--negro);padding:2vh 4vw;border-radius:1.5vh;
            display:flex;justify-content:space-between;align-items:center;cursor:pointer;
            border:0.2vh solid transparent;
        }
        .operador-item.seleccionado{border-color:var(--amarillo);background:var(--gris2)}
        .operador-nombre{font-size:4.5vw;font-weight:600}
        .operador-camion{font-size:3.5vw;color:var(--gris-texto)}

        .corridas-card{
            background:var(--gris);border-radius:2vh;padding:2vh 4vw;
            border:0.3vh solid var(--gris2);
        }
        .corridas-titulo{font-size:4vw;font-weight:700;margin-bottom:1.5vh}
        .corrida-item{
            background:var(--negro);padding:1.5vh 3vw;border-radius:1vh;
            display:flex;justify-content:space-between;align-items:center;
            margin-bottom:1vh;border-left:1vw solid var(--verde);
        }
        .corrida-info{display:flex;flex-direction:column}
        .corrida-ruta{font-size:3.5vw;font-weight:600}
        .corrida-fecha{font-size:2.5vw;color:var(--gris-texto)}
        .corrida-total{font-size:4vw;font-weight:700;color:var(--verde)}

        .btn-nueva-corrida{
            padding:3vh;background:var(--verde);color:var(--blanco);border:none;border-radius:2vh;
            font-size:6vw;font-weight:800;cursor:pointer;text-align:center;
            box-shadow:0 1vh 3vh rgba(34,197,94,0.3);
        }
        .btn-nueva-corrida:disabled{background:var(--gris2);color:#555;box-shadow:none}
        .btn-salir{
            padding:2vh;background:transparent;color:var(--rojo);
            border:0.2vh solid var(--rojo);border-radius:1.5vh;
            font-size:4vw;cursor:pointer;text-align:center;
        }

        .modal-overlay{
            position:fixed;top:0;left:0;width:100vw;height:100vh;
            background:rgba(10,10,10,0.98);z-index:3000;display:none;flex-direction:column;padding:3vh 4vw;
        }
        .modal-overlay.active{display:flex}
        .modal-title{font-size:7vw;font-weight:700;color:var(--amarillo-texto);text-align:center;margin-bottom:3vh}
        .modal-label{font-size:4vw;color:var(--gris-texto);margin-bottom:1vh}
        .modal-select{
            width:100%;padding:2vh 3vw;background:var(--negro);color:var(--blanco);
            border:0.2vh solid var(--gris2);border-radius:1vh;font-size:5vw;margin-bottom:2vh;
        }
        .modal-select:focus{outline:none;border-color:var(--amarillo)}
        .modal-btn{
            width:100%;padding:3vh;background:var(--verde);color:var(--blanco);
            border:none;border-radius:2vh;font-size:5.5vw;font-weight:700;cursor:pointer;margin-top:2vh;
        }
        .modal-cerrar{
            width:100%;padding:2.5vh;background:transparent;color:var(--rojo);
            border:0.2vh solid var(--rojo);border-radius:1.5vh;font-size:4.5vw;font-weight:700;cursor:pointer;margin-top:1.5vh;
        }

        .sin-datos{text-align:center;color:#555;padding:2vh;font-size:3.5vw}
    </style>
</head>
<body>

<div class="header">
    <div class="header-titulo">🚌 BOLETERO INTELIGENTE</div>
</div>

<div class="main-content">
    <!-- LOGIN -->
    <div class="login-card" id="loginCard">
        <div class="login-titulo">🔐 Iniciar Sesión</div>
        <input type="email" class="login-input" id="loginEmail" placeholder="Correo electrónico (placeholder)">
        <input type="password" class="login-input" id="loginPassword" placeholder="Contraseña">
        <button class="login-btn" onclick="iniciarSesion()">INGRESAR</button>
        <div class="login-error" id="loginError"></div>
    </div>

    <!-- SELECCIONAR OPERADOR (OCULTO HASTA LOGIN) -->
    <div class="selector-card" id="selectorCard" style="display:none;">
        <div class="selector-titulo">👤 Selecciona tu perfil</div>
        <div class="operador-lista" id="operadorLista"></div>
    </div>

    <!-- CORRIDAS ANTERIORES (OCULTO HASTA LOGIN) -->
    <div class="corridas-card" id="corridasCard" style="display:none;">
        <div class="corridas-titulo">📋 Mis corridas anteriores</div>
        <div id="corridasLista"></div>
    </div>

    <!-- BOTÓN NUEVA CORRIDA (OCULTO HASTA LOGIN) -->
    <button class="btn-nueva-corrida" id="btnNuevaCorrida" onclick="abrirModalNuevaCorrida()" disabled style="display:none;">
        ➕ AGREGAR NUEVA CORRIDA
    </button>
    <button class="btn-salir" id="btnSalir" onclick="cerrarSesion()" style="display:none;">🚪 Cerrar sesión</button>
</div>

<!-- MODAL NUEVA CORRIDA -->
<div class="modal-overlay" id="modalNuevaCorrida">
    <div class="modal-title">➕ NUEVA CORRIDA</div>
    
    <label class="modal-label">📍 Origen</label>
    <select class="modal-select" id="selectOrigen"></select>
    
    <label class="modal-label">📍 Destino</label>
    <select class="modal-select" id="selectDestino"></select>
    
    <button class="modal-btn" onclick="iniciarNuevaCorrida()">✅ INICIAR CORRIDA</button>
    <button class="modal-cerrar" onclick="cerrarModalNuevaCorrida()">❌ CANCELAR</button>
</div>

<script>
// ============================================================
// DATOS
// ============================================================
const usuarios = JSON.parse(localStorage.getItem('usuarios')) || [
    {usuario_id:"USR001",nombre:"Juan Pérez Hernández",camion:"UH-1234",telefono:"4421234567",email:"juan@email.com",password:"123456",estado:"Activo"},
    {usuario_id:"USR002",nombre:"María López García",camion:"UH-5678",telefono:"4427654321",email:"maria@email.com",password:"123456",estado:"Activo"},
    {usuario_id:"USR003",nombre:"Carlos Ruiz Martínez",camion:"UH-9012",telefono:"4429998888",email:"carlos@email.com",password:"123456",estado:"Inactivo"}
];

const localidades = [
    {id:1,nombre:"Central Querétaro",km:0},
    {id:2,nombre:"Parque B. Quintana",km:8},
    {id:3,nombre:"La Piedad",km:18},
    {id:4,nombre:"El Colorado",km:23},
    {id:5,nombre:"Galeras",km:28},
    {id:6,nombre:"Buena Vista",km:38},
    {id:7,nombre:"Urecho",km:43},
    {id:8,nombre:"Pie de Gallo",km:48},
    {id:9,nombre:"Ajuchitlán",km:58},
    {id:10,nombre:"Peña de Bernal",km:70},
    {id:11,nombre:"Ezequiel Montes",km:80},
    {id:12,nombre:"Cadereyta",km:95},
    {id:13,nombre:"Bizarrón",km:110},
    {id:14,nombre:"Peña Blanca",km:125},
    {id:15,nombre:"Pinal de Amoles",km:145},
    {id:16,nombre:"Jalpan de Serra",km:200},
    {id:17,nombre:"Colón",km:60},
    {id:18,nombre:"Tolimán",km:90},
    {id:19,nombre:"Bernal",km:60},
    {id:20,nombre:"Peñamiller",km:130},
    {id:21,nombre:"San Juan del Río",km:55},
    {id:22,nombre:"Tequisquiapan",km:65}
];

let sesionActiva = null;

// ============================================================
// LOGIN
// ============================================================
function iniciarSesion() {
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value.trim();
    const errorEl = document.getElementById('loginError');
    
    if(!email || !password) {
        errorEl.textContent = 'Ingresa correo y contraseña';
        return;
    }
    
    // Buscar usuario por email
    const usuario = usuarios.find(u => u.email === email && u.estado === 'Activo');
    
    if(!usuario) {
        errorEl.textContent = 'Usuario no encontrado o inactivo';
        return;
    }
    
    if(usuario.password !== password) {
        errorEl.textContent = 'Contraseña incorrecta';
        return;
    }
    
    // Login exitoso
    errorEl.textContent = '';
    sesionActiva = usuario;
    localStorage.setItem('sesionActiva', JSON.stringify(usuario));
    
    // Ocultar login, mostrar contenido
    document.getElementById('loginCard').style.display = 'none';
    document.getElementById('selectorCard').style.display = 'block';
    document.getElementById('corridasCard').style.display = 'block';
    document.getElementById('btnNuevaCorrida').style.display = 'block';
    document.getElementById('btnNuevaCorrida').disabled = false;
    document.getElementById('btnSalir').style.display = 'block';
    
    renderOperadores();
    renderCorridas();
}

function cerrarSesion() {
    sesionActiva = null;
    localStorage.removeItem('sesionActiva');
    
    // Ocultar contenido, mostrar login
    document.getElementById('loginCard').style.display = 'block';
    document.getElementById('selectorCard').style.display = 'none';
    document.getElementById('corridasCard').style.display = 'none';
    document.getElementById('btnNuevaCorrida').style.display = 'none';
    document.getElementById('btnSalir').style.display = 'none';
    
    document.getElementById('loginEmail').value = '';
    document.getElementById('loginPassword').value = '';
    document.getElementById('loginError').textContent = '';
}

// ============================================================
// RENDER
// ============================================================
function renderOperadores() {
    const lista = document.getElementById('operadorLista');
    lista.innerHTML = '';
    usuarios.filter(u=>u.estado==='Activo').forEach(u => {
        const item = document.createElement('div');
        item.className = 'operador-item';
        if(sesionActiva && sesionActiva.usuario_id === u.usuario_id) item.classList.add('seleccionado');
        item.innerHTML = `<span class="operador-nombre">👤 ${u.nombre}</span><span class="operador-camion">🚛 ${u.camion}</span>`;
        item.onclick = () => seleccionarOperador(u);
        lista.appendChild(item);
    });
}

function seleccionarOperador(u) {
    sesionActiva = u;
    localStorage.setItem('sesionActiva', JSON.stringify(u));
    document.getElementById('btnNuevaCorrida').disabled = false;
    renderOperadores();
    renderCorridas();
}

function renderCorridas() {
    const lista = document.getElementById('corridasLista');
    if(!sesionActiva) {
        lista.innerHTML = '<div class="sin-datos">Selecciona un operador</div>';
        return;
    }
    const corridas = JSON.parse(localStorage.getItem('corridas')) || [];
    const misCorridas = corridas.filter(c => c.usuario_id === sesionActiva.usuario_id).slice(-5).reverse();
    if(misCorridas.length === 0) {
        lista.innerHTML = '<div class="sin-datos">Sin corridas anteriores</div>';
        return;
    }
    lista.innerHTML = '';
    misCorridas.forEach(c => {
        const item = document.createElement('div');
        item.className = 'corrida-item';
        item.innerHTML = `
            <div class="corrida-info">
                <div class="corrida-ruta">📍 ${c.origen} → ${c.destino}</div>
                <div class="corrida-fecha">📅 ${c.fecha} · 🕐 ${c.hora_corte || ''}</div>
            </div>
            <div class="corrida-total">$${c.total}</div>
        `;
        lista.appendChild(item);
    });
}

// ============================================================
// NUEVA CORRIDA
// ============================================================
function abrirModalNuevaCorrida() {
    if(!sesionActiva){alert('⚠ Inicia sesión primero');return}
    const selOrigen = document.getElementById('selectOrigen');
    const selDestino = document.getElementById('selectDestino');
    selOrigen.innerHTML = '';
    selDestino.innerHTML = '';
    localidades.forEach(l => {
        selOrigen.innerHTML += `<option value="${l.id}">${l.nombre} (km ${l.km})</option>`;
        selDestino.innerHTML += `<option value="${l.id}">${l.nombre} (km ${l.km})</option>`;
    });
    document.getElementById('modalNuevaCorrida').classList.add('active');
}

function cerrarModalNuevaCorrida() {
    document.getElementById('modalNuevaCorrida').classList.remove('active');
}

function iniciarNuevaCorrida() {
    const origenId = document.getElementById('selectOrigen').value;
    const destinoId = document.getElementById('selectDestino').value;
    const origen = localidades.find(l=>l.id==origenId);
    const destino = localidades.find(l=>l.id==destinoId);
    
    if(origenId === destinoId){alert('⚠ Origen y destino no pueden ser iguales');return}
    if(destino.km <= origen.km){alert('⚠ El destino debe estar después del origen');return}
    
    sesionActiva.origen = origen.nombre;
    sesionActiva.destino = destino.nombre;
    sesionActiva.hora_inicio = new Date().toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});
    localStorage.setItem('sesionActiva', JSON.stringify(sesionActiva));
    
    window.location.href = 'boletero.html';
}

// ============================================================
// INICIO
// ============================================================
// Si ya hay sesión activa, mostrar contenido directamente
const sesionGuardada = JSON.parse(localStorage.getItem('sesionActiva'));
if(sesionGuardada) {
    sesionActiva = sesionGuardada;
    document.getElementById('loginCard').style.display = 'none';
    document.getElementById('selectorCard').style.display = 'block';
    document.getElementById('corridasCard').style.display = 'block';
    document.getElementById('btnNuevaCorrida').style.display = 'block';
    document.getElementById('btnNuevaCorrida').disabled = false;
    document.getElementById('btnSalir').style.display = 'block';
}
renderOperadores();
renderCorridas();
</script>
</body>
</html>
