<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Boletero Inteligente</title>
    
    <link rel="manifest" href="data:application/json;base64,ewogICJuYW1lIjogIkJvbGV0ZXJvIEludGVsaWdlbnRlIiwKICAic2hvcnRfbmFtZSI6ICJCb2xldGVybyIsCiAgInN0YXJ0X3VybCI6ICIuLyIsCiAgImRpc3BsYXkiOiAic3RhbmRhbG9uZSIsCiAgImJhY2tncm91bmRfY29sb3IiOiAiIzBmMTcyYSIsCiAgInRoZW1lX2NvbG9yIjogIiNmZmQ2MDAiLAogICJpY29ucyI6IFtdCn0=">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        /* ========== BARRA SUPERIOR ========== */
        .header {
            background: #1e293b;
            padding: 2vh 4vw;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 8vh;
            border-bottom: 2px solid #f59e0b;
            flex-shrink: 0;
        }
        
        .header-title {
            font-size: 4.5vw;
            font-weight: 700;
            color: #fbbf24;
            letter-spacing: -0.5px;
        }
        
        .status {
            display: flex;
            align-items: center;
            gap: 2vw;
            font-size: 3vw;
        }
        
        .status-dot {
            width: 3vw;
            height: 3vw;
            border-radius: 50%;
            background: #22c55e;
            animation: pulse 2s infinite;
        }
        
        .status-dot.offline {
            background: #ef4444;
            animation: none;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        /* ========== CUERPO PRINCIPAL ========== */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 6vh 6vw;
            text-align: center;
        }
        
        .label-text {
            font-size: 4vw;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 2vh;
        }
        
        .location-display {
            font-size: 12vw;
            font-weight: 900;
            color: #fbbf24;
            line-height: 1.2;
            word-wrap: break-word;
            max-width: 100%;
        }
        
        .route-info {
            font-size: 3.5vw;
            color: #64748b;
            margin-top: 2vh;
        }
        
        /* ========== BOTÓN PASAJERO ========== */
        .button-container {
            padding: 0 5vw 4vh 5vw;
            flex-shrink: 0;
        }
        
        .btn-pasajero {
            background: #f59e0b;
            color: #0f172a;
            border: none;
            width: 100%;
            height: 14vh;
            border-radius: 18px;
            font-size: 6vw;
            font-weight: 800;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3vw;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 25px rgba(245, 158, 11, 0.35);
        }
        
        .btn-pasajero:active {
            transform: scale(0.97);
            box-shadow: 0 2px 10px rgba(245, 158, 11, 0.2);
        }
        
        .btn-pasajero.disabled {
            background: #475569;
            color: #94a3b8;
            box-shadow: none;
            pointer-events: none;
        }
        
        /* ========== MODAL DESTINO ========== */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(15, 23, 42, 0.98);
            z-index: 2000;
            display: none;
            flex-direction: column;
            padding: 4vh 4vw;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-title {
            font-size: 6vw;
            font-weight: 700;
            color: #fbbf24;
            text-align: center;
            margin-bottom: 2vh;
        }
        
        .modal-subtitle {
            font-size: 3.5vw;
            color: #94a3b8;
            text-align: center;
            margin-bottom: 4vh;
        }
        
        .destination-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 2vh;
        }
        
        .destination-item {
            background: #1e293b;
            padding: 3.5vh 5vw;
            border-radius: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s;
        }
        
        .destination-item:active {
            border-color: #f59e0b;
            background: #0f172a;
        }
        
        .destination-name {
            font-size: 5vw;
            font-weight: 600;
        }
        
        .destination-fare {
            font-size: 5.5vw;
            font-weight: 800;
            color: #fbbf24;
        }
        
        .modal-cancel {
            background: #ef4444;
            color: white;
            border: none;
            padding: 3.5vh;
            border-radius: 14px;
            font-size: 5vw;
            font-weight: 700;
            margin-top: 2vh;
            cursor: pointer;
        }
        
        /* ========== MODAL CONFIRMACIÓN ========== */
        .confirmation-content {
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 100%;
        }
        
        .confirmation-route {
            font-size: 5vw;
            color: #94a3b8;
            margin-bottom: 1vh;
        }
        
        .confirmation-unit {
            font-size: 4vw;
            color: #64748b;
            margin-bottom: 3vh;
        }
        
        .passenger-control {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8vw;
            margin: 3vh 0;
        }
        
        .passenger-btn {
            width: 14vw;
            height: 14vw;
            border-radius: 50%;
            border: 2px solid #f59e0b;
            background: #1e293b;
            color: #fbbf24;
            font-size: 9vw;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .passenger-count {
            font-size: 12vw;
            font-weight: 900;
            color: #f8fafc;
        }
        
        .fare-total {
            font-size: 22vw;
            font-weight: 900;
            color: #22c55e;
            line-height: 1;
            margin: 2vh 0;
        }
        
        .confirm-button {
            background: #22c55e;
            color: #0f172a;
            border: none;
            padding: 3.5vh;
            border-radius: 14px;
            font-size: 5.5vw;
            font-weight: 800;
            cursor: pointer;
            margin-top: 2vh;
        }
    </style>
</head>
<body>
    <!-- BARRA SUPERIOR -->
    <div class="header">
        <div class="header-title">🎫 BOLETERO</div>
        <div class="status">
            <span id="statusText">GPS</span>
            <div class="status-dot" id="statusDot"></div>
        </div>
    </div>
    
    <!-- CUERPO PRINCIPAL -->
    <div class="main-content">
        <div class="label-text">📍 UBICACIÓN ACTUAL</div>
        <div class="location-display" id="currentLocation">Florencia</div>
        <div class="route-info">Ruta Norte • En movimiento</div>
    </div>
    
    <!-- BOTÓN PASAJERO -->
    <div class="button-container">
        <button class="btn-pasajero disabled" id="btnPasajero" onclick="abrirModalDestino()">
            <span>🚌</span>
            <span>SUBIÓ PASAJERO</span>
        </button>
    </div>
    
    <!-- MODAL DESTINO -->
    <div class="modal" id="modalDestino">
        <div class="modal-title">¿A dónde va?</div>
        <div class="modal-subtitle">Seleccione el destino del pasajero</div>
        <div class="destination-list" id="listaDestinos"></div>
        <button class="modal-cancel" onclick="cerrarModalDestino()">❌ CANCELAR</button>
    </div>
    
    <!-- MODAL CONFIRMACIÓN -->
    <div class="modal" id="modalConfirmacion">
        <div class="confirmation-content">
            <div class="modal-title">Confirmar Cobro</div>
            <div class="confirmation-route" id="rutaConfirmacion">Florencia → El Puente</div>
            <div class="confirmation-unit">Tarifa unitaria: $<span id="tarifaUnitaria">10</span></div>
            
            <div class="passenger-control">
                <button class="passenger-btn" onclick="cambiarPasajeros(-1)">−</button>
                <div class="passenger-count" id="cantidadPasajeros">1</div>
                <button class="passenger-btn" onclick="cambiarPasajeros(1)">+</button>
            </div>
            
            <div class="fare-total">$<span id="totalCobro">10</span></div>
            
            <button class="confirm-button" onclick="confirmarCobro()">✅ COBRAR Y GUARDAR</button>
            <button class="modal-cancel" onclick="cerrarModalConfirmacion()">❌ CANCELAR</button>
        </div>
    </div>
    
    <script>
        // ========== DATOS DE LA RUTA ==========
        const ruta = {
            nombre: "Ruta Norte",
            localidades: [
                { id: "LOC001", nombre: "Florencia", lat: 19.4326, lon: -99.1332, radio: 500, orden: 1 },
                { id: "LOC002", nombre: "El Puente", lat: 19.4450, lon: -99.1380, radio: 400, orden: 2 },
                { id: "LOC003", nombre: "La Loma", lat: 19.4580, lon: -99.1450, radio: 600, orden: 3 },
                { id: "LOC004", nombre: "Florinda Mesa", lat: 19.4750, lon: -99.1550, radio: 450, orden: 4 }
            ],
            tarifas: {
                "LOC001-LOC002": 10,
                "LOC001-LOC003": 15,
                "LOC001-LOC004": 25,
                "LOC002-LOC003": 10,
                "LOC002-LOC004": 20,
                "LOC003-LOC004": 15
            }
        };
        
        // ========== ESTADO ==========
        let estado = {
            localidadActual: null,
            destinoSeleccionado: null,
            cantidadPasajeros: 1,
            tarifaUnitaria: 0
        };
        
        // ========== SIMULACIÓN GPS ==========
        const puntosRuta = [
            { lat: 19.4326, lon: -99.1332, nombre: "Florencia" },
            { lat: 19.4326, lon: -99.1332, nombre: "Florencia" },
            { lat: 19.4450, lon: -99.1380, nombre: "El Puente" },
            { lat: 19.4450, lon: -99.1380, nombre: "El Puente" },
            { lat: 19.4580, lon: -99.1450, nombre: "La Loma" },
            { lat: 19.4580, lon: -99.1450, nombre: "La Loma" },
            { lat: 19.4750, lon: -99.1550, nombre: "Florinda Mesa" },
            { lat: 19.4750, lon: -99.1550, nombre: "Florinda Mesa" }
        ];
        
        let indicePunto = 0;
        let enMovimiento = true;
        
        function encontrarLocalidadCercana(lat, lon) {
            let masCercana = null;
            let menorDistancia = Infinity;
            
            ruta.localidades.forEach(loc => {
                const dist = calcularDistancia(lat, lon, loc.lat, loc.lon);
                if (dist <= loc.radio && dist < menorDistancia) {
                    menorDistancia = dist;
                    masCercana = loc;
                }
            });
            
            return masCercana;
        }
        
        function calcularDistancia(lat1, lon1, lat2, lon2) {
            const R = 6371000;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                     Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                     Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }
        
        function simularGPS() {
            if (!enMovimiento) return;
            
            if (indicePunto < puntosRuta.length) {
                const punto = puntosRuta[indicePunto];
                const localidad = encontrarLocalidadCercana(punto.lat, punto.lon);
                
                if (localidad) {
                    estado.localidadActual = localidad;
                    document.getElementById('currentLocation').textContent = localidad.nombre;
                }
                
                indicePunto++;
            } else {
                indicePunto = 0;
            }
            
            setTimeout(simularGPS, 2500);
        }
        
        function simularParada() {
            enMovimiento = false;
            document.getElementById('btnPasajero').classList.remove('disabled');
            document.querySelector('.route-info').textContent = ruta.nombre + ' • Detenido';
        }
        
        function reanudarMovimiento() {
            enMovimiento = true;
            document.getElementById('btnPasajero').classList.add('disabled');
            document.querySelector('.route-info').textContent = ruta.nombre + ' • En movimiento';
            simularGPS();
        }
        
        // ========== MODAL DESTINO ==========
        function abrirModalDestino() {
            if (!estado.localidadActual) {
                alert('Esperando ubicación GPS...');
                return;
            }
            
            const locActual = estado.localidadActual;
            const destinos = ruta.localidades.filter(loc => loc.orden > locActual.orden);
            
            const lista = document.getElementById('listaDestinos');
            lista.innerHTML = '';
            
            destinos.forEach(dest => {
                const claveTarifa = `${locActual.id}-${dest.id}`;
                const tarifa = ruta.tarifas[claveTarifa] || 'N/A';
                
                const item = document.createElement('div');
                item.className = 'destination-item';
                item.innerHTML = `
                    <span class="destination-name">📍 ${dest.nombre}</span>
                    <span class="destination-fare">$${tarifa}</span>
                `;
                item.onclick = () => abrirModalConfirmacion(dest, tarifa);
                lista.appendChild(item);
            });
            
            document.getElementById('modalDestino').classList.add('active');
            simularParada();
        }
        
        function cerrarModalDestino() {
            document.getElementById('modalDestino').classList.remove('active');
            reanudarMovimiento();
        }
        
        // ========== MODAL CONFIRMACIÓN ==========
        function abrirModalConfirmacion(destino, tarifa) {
            estado.destinoSeleccionado = destino;
            estado.tarifaUnitaria = tarifa;
            estado.cantidadPasajeros = 1;
            
            document.getElementById('rutaConfirmacion').textContent = 
                `${estado.localidadActual.nombre} → ${destino.nombre}`;
            document.getElementById('tarifaUnitaria').textContent = tarifa;
            document.getElementById('cantidadPasajeros').textContent = '1';
            document.getElementById('totalCobro').textContent = tarifa;
            
            document.getElementById('modalDestino').classList.remove('active');
            document.getElementById('modalConfirmacion').classList.add('active');
        }
        
        function cerrarModalConfirmacion() {
            document.getElementById('modalConfirmacion').classList.remove('active');
            reanudarMovimiento();
        }
        
        function cambiarPasajeros(delta) {
            estado.cantidadPasajeros = Math.max(1, Math.min(10, estado.cantidadPasajeros + delta));
            document.getElementById('cantidadPasajeros').textContent = estado.cantidadPasajeros;
            document.getElementById('totalCobro').textContent = estado.tarifaUnitaria * estado.cantidadPasajeros;
        }
        
        function confirmarCobro() {
            const registro = {
                fecha: new Date().toISOString(),
                origen: estado.localidadActual.nombre,
                destino: estado.destinoSeleccionado.nombre,
                cantidad: estado.cantidadPasajeros,
                total: estado.tarifaUnitaria * estado.cantidadPasajeros
            };
            
            // Guardar en LocalStorage
            const historial = JSON.parse(localStorage.getItem('viajes') || '[]');
            historial.push(registro);
            localStorage.setItem('viajes', JSON.stringify(historial));
            
            alert(`✅ COBRO EXITOSO\n\n${registro.origen} → ${registro.destino}\n${registro.cantidad} pasajero(s)\nTotal: $${registro.total}\n\nGuardado en memoria.`);
            
            cerrarModalConfirmacion();
        }
        
        // ========== INICIO ==========
        function iniciar() {
            localStorage.setItem('ruta', JSON.stringify(ruta));
            simularGPS();
            document.querySelector('.route-info').textContent = ruta.nombre + ' • En movimiento';
            console.log('🚌 Boletero Inteligente Iniciado');
            console.log('📍 Simulación GPS activa');
            console.log('💾 Datos guardados en LocalStorage');
        }
        
        iniciar();
    </script>
</body>
</html>
