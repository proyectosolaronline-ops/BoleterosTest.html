<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Monitor de Itinerarios</title>
    <style>
        :root {
            --negro: #0a0a0a;
            --amarillo: #f59e0b;
            --naranja: #e85d04;
            --blanco: #f8fafc;
            --gris: #1e293b;
            --gris2: #334155;
            --verde: #22c55e;
            --rojo: #ef4444;
            --azul: #3b82f6;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--negro);
            color: var(--blanco);
            font-family: 'Segoe UI', Roboto, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            user-select: none;
        }

        /* Header */
        .header {
            background: var(--gris);
            padding: 2vh 4vw;
            font-weight: 700;
            font-size: 5.5vw;
            border-bottom: 0.4vh solid var(--amarillo);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .btn-volver {
            background: transparent;
            border: 0.2vh solid var(--amarillo);
            color: var(--amarillo);
            padding: 1vh 3vw;
            border-radius: 1vh;
            font-size: 4vw;
            cursor: pointer;
        }

        /* Contenedor de tarjetas */
        .container {
            flex: 1;
            overflow-y: auto;
            padding: 2vh 4vw;
            display: flex;
            flex-direction: column;
            gap: 2vh;
        }

        /* Tarjeta de ruta */
        .ruta-card {
            background: var(--gris);
            border-radius: 2vh;
            padding: 2vh 4vw;
            border-left: 2vw solid var(--verde);
            display: flex;
            flex-direction: column;
            gap: 1.5vh;
            transition: all 0.2s;
        }
        .ruta-card.terminada {
            border-left-color: var(--gris2);
            opacity: 0.6;
        }
        .ruta-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .ruta-origen-destino {
            font-size: 5vw;
            font-weight: 700;
            color: var(--amarillo);
        }
        .ruta-camion {
            background: var(--negro);
            padding: 1vh 2vw;
            border-radius: 1vh;
            font-size: 3.5vw;
        }
        .ruta-operador {
            font-size: 4vw;
            color: #ccc;
        }
        .ruta-horario {
            font-size: 3.5vw;
            color: #aaa;
            display: flex;
            justify-content: space-between;
        }
        .ruta-estado {
            font-weight: 700;
            font-size: 3.5vw;
            color: var(--verde);
        }
        .ruta-estado.terminada {
            color: #888;
        }

        /* Botón INICIAR RUTA bien visible */
        .btn-iniciar {
            width: 100%;
            padding: 2.5vh;
            background: var(--amarillo);
            color: var(--negro);
            border: none;
            border-radius: 1.5vh;
            font-size: 5vw;
            font-weight: 800;
            cursor: pointer;
            margin-top: 1vh;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0.5vh 2vh rgba(245,158,11,0.3);
            transition: all 0.2s;
        }
        .btn-iniciar:active {
            transform: scale(0.97);
            background: var(--naranja);
        }
        .btn-iniciar:disabled {
            background: var(--gris2);
            color: #555;
            box-shadow: none;
        }

        /* Mensaje sin rutas */
        .sin-rutas {
            text-align: center;
            color: #555;
            padding: 10vh 4vw;
            font-size: 5vw;
        }
    </style>
</head>
<body>
    <div class="header">
        <span>📋 MIS ITINERARIOS</span>
        <button class="btn-volver" onclick="window.location.href='index.html'">🏠</button>
    </div>
    <div class="container" id="listaRutas"></div>

    <script>
        // Datos de ejemplo de rutas asignadas
        const rutasAsignadas = [
            { id: 1, operador: "Juan Pérez", camion: "UH-1234", origen: "Central Querétaro", destino: "Jalpan de Serra",
                salida: "06:00", llegada: "09:30", estado: "en-transito", venta: 450 },
            { id: 2, operador: "María López", camion: "UH-5678", origen: "Jalpan de Serra",
                destino: "Central Querétaro", salida: "10:00", llegada: "13:30", estado: "terminado", venta: 620 },
            { id: 3, operador: "Carlos Ruiz", camion: "UH-9012", origen: "Cadereyta", destino: "Pinal de Amoles",
                salida: "07:30", llegada: "09:45", estado: "en-transito", venta: 230 },
            { id: 4, operador: "Ana García", camion: "UH-3456", origen: "Ezequiel Montes", destino: "Peña Blanca",
                salida: "08:15", llegada: "10:00", estado: "terminado", venta: 180 },
            { id: 5, operador: "Pedro Hernández", camion: "UH-7890", origen: "Central Querétaro", destino: "Cadereyta",
                salida: "12:00", llegada: "14:30", estado: "en-transito", venta: 0 }
        ];

        function cargarRutas() {
            const data = localStorage.getItem('itinerarios');
            return data ? JSON.parse(data) : rutasAsignadas;
        }

        function guardarRutas(lista) {
            localStorage.setItem('itinerarios', JSON.stringify(lista));
        }

        function iniciarRuta(item) {
            // Guardar ruta activa
            localStorage.setItem('rutaActiva', JSON.stringify(item));
            // Redirigir al boletero
            window.location.href = 'boletero.html';
        }

        function renderRutas() {
            const rutas = cargarRutas();
            const container = document.getElementById('listaRutas');

            if (rutas.length === 0) {
                container.innerHTML = '<div class="sin-rutas">📭 No hay rutas asignadas</div>';
                return;
            }

            container.innerHTML = '';
            rutas.forEach(ruta => {
                const card = document.createElement('div');
                card.className = `ruta-card ${ruta.estado === 'terminado' ? 'terminada' : ''}`;
                card.innerHTML = `
                    <div class="ruta-header">
                        <span class="ruta-origen-destino">${ruta.origen} → ${ruta.destino}</span>
                        <span class="ruta-camion">🚛 ${ruta.camion}</span>
                    </div>
                    <div class="ruta-operador">👤 ${ruta.operador}</div>
                    <div class="ruta-horario">
                        <span>🕐 Salida: ${ruta.salida}</span>
                        <span>🕐 Llegada: ${ruta.llegada}</span>
                    </div>
                    <div class="ruta-estado ${ruta.estado === 'terminado' ? 'terminada' : ''}">
                        ${ruta.estado === 'terminado' ? '✅ Terminado' : '🚌 En tránsito · Venta: $' + ruta.venta}
                    </div>
                    ${ruta.estado === 'en-transito' ? 
                        `<button class="btn-iniciar" onclick="iniciarRuta(cargarRutas().find(r => r.id === ${ruta.id}))">▶ INICIAR RUTA</button>` :
                        `<button class="btn-iniciar" disabled>✔ RUTA TERMINADA</button>`
                    }
                `;
                container.appendChild(card);
            });
        }

        // Inicializar datos si no existen
        if (!localStorage.getItem('itinerarios')) {
            guardarRutas(rutasAsignadas);
        }
        renderRutas();
    </script>
</body>
</html>
