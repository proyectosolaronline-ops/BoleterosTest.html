<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Selector de Carretera</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>
    <style>
        :root {
            --negro:#0a0a0a;--amarillo:#f59e0b;--amarillo-texto:#fbbf24;--naranja:#e85d04;
            --blanco:#f8fafc;--gris:#1e293b;--gris2:#334155;--verde:#22c55e;--rojo:#ef4444;
            --azul:#3b82f6;--gris-texto:#94a3b8;
        }
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            background:var(--negro);color:var(--blanco);
            font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
            height:100vh;width:100vw;overflow:hidden;display:flex;flex-direction:column;
            user-select:none;-webkit-user-select:none;
        }
        .header{
            background:var(--gris);padding:1.5vh 4vw;height:7vh;
            display:flex;align-items:center;justify-content:space-between;
            border-bottom:0.4vh solid var(--amarillo);flex-shrink:0;
        }
        .header-titulo{font-size:4.5vw;font-weight:700;color:var(--amarillo)}
        .btn-volver{
            background:transparent;color:var(--amarillo);border:0.2vh solid var(--amarillo);
            padding:1vh 3vw;border-radius:1vh;font-size:3.5vw;cursor:pointer;text-decoration:none;
        }
        .mapa-container{flex:1;position:relative;min-height:0}
        #mapa{width:100%;height:100%}
        
        .panel-info{
            position:absolute;top:2vh;left:2vw;right:2vw;
            background:rgba(10,10,10,0.9);padding:1.5vh 3vw;
            border-radius:1.5vh;border:0.2vh solid var(--amarillo);
            z-index:1000;text-align:center;font-size:3.5vw;
        }
        .panel-info .gps-text{color:var(--verde);font-weight:700}
        .panel-info .instruccion{color:var(--gris-texto);margin-top:0.5vh}
        
        .panel-inferior{
            position:absolute;bottom:0;left:0;right:0;
            background:rgba(10,10,10,0.95);padding:2vh 4vw;
            border-top:0.3vh solid var(--amarillo);z-index:1000;
            max-height:35vh;overflow-y:auto;
        }
        .ruta-actual{
            display:flex;flex-wrap:wrap;gap:1.5vw;align-items:center;margin-bottom:1.5vh;
        }
        .parada-tag{
            background:var(--gris2);padding:1vh 2vw;border-radius:1vh;font-size:3vw;
            display:flex;align-items:center;gap:1vw;
        }
        .parada-tag.origen{border:0.2vh solid var(--verde)}
        .parada-tag.destino{border:0.2vh solid var(--rojo)}
        .parada-tag .quitar{color:var(--rojo);cursor:pointer;font-weight:700;font-size:4vw}
        .flecha{color:var(--amarillo);font-size:4vw}
        .input-nombre{
            width:100%;padding:1.5vh 3vw;background:var(--negro);color:var(--blanco);
            border:0.2vh solid var(--amarillo);border-radius:1vh;font-size:4vw;margin-bottom:1.5vh;text-align:center;
        }
        .btn-accion{
            width:100%;padding:2.5vh;border:none;border-radius:1.5vh;font-size:5vw;font-weight:700;cursor:pointer;margin-bottom:1vh;
        }
        .btn-guardar{background:var(--verde);color:var(--blanco)}
        .btn-limpiar{background:transparent;color:var(--rojo);border:0.2vh solid var(--rojo)}
        .btn-trazar{background:var(--azul);color:var(--blanco)}
        
        /* Ocultar panel de instrucciones de Leaflet Routing */
        .leaflet-routing-container{display:none}
    </style>
</head>
<body>

<div class="header">
    <div class="header-titulo">🗺️ TRAZAR RUTA REAL</div>
    <a class="btn-volver" href="index.html">✕</a>
</div>

<div class="mapa-container">
    <div id="mapa"></div>
    
    <div class="panel-info" id="panelInfo">
        <div class="gps-text" id="gpsTexto">📡 Detectando GPS...</div>
        <div class="instruccion">Toca las paradas en orden para trazar la ruta</div>
    </div>
    
    <div class="panel-inferior" id="panelInferior">
        <div style="font-size:3.5vw;font-weight:700;color:var(--amarillo-texto);margin-bottom:1vh;">
            📍 Paradas seleccionadas
        </div>
        <div class="ruta-actual" id="rutaActual">
            <span style="color:#555;font-size:3.5vw;">Toca localidades para armar la ruta</span>
        </div>
        <button class="btn-accion btn-trazar" onclick="trazarRuta()">🗺️ TRAZAR SOBRE CARRETERA</button>
        <input type="text" class="input-nombre" id="nombreRuta" placeholder="Nombre de la ruta (ej: Central → Jalpan)">
        <button class="btn-accion btn-guardar" onclick="guardarRuta()">💾 GUARDAR RUTA</button>
        <button class="btn-accion btn-limpiar" onclick="limpiarRuta()">🗑️ Limpiar</button>
    </div>
</div>

<script src="matriz_queretaro.js?v=5"></script>

<script>
var mapa;
var markerGPS = null;
var controlRuta = null;
var paradasSeleccionadas = [];
var marcadoresParadas = [];
var miPosicion = null;

// ============================================================
// INICIALIZAR MAPA
// ============================================================
function inicializarMapa() {
    mapa = L.map('mapa', { zoomControl: true, attributionControl: false }).setView([20.85, -99.95], 9);
    
    // Usar tiles oscuros
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 14 }).addTo(mapa);
    
    var obj = (typeof localidadesObj !== 'undefined') ? localidadesObj : {};
    var coords = (typeof coordenadasLocalidades !== 'undefined') ? coordenadasLocalidades : {};
    
    // Poner marcadores cliqueables de todas las localidades
    Object.keys(coords).forEach(function(id) {
        var idn = parseInt(id);
        if (obj[idn] && coords[idn]) {
            var marker = L.marker([coords[idn].lat, coords[idn].lng], {
                icon: L.divIcon({
                    className: '',
                    html: '<div style="background:#1e293b;color:#fbbf24;padding:4px 8px;border-radius:8px;font-size:11px;font-weight:700;border:1px solid #f59e0b;white-space:nowrap;">' + obj[idn] + '</div>',
                    iconSize: [0, 0],
                    iconAnchor: [40, 10]
                })
            }).addTo(mapa);
            
            marker.on('click', function() {
                agregarParada({ id: idn, nombre: obj[idn], lat: coords[idn].lat, lng: coords[idn].lng });
            });
            
            marker.bindTooltip(obj[idn], { permanent: false });
        }
    });
    
    detectarGPS();
}

// ============================================================
// GPS
// ============================================================
function detectarGPS() {
    if (!navigator.geolocation) {
        document.getElementById('gpsTexto').textContent = '⚠️ GPS no disponible';
        return;
    }
    
    navigator.geolocation.watchPosition(function(pos) {
        miPosicion = { lat: pos.coords.latitude, lng: pos.coords.longitude };
        if (markerGPS) mapa.removeLayer(markerGPS);
        markerGPS = L.circleMarker([miPosicion.lat, miPosicion.lng], {
            radius: 10, color: '#22c55e', fillColor: '#22c55e', fillOpacity: 1, weight: 3
        }).addTo(mapa).bindPopup('📍 Mi ubicación');
        mapa.setView([miPosicion.lat, miPosicion.lng], 11);
        document.getElementById('gpsTexto').textContent = '📍 Ubicación detectada';
    }, function() {}, { enableHighAccuracy: true, maximumAge: 5000 });
}

// ============================================================
// AGREGAR PARADA
// ============================================================
function agregarParada(loc) {
    if (paradasSeleccionadas.length > 0 && paradasSeleccionadas[paradasSeleccionadas.length - 1].id === loc.id) return;
    paradasSeleccionadas.push(loc);
    actualizarPanel();
}

function quitarParada(index) {
    paradasSeleccionadas.splice(index, 1);
    actualizarPanel();
}

function limpiarRuta() {
    paradasSeleccionadas = [];
    if (controlRuta) { mapa.removeControl(controlRuta); controlRuta = null; }
    marcadoresParadas.forEach(function(m) { mapa.removeLayer(m); });
    marcadoresParadas = [];
    actualizarPanel();
}

function actualizarPanel() {
    var container = document.getElementById('rutaActual');
    if (paradasSeleccionadas.length === 0) {
        container.innerHTML = '<span style="color:#555;font-size:3.5vw;">Toca localidades para armar la ruta</span>';
        return;
    }
    container.innerHTML = '';
    paradasSeleccionadas.forEach(function(loc, i) {
        var esOrigen = (i === 0), esDestino = (i === paradasSeleccionadas.length - 1);
        var tag = document.createElement('div');
        tag.className = 'parada-tag ' + (esOrigen ? 'origen' : (esDestino ? 'destino' : ''));
        tag.innerHTML = (esOrigen ? '🟢 ' : (esDestino ? '🔴 ' : '📍 ')) + loc.nombre + ' <span class="quitar" onclick="quitarParada(' + i + ')">×</span>';
        container.appendChild(tag);
        if (i < paradasSeleccionadas.length - 1) {
            var flecha = document.createElement('span'); flecha.className = 'flecha'; flecha.textContent = '→';
            container.appendChild(flecha);
        }
    });
}

// ============================================================
// TRAZAR RUTA REAL SOBRE CARRETERA (Leaflet Routing Machine)
// ============================================================
function trazarRuta() {
    if (paradasSeleccionadas.length < 2) {
        alert('⚠ Selecciona al menos 2 paradas (origen y destino)');
        return;
    }
    
    // Limpiar ruta anterior
    if (controlRuta) { mapa.removeControl(controlRuta); }
    marcadoresParadas.forEach(function(m) { mapa.removeLayer(m); });
    marcadoresParadas = [];
    
    // Crear waypoints
    var waypoints = paradasSeleccionadas.map(function(loc) {
        return L.latLng(loc.lat, loc.lng);
    });
    
    // Trazar ruta real con OSRM (gratuito, sin API key)
    controlRuta = L.Routing.control({
        waypoints: waypoints,
        routeWhileDragging: false,
        showAlternatives: false,
        addWaypoints: false,
        lineOptions: {
            styles: [{ color: '#22c55e', weight: 6, opacity: 0.9 }]
        },
        createMarker: function() { return null; } // No crear marcadores adicionales
    }).addTo(mapa);
    
    // Ocultar el panel de instrucciones de ruteo
    setTimeout(function() {
        var container = document.querySelector('.leaflet-routing-container');
        if (container) container.style.display = 'none';
    }, 500);
    
    document.getElementById('gpsTexto').textContent = '✅ Ruta trazada sobre carretera real';
}

// ============================================================
// GUARDAR RUTA
// ============================================================
function guardarRuta() {
    var nombre = document.getElementById('nombreRuta').value.trim();
    if (!nombre) { alert('⚠ Asigna un nombre a la ruta'); return; }
    if (paradasSeleccionadas.length < 2) { alert('⚠ Selecciona al menos origen y destino'); return; }
    
    var ruta = {
        nombre: nombre,
        origen: paradasSeleccionadas[0].nombre,
        origenId: paradasSeleccionadas[0].id,
        destino: paradasSeleccionadas[paradasSeleccionadas.length - 1].nombre,
        destinoId: paradasSeleccionadas[paradasSeleccionadas.length - 1].id,
        paradas: paradasSeleccionadas.map(function(l) { return l.id; }),
        fecha: new Date().toLocaleDateString('es-MX')
    };
    
    var rutasGuardadas = JSON.parse(localStorage.getItem('rutasPredefinidas') || '[]');
    rutasGuardadas.push(ruta);
    localStorage.setItem('rutasPredefinidas', JSON.stringify(rutasGuardadas));
    
    alert('✅ Ruta guardada: ' + nombre + '\n\n' + ruta.origen + ' → ' + ruta.destino + '\n' + paradasSeleccionadas.length + ' paradas');
    window.location.href = 'index.html';
}

// ============================================================
// INICIO
// ============================================================
inicializarMapa();
</script>
</body>
</html>
