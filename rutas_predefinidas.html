<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Crear Ruta</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>
    <style>
        :root {
            --negro:#0a0a0a;--amarillo:#f59e0b;--amarillo-texto:#fbbf24;--blanco:#f8fafc;
            --gris:#1e293b;--gris2:#334155;--verde:#22c55e;--rojo:#ef4444;--gris-texto:#94a3b8;
        }
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            background:var(--negro);color:var(--blanco);
            font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
            height:100vh;width:100vw;overflow:hidden;display:flex;flex-direction:column;
            user-select:none;-webkit-user-select:none;
        }
        .header{
            background:var(--gris);padding:1.5vh 4vw;height:7vh;
            display:flex;align-items:center;justify-content:space-between;
            border-bottom:0.4vh solid var(--amarillo);flex-shrink:0;
        }
        .header-titulo{font-size:4.5vw;font-weight:700;color:var(--amarillo)}
        .btn-volver{
            background:transparent;color:var(--amarillo);border:0.2vh solid var(--amarillo);
            padding:1vh 3vw;border-radius:1vh;font-size:3.5vw;cursor:pointer;text-decoration:none;
        }
        .mapa-container{flex:1;position:relative;min-height:0}
        #mapa{width:100%;height:100%}
        .instruccion-bar{
            position:absolute;top:2vh;left:2vw;right:2vw;
            background:rgba(10,10,10,0.9);padding:2vh 4vw;
            border-radius:1.5vh;border:0.2vh solid var(--amarillo);z-index:1000;text-align:center;
        }
        .instruccion-titulo{font-size:5vw;font-weight:700;color:var(--amarillo-texto)}
        .instruccion-sub{font-size:3vw;color:var(--gris-texto);margin-top:0.5vh}
        .panel-inferior{
            position:absolute;bottom:0;left:0;right:0;
            background:rgba(10,10,10,0.95);padding:2vh 4vw;
            border-top:0.3vh solid var(--amarillo);z-index:1000;max-height:35vh;overflow-y:auto;
        }
        .panel-titulo{font-size:3.5vw;font-weight:700;color:var(--amarillo-texto);margin-bottom:1vh}
        .lista-paradas{display:flex;flex-wrap:wrap;gap:1.5vw;align-items:center;margin-bottom:1.5vh}
        .parada-tag{
            background:var(--gris2);padding:1vh 2vw;border-radius:1vh;font-size:3vw;
            display:flex;align-items:center;gap:1vw;
        }
        .parada-tag.origen{border:0.2vh solid var(--verde)}
        .parada-tag.destino{border:0.2vh solid var(--rojo)}
        .parada-tag.personalizado{border:0.2vh solid var(--azul)}
        .flecha{color:var(--amarillo);font-size:4vw}
        .input-nombre{
            width:100%;padding:1.5vh 3vw;background:var(--negro);color:var(--blanco);
            border:0.2vh solid var(--amarillo);border-radius:1vh;font-size:4vw;margin-bottom:1vh;text-align:center;
        }
        .btn-accion{
            width:100%;padding:2vh;border:none;border-radius:1.5vh;font-size:4.5vw;font-weight:700;cursor:pointer;margin-bottom:1vh;
        }
        .btn-guardar{background:var(--verde);color:var(--blanco)}
        .btn-reiniciar{background:transparent;color:var(--rojo);border:0.2vh solid var(--rojo)}
        .btn-guardar:disabled{background:var(--gris2);color:#555}
        .leaflet-routing-container{display:none}
        .ayuda-texto{font-size:2.5vw;color:var(--azul);text-align:center;margin-top:0.5vh}
    </style>
</head>
<body>
<div class="header">
    <div class="header-titulo">🗺️ CREAR RUTA</div>
    <a class="btn-volver" href="index.html">✕</a>
</div>
<div class="mapa-container">
    <div id="mapa"></div>
    <div class="instruccion-bar">
        <div class="instruccion-titulo" id="instruccionTitulo">👆 Toca el ORIGEN</div>
        <div class="instruccion-sub" id="instruccionSub">Toca una localidad O mantén presionado para poner un pin libre</div>
    </div>
    <div class="panel-inferior">
        <div class="panel-titulo">📍 Paradas detectadas en la ruta</div>
        <div class="lista-paradas" id="listaParadas"><span style="color:#555;font-size:3.5vw;">Selecciona origen y destino</span></div>
        <input type="text" class="input-nombre" id="nombreRuta" placeholder="Nombre de la ruta">
        <button class="btn-accion btn-guardar" id="btnGuardar" onclick="guardarRuta()" disabled>💾 GUARDAR RUTA</button>
        <button class="btn-accion btn-reiniciar" onclick="reiniciar()">🔄 Reiniciar</button>
        <div class="ayuda-texto">💡 Mantén presionado el mapa para poner un pin en cualquier lugar</div>
    </div>
</div>
<script src="matriz_queretaro.js?v=6"></script>
<script>
var mapa, controlRuta, pasoActual='origen', origenSel=null, destinoSel=null;
var markerO=null, markerD=null, paradasEnRuta=[];
var nextCustomId = 900; // IDs para pines personalizados

function inicializarMapa() {
    mapa = L.map('mapa', { zoomControl: true, attributionControl: false }).setView([20.85, -99.95], 9);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 16 }).addTo(mapa);
    
    // Carreteras de fondo
    var carreteras = {
        "MEX-120": { color: '#e85d04', trazo: [[20.5831,-100.3896],[20.5950,-100.3700],[20.6100,-100.3200],[20.6300,-100.2600],[20.6500,-100.2000],[20.6700,-100.1400],[20.6900,-100.0800],[20.7167,-99.8833],[20.7000,-99.8000],[20.7800,-99.5167],[20.8500,-99.4667],[20.9000,-99.4000],[20.9333,-99.4333],[20.9833,-99.4333],[21.0167,-99.3667],[21.1000,-99.3000],[21.1833,-99.2333],[21.2167,-99.4667],[21.2833,-99.3833],[21.1833,-99.3167],[21.2500,-99.2500],[21.3000,-99.2000]] },
        "MEX-069": { color: '#3b82f6', trazo: [[21.2167,-99.4667],[21.1833,-99.5500],[21.1667,-99.6167],[21.3333,-99.6500]] },
        "QRO-004": { color: '#22c55e', trazo: [[20.8500,-99.4667],[20.8667,-99.4333],[20.9000,-99.4500],[21.0167,-99.4667],[21.0500,-99.5500]] },
        "QRO-005": { color: '#a855f7', trazo: [[20.6667,-99.7333],[20.7167,-99.7000],[20.7500,-99.6500],[20.9000,-99.6667],[21.0000,-99.5667]] }
    };
    Object.keys(carreteras).forEach(function(k) {
        L.polyline(carreteras[k].trazo, { color: carreteras[k].color, weight: 4, opacity: 0.7 }).addTo(mapa).bindTooltip(k);
    });

    // Localidades desde matriz
    var obj = (typeof localidadesObj !== 'undefined') ? localidadesObj : {};
    var coords = (typeof coordenadasLocalidades !== 'undefined') ? coordenadasLocalidades : {};
    Object.keys(coords).forEach(function(id) {
        var idn = parseInt(id);
        if (obj[idn] && coords[idn]) {
            var m = L.circleMarker([coords[idn].lat, coords[idn].lng], { radius: 7, color: '#f59e0b', fillColor: '#1e293b', fillOpacity: 1, weight: 2 }).addTo(mapa);
            m.bindTooltip(obj[idn]);
            m.on('click', function() { seleccionarLocalidad({ id: idn, nombre: obj[idn], lat: coords[idn].lat, lng: coords[idn].lng, esPersonalizado: false }); });
        }
    });

    // PIN LIBRE: mantener presionado (o doble toque) en cualquier lugar del mapa
    mapa.on('dblclick', function(e) {
        var nombre = prompt('📍 Nombre para este punto:', 'Parada ' + nextCustomId);
        if (!nombre) return;
        var loc = { id: nextCustomId, nombre: nombre, lat: e.latlng.lat, lng: e.latlng.lng, esPersonalizado: true };
        nextCustomId++;
        
        // Marcar en el mapa
        var marker = L.marker([loc.lat, loc.lng], {
            icon: L.divIcon({
                className: '',
                html: '<div style="background:#3b82f6;color:#fff;padding:4px 8px;border-radius:8px;font-size:11px;font-weight:700;border:2px solid #fff;white-space:nowrap;">' + nombre + '</div>',
                iconSize: [0, 0], iconAnchor: [30, 10]
            })
        }).addTo(mapa).bindPopup('📌 ' + nombre);
        
        seleccionarLocalidad(loc);
    });

    // También permitir toque largo en móviles
    var timeoutId;
    mapa.on('touchstart', function(e) {
        timeoutId = setTimeout(function() {
            var nombre = prompt('📍 Nombre para este punto:', 'Parada ' + nextCustomId);
            if (!nombre) return;
            var loc = { id: nextCustomId, nombre: nombre, lat: e.latlng.lat, lng: e.latlng.lng, esPersonalizado: true };
            nextCustomId++;
            L.marker([loc.lat, loc.lng], {
                icon: L.divIcon({
                    className: '',
                    html: '<div style="background:#3b82f6;color:#fff;padding:4px 8px;border-radius:8px;font-size:11px;font-weight:700;border:2px solid #fff;white-space:nowrap;">' + nombre + '</div>',
                    iconSize: [0, 0], iconAnchor: [30, 10]
                })
            }).addTo(mapa).bindPopup('📌 ' + nombre);
            seleccionarLocalidad(loc);
        }, 800);
    });
    mapa.on('touchmove', function() { clearTimeout(timeoutId); });
    mapa.on('touchend', function() { clearTimeout(timeoutId); });
}

function seleccionarLocalidad(loc) {
    if (pasoActual === 'origen') {
        origenSel = loc; pasoActual = 'destino';
        if (markerO) mapa.removeLayer(markerO);
        var iconO = loc.esPersonalizado ? 
            L.divIcon({ className: '', html: '<div style="font-size:30px;">🟢</div>', iconSize: [30, 30], iconAnchor: [15, 15] }) :
            null;
        if (iconO) {
            markerO = L.marker([loc.lat, loc.lng], { icon: iconO }).addTo(mapa).bindPopup('🟢 ORIGEN: ' + loc.nombre).openPopup();
        } else {
            markerO = L.circleMarker([loc.lat, loc.lng], { radius: 14, color: '#22c55e', fillColor: '#22c55e', fillOpacity: 0.8, weight: 3 }).addTo(mapa).bindPopup('🟢 ORIGEN: ' + loc.nombre).openPopup();
        }
        document.getElementById('instruccionTitulo').textContent = '👆 Ahora toca el DESTINO';
        document.getElementById('instruccionSub').textContent = 'Toca una localidad o mantén presionado para poner un pin';
    } else if (pasoActual === 'destino') {
        if (loc.id === origenSel.id && loc.esPersonalizado === origenSel.esPersonalizado) { alert('⚠ Diferente al origen'); return; }
        destinoSel = loc; pasoActual = 'completo';
        if (markerD) mapa.removeLayer(markerD);
        var iconD = loc.esPersonalizado ?
            L.divIcon({ className: '', html: '<div style="font-size:30px;">🔴</div>', iconSize: [30, 30], iconAnchor: [15, 15] }) :
            null;
        if (iconD) {
            markerD = L.marker([loc.lat, loc.lng], { icon: iconD }).addTo(mapa).bindPopup('🔴 DESTINO: ' + loc.nombre).openPopup();
        } else {
            markerD = L.circleMarker([loc.lat, loc.lng], { radius: 14, color: '#ef4444', fillColor: '#ef4444', fillOpacity: 0.8, weight: 3 }).addTo(mapa).bindPopup('🔴 DESTINO: ' + loc.nombre).openPopup();
        }
        
        if (controlRuta) mapa.removeControl(controlRuta);
        controlRuta = L.Routing.control({
            waypoints: [L.latLng(origenSel.lat, origenSel.lng), L.latLng(destinoSel.lat, destinoSel.lng)],
            routeWhileDragging: false, showAlternatives: false, addWaypoints: false,
            lineOptions: { styles: [{ color: '#22c55e', weight: 6, opacity: 0.9 }] },
            createMarker: function() { return null; }
        }).addTo(mapa);
        
        setTimeout(function() {
            var c = document.querySelector('.leaflet-routing-container');
            if (c) c.style.display = 'none';
            detectarParadasEnRuta();
        }, 2000);
        
        document.getElementById('instruccionTitulo').textContent = '✅ Ruta trazada';
        document.getElementById('instruccionSub').textContent = 'Detectando paradas...';
    }
}

function detectarParadasEnRuta() {
    var obj = (typeof localidadesObj !== 'undefined') ? localidadesObj : {};
    var coords = (typeof coordenadasLocalidades !== 'undefined') ? coordenadasLocalidades : {};
    var kmO = (typeof MATRIZ_QUERETARO !== 'undefined' && MATRIZ_QUERETARO['1-'+origenSel.id]) ? MATRIZ_QUERETARO['1-'+origenSel.id].km : 0;
    var kmD = (typeof MATRIZ_QUERETARO !== 'undefined' && MATRIZ_QUERETARO['1-'+destinoSel.id]) ? MATRIZ_QUERETARO['1-'+destinoSel.id].km : 999;
    var kmMin = Math.min(kmO, kmD), kmMax = Math.max(kmO, kmD);
    
    paradasEnRuta = [];
    Object.keys(coords).forEach(function(id) {
        var idn = parseInt(id);
        if (idn === origenSel.id || idn === destinoSel.id) return;
        if (obj[idn] && coords[idn]) {
            var km = (typeof MATRIZ_QUERETARO !== 'undefined' && MATRIZ_QUERETARO['1-'+idn]) ? MATRIZ_QUERETARO['1-'+idn].km : -1;
            if (km >= kmMin && km <= kmMax) {
                paradasEnRuta.push({ id: idn, nombre: obj[idn], lat: coords[idn].lat, lng: coords[idn].lng, km: km, esPersonalizado: false });
            }
        }
    });
    paradasEnRuta.sort(function(a, b) { return a.km - b.km; });
    actualizarPanel();
    document.getElementById('instruccionSub').textContent = paradasEnRuta.length + ' paradas detectadas';
    document.getElementById('btnGuardar').disabled = false;
}

function actualizarPanel() {
    var c = document.getElementById('listaParadas'); c.innerHTML = '';
    var tO = document.createElement('div'); tO.className = 'parada-tag ' + (origenSel && origenSel.esPersonalizado ? 'personalizado' : 'origen');
    tO.textContent = (origenSel && origenSel.esPersonalizado ? '📌 ' : '🟢 ') + (origenSel ? origenSel.nombre : '—');
    c.appendChild(tO);
    paradasEnRuta.forEach(function(l) {
        var f = document.createElement('span'); f.className = 'flecha'; f.textContent = '→'; c.appendChild(f);
        var t = document.createElement('div'); t.className = 'parada-tag';
        t.textContent = '📍 ' + l.nombre; c.appendChild(t);
    });
    if (destinoSel) {
        var f = document.createElement('span'); f.className = 'flecha'; f.textContent = '→'; c.appendChild(f);
        var tD = document.createElement('div'); tD.className = 'parada-tag ' + (destinoSel.esPersonalizado ? 'personalizado' : 'destino');
        tD.textContent = (destinoSel.esPersonalizado ? '📌 ' : '🔴 ') + destinoSel.nombre; c.appendChild(tD);
    }
}

function reiniciar() {
    pasoActual = 'origen'; origenSel = null; destinoSel = null; paradasEnRuta = [];
    if (markerO) { mapa.removeLayer(markerO); markerO = null; }
    if (markerD) { mapa.removeLayer(markerD); markerD = null; }
    if (controlRuta) { mapa.removeControl(controlRuta); controlRuta = null; }
    document.getElementById('instruccionTitulo').textContent = '👆 Toca el ORIGEN';
    document.getElementById('instruccionSub').textContent = 'Toca una localidad O mantén presionado para poner un pin libre';
    document.getElementById('btnGuardar').disabled = true;
    document.getElementById('nombreRuta').value = '';
    actualizarPanel();
}

function guardarRuta() {
    var nombre = document.getElementById('nombreRuta').value.trim();
    if (!nombre) { alert('⚠ Pon un nombre'); return; }
    var todas = [{ id: origenSel.id, nombre: origenSel.nombre, esPersonalizado: origenSel.esPersonalizado || false }];
    paradasEnRuta.forEach(function(l) { todas.push({ id: l.id, nombre: l.nombre, esPersonalizado: false }); });
    todas.push({ id: destinoSel.id, nombre: destinoSel.nombre, esPersonalizado: destinoSel.esPersonalizado || false });
    
    var ruta = {
        nombre: nombre,
        origen: origenSel.nombre, origenId: origenSel.id, origenPersonalizado: origenSel.esPersonalizado || false,
        destino: destinoSel.nombre, destinoId: destinoSel.id, destinoPersonalizado: destinoSel.esPersonalizado || false,
        paradas: todas.map(function(l) { return l.id; }),
        paradasNombres: todas.map(function(l) { return l.nombre; }),
        fecha: new Date().toLocaleDateString('es-MX')
    };
    
    var guardadas = JSON.parse(localStorage.getItem('rutasPredefinidas') || '[]');
    guardadas.push(ruta);
    localStorage.setItem('rutasPredefinidas', JSON.stringify(guardadas));
    alert('✅ Ruta guardada: ' + nombre + '\n🟢 ' + ruta.origen + '\n🔴 ' + ruta.destino + '\n📍 ' + (todas.length - 2) + ' intermedias');
    window.location.href = 'index.html';
}

inicializarMapa();
</script>
</body>
</html>
