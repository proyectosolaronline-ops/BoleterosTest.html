<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Crear Ruta</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>
    <style>
        :root {
            --negro:#0a0a0a;--amarillo:#f59e0b;--amarillo-texto:#fbbf24;--blanco:#f8fafc;
            --gris:#1e293b;--gris2:#334155;--verde:#22c55e;--rojo:#ef4444;--azul:#3b82f6;
            --naranja:#e85d04;--gris-texto:#94a3b8;
        }
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            background:var(--negro);color:var(--blanco);
            font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
            height:100vh;width:100vw;overflow:hidden;display:flex;flex-direction:column;
            user-select:none;-webkit-user-select:none;
        }
        .header{
            background:var(--gris);padding:1.5vh 4vw;height:7vh;
            display:flex;align-items:center;justify-content:space-between;
            border-bottom:0.4vh solid var(--amarillo);flex-shrink:0;
        }
        .header-titulo{font-size:4.5vw;font-weight:700;color:var(--amarillo)}
        .btn-volver{
            background:transparent;color:var(--amarillo);border:0.2vh solid var(--amarillo);
            padding:1vh 3vw;border-radius:1vh;font-size:3.5vw;cursor:pointer;text-decoration:none;
        }
        .mapa-container{flex:1;position:relative;min-height:0}
        #mapa{width:100%;height:100%}
        .instruccion-bar{
            position:absolute;top:2vh;left:2vw;right:2vw;
            background:rgba(10,10,10,0.9);padding:1.5vh 4vw;
            border-radius:1.5vh;border:0.2vh solid var(--amarillo);z-index:1000;text-align:center;
        }
        .instruccion-titulo{font-size:4.5vw;font-weight:700;color:var(--amarillo-texto)}
        .instruccion-sub{font-size:3vw;color:var(--gris-texto);margin-top:0.3vh}
        .panel-inferior{
            position:absolute;bottom:0;left:0;right:0;
            background:rgba(10,10,10,0.95);padding:2vh 4vw;
            border-top:0.3vh solid var(--amarillo);z-index:1000;max-height:40vh;overflow-y:auto;
        }
        .panel-titulo{font-size:3.5vw;font-weight:700;color:var(--amarillo-texto);margin-bottom:1vh}
        .lista-paradas{display:flex;flex-wrap:wrap;gap:1.5vw;align-items:center;margin-bottom:1.5vh}
        .parada-tag{
            background:var(--gris2);padding:1vh 2vw;border-radius:1vh;font-size:3vw;
            display:flex;align-items:center;gap:1vw;
        }
        .parada-tag.origen{border:0.2vh solid var(--verde)}
        .parada-tag.destino{border:0.2vh solid var(--rojo)}
        .parada-tag.intermedia{border:0.2vh solid var(--azul)}
        .parada-tag .quitar{color:var(--rojo);font-weight:700;font-size:4vw;margin-left:1vw;cursor:pointer}
        .flecha{color:var(--amarillo);font-size:4vw}
        .input-nombre{
            width:100%;padding:1.5vh 3vw;background:var(--negro);color:var(--blanco);
            border:0.2vh solid var(--amarillo);border-radius:1vh;font-size:4vw;margin-bottom:1vh;text-align:center;
        }
        .btn-accion{
            width:100%;padding:2vh;border:none;border-radius:1.5vh;font-size:4.5vw;font-weight:700;cursor:pointer;margin-bottom:1vh;
        }
        .btn-guardar{background:var(--verde);color:var(--blanco)}
        .btn-reiniciar{background:transparent;color:var(--rojo);border:0.2vh solid var(--rojo)}
        .btn-agregar{background:var(--azul);color:var(--blanco)}
        .btn-extender{background:var(--naranja);color:var(--blanco)}
        .btn-guardar:disabled,.btn-agregar:disabled,.btn-extender:disabled{background:var(--gris2);color:#555}
        .leaflet-routing-container{display:none}
        .modal-overlay{
            position:fixed;top:0;left:0;width:100vw;height:100vh;
            background:rgba(10,10,10,0.98);z-index:3000;display:none;flex-direction:column;padding:3vh 4vw;
        }
        .modal-overlay.active{display:flex}
        .modal-title{font-size:7vw;font-weight:700;color:var(--amarillo-texto);text-align:center;margin-bottom:2vh}
        .modal-subtitle{font-size:3.5vw;color:var(--gris-texto);text-align:center;margin-bottom:2vh}
        .modal-cerrar{
            width:100%;padding:2.5vh;background:transparent;color:var(--rojo);
            border:0.2vh solid var(--rojo);border-radius:1.5vh;font-size:4.5vw;font-weight:700;cursor:pointer;margin-top:1.5vh;
        }
        .modal-btn{
            width:100%;padding:3vh;background:var(--verde);color:var(--blanco);
            border:none;border-radius:2vh;font-size:5.5vw;font-weight:700;cursor:pointer;margin-top:1.5vh;
        }
        .modal-select{width:100%;padding:2vh 3vw;background:var(--negro);color:var(--blanco);border:0.2vh solid var(--gris2);border-radius:1vh;font-size:5vw;margin-bottom:2vh;}
        .modal-label{font-size:4vw;color:var(--gris-texto);margin-bottom:1vh}
        .cercanas-lista{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:1.5vh}
        .cercanas-item{
            background:var(--gris);padding:2.5vh 4vw;border-radius:1.5vh;
            display:flex;justify-content:space-between;align-items:center;cursor:pointer;
            border:0.2vh solid transparent;
        }
        .cercanas-item.seleccionada{border-color:var(--verde);background:var(--negro)}
        .cercanas-item .check{color:var(--verde);font-size:5vw;margin-left:2vw}
        .gps-status{font-size:3vw;padding:1.5vh 3vw;border-radius:1vh;margin-bottom:1vh;text-align:center;}
        .gps-status.ok{background:rgba(34,197,94,0.2);color:var(--verde);border:0.2vh solid var(--verde)}
    </style>
</head>
<body>
<div class="header">
    <div class="header-titulo">🗺️ CREAR RUTA</div>
    <a class="btn-volver" href="index.html">✕</a>
</div>
<div class="mapa-container">
    <div id="mapa"></div>
    <div class="instruccion-bar">
        <div class="instruccion-titulo" id="instruccionTitulo">👆 Toca el ORIGEN</div>
        <div class="instruccion-sub" id="instruccionSub">Toca una localidad o doble toque para poner pin</div>
    </div>
    <div class="panel-inferior">
        <div class="panel-titulo">📍 Paradas de la ruta</div>
        <div class="lista-paradas" id="listaParadas"><span style="color:#555;font-size:3.5vw;">Selecciona origen y destino</span></div>
        <button class="btn-accion btn-agregar" id="btnAgregarParada" onclick="activarModoAgregar()" disabled>📍 AGREGAR PARADA INTERMEDIA</button>
        <button class="btn-accion btn-extender" id="btnExtender" onclick="abrirExtenderRuta()" disabled>🔗 EXTENDER RUTA</button>
        <input type="text" class="input-nombre" id="nombreRuta" placeholder="Nombre de la ruta">
        <button class="btn-accion btn-guardar" id="btnGuardar" onclick="guardarRuta()" disabled>💾 GUARDAR RUTA</button>
        <button class="btn-accion btn-reiniciar" onclick="reiniciar()">🔄 Reiniciar</button>
    </div>
</div>

<div class="modal-overlay" id="modalCercanas">
    <div class="modal-title">📍 COMUNIDADES CERCANAS</div>
    <div class="modal-subtitle">Selecciona una o pon nombre manual</div>
    <div class="cercanas-lista" id="listaCercanas"></div>
    <button class="modal-btn" onclick="confirmarSeleccion()">✅ USAR SELECCIÓN</button>
    <button class="modal-cerrar" onclick="document.getElementById('modalCercanas').classList.remove('active')">❌ CERRAR</button>
</div>

<div class="modal-overlay" id="modalExtender">
    <div class="modal-title">🔗 EXTENDER RUTA</div>
    <label class="modal-label">📁 Ruta base</label>
    <select class="modal-select" id="selectRutaBase" onchange="cargarRutaBase()"><option value="">— Seleccionar —</option></select>
    <label class="modal-label">📍 Nuevo destino</label>
    <select class="modal-select" id="selectNuevoDestino"><option value="">— Primero selecciona ruta —</option></select>
    <div class="gps-status" id="extenderStatus" style="display:none;"></div>
    <button class="modal-btn" onclick="extenderRuta()">✅ EXTENDER</button>
    <button class="modal-cerrar" onclick="document.getElementById('modalExtender').classList.remove('active')">❌ CANCELAR</button>
</div>

<script src="matriz_queretaro.js?v=12"></script>
<script>
var mapa, controlRuta, pasoActual='origen', origenSel=null, destinoSel=null;
var markerO=null, markerD=null, paradasEnRuta=[], modoAgregar=false, nextCustomId=900;
var markersIntermedios=[], puntoTocado=null;

// ============================================================
// COMUNIDADES ADICIONALES (municipios y delegaciones)
// ============================================================
var comunidadesExtra = [
    {nombre:"Juriquilla", lat:20.7000, lng:-100.4500},
    {nombre:"Santa Rosa Jáuregui", lat:20.7250, lng:-100.4100},
    {nombre:"El Pueblito", lat:20.5303, lng:-100.4300},
    {nombre:"La Cañada", lat:20.6200, lng:-100.3400},
    {nombre:"Bernal", lat:20.7500, lng:-99.9450},
    {nombre:"San Pablo Tolimán", lat:20.9094, lng:-99.9272},
    {nombre:"Villa del Pueblito", lat:20.5700, lng:-100.4200},
    {nombre:"Tlacote el Alto", lat:20.6700, lng:-100.2600},
    {nombre:"San Isidro Miranda", lat:20.6800, lng:-100.2800},
    {nombre:"Chichimequillas", lat:20.4500, lng:-100.4400},
    {nombre:"Querétaro", lat:20.5888, lng:-100.3899},
    {nombre:"San Juan del Río", lat:20.3881, lng:-99.9965},
    {nombre:"Corregidora", lat:20.5303, lng:-100.4986},
    {nombre:"El Marqués", lat:20.6353, lng:-100.2222},
    {nombre:"Huimilpan", lat:20.3778, lng:-100.2917},
    {nombre:"Pedro Escobedo", lat:20.5094, lng:-100.1278},
    {nombre:"Tequisquiapan", lat:20.5181, lng:-99.8928},
    {nombre:"Ezequiel Montes", lat:20.6667, lng:-99.8833},
    {nombre:"Cadereyta", lat:20.6906, lng:-99.8103},
    {nombre:"Colón", lat:20.8028, lng:-99.7044},
    {nombre:"Amealco", lat:20.1878, lng:-100.1469},
    {nombre:"San Joaquín", lat:21.0578, lng:-99.5628},
    {nombre:"Tolimán", lat:20.9094, lng:-99.9272},
    {nombre:"Jalpan de Serra", lat:21.2122, lng:-99.4728},
    {nombre:"Landa de Matamoros", lat:21.1822, lng:-99.3208},
    {nombre:"Arroyo Seco", lat:21.5278, lng:-99.6908},
    {nombre:"Pinal de Amoles", lat:21.1047, lng:-99.7294},
    {nombre:"Peñamiller", lat:21.0406, lng:-99.7886}
];

function inicializarMapa(){
    mapa=L.map('mapa',{zoomControl:true,attributionControl:false}).setView([20.85,-99.95],9);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:16}).addTo(mapa);
    
    // Carreteras
    var carreteras={
        "MEX-120":{color:'#e85d04',trazo:[[20.5831,-100.3896],[20.5950,-100.3700],[20.6100,-100.3200],[20.6300,-100.2600],[20.6500,-100.2000],[20.6700,-100.1400],[20.6900,-100.0800],[20.7167,-99.8833],[20.7000,-99.8000],[20.7800,-99.5167],[20.8500,-99.4667],[20.9000,-99.4000],[20.9333,-99.4333],[20.9833,-99.4333],[21.0167,-99.3667],[21.1000,-99.3000],[21.1833,-99.2333],[21.2167,-99.4667],[21.2833,-99.3833],[21.1833,-99.3167],[21.2500,-99.2500],[21.3000,-99.2000]]},
        "MEX-069":{color:'#3b82f6',trazo:[[21.2167,-99.4667],[21.1833,-99.5500],[21.1667,-99.6167],[21.3333,-99.6500]]},
        "QRO-004":{color:'#22c55e',trazo:[[20.8500,-99.4667],[20.8667,-99.4333],[20.9000,-99.4500],[21.0167,-99.4667],[21.0500,-99.5500]]},
        "QRO-005":{color:'#a855f7',trazo:[[20.6667,-99.7333],[20.7167,-99.7000],[20.7500,-99.6500],[20.9000,-99.6667],[21.0000,-99.5667]]}
    };
    Object.keys(carreteras).forEach(function(k){L.polyline(carreteras[k].trazo,{color:carreteras[k].color,weight:4,opacity:0.7}).addTo(mapa).bindTooltip(k);});

    // Localidades de matriz (círculos amarillos)
    var obj=(typeof localidadesObj!=='undefined')?localidadesObj:{};
    var coords=(typeof coordenadasLocalidades!=='undefined')?coordenadasLocalidades:{};
    Object.keys(coords).forEach(function(id){var idn=parseInt(id);if(obj[idn]&&coords[idn]){var m=L.circleMarker([coords[idn].lat,coords[idn].lng],{radius:7,color:'#f59e0b',fillColor:'#1e293b',fillOpacity:1,weight:2}).addTo(mapa);m.bindTooltip(obj[idn]);m.on('click',function(e){L.DomEvent.stopPropagation(e);procesarToque({id:idn,nombre:obj[idn],lat:coords[idn].lat,lng:coords[idn].lng,esPersonalizado:false});});}});

    // Comunidades extra (municipios y delegaciones - etiquetas)
    comunidadesExtra.forEach(function(c){
        var icon=L.divIcon({className:'',html:'<div style="background:#21262d;border:1px solid #444c56;color:#7d8590;font-size:8px;padding:1px 5px;border-radius:3px;white-space:nowrap;">'+c.nombre+'</div>',iconAnchor:[20,8]});
        L.marker([c.lat,c.lng],{icon:icon,interactive:true}).addTo(mapa).on('click',function(e){L.DomEvent.stopPropagation(e);procesarToque({id:nextCustomId,nombre:c.nombre,lat:c.lat,lng:c.lng,esPersonalizado:true});nextCustomId++;});
    });

    mapa.on('dblclick',function(e){L.DomEvent.stopPropagation(e);procesarToque({id:nextCustomId,nombre:null,lat:e.latlng.lat,lng:e.latlng.lng,esPersonalizado:true});nextCustomId++;});
    mapa.on('click',function(e){if(modoAgregar&&pasoActual==='completo'){puntoTocado={lat:e.latlng.lat,lng:e.latlng.lng};mostrarCercanas(e.latlng.lat,e.latlng.lng);}});
}

function procesarToque(loc){
    if(pasoActual==='origen'){origenSel=loc;if(!origenSel.nombre){var n=buscarNombreCercano(loc.lat,loc.lng);origenSel.nombre=prompt('Nombre del ORIGEN:',n||'Origen');if(!origenSel.nombre)return;}pasoActual='destino';if(markerO)mapa.removeLayer(markerO);markerO=L.circleMarker([loc.lat,loc.lng],{radius:14,color:'#22c55e',fillColor:'#22c55e',fillOpacity:0.8,weight:3}).addTo(mapa).bindPopup('ORIGEN: '+origenSel.nombre).openPopup();document.getElementById('instruccionTitulo').textContent='Toca el DESTINO';actualizarPanel();}
    else if(pasoActual==='destino'){if(loc.id===origenSel.id&&loc.esPersonalizado===origenSel.esPersonalizado){alert('Diferente al origen');return;}destinoSel=loc;if(!destinoSel.nombre){var n=buscarNombreCercano(loc.lat,loc.lng);destinoSel.nombre=prompt('Nombre del DESTINO:',n||'Destino');if(!destinoSel.nombre)return;}pasoActual='completo';if(markerD)mapa.removeLayer(markerD);markerD=L.circleMarker([loc.lat,loc.lng],{radius:14,color:'#ef4444',fillColor:'#ef4444',fillOpacity:0.8,weight:3}).addTo(mapa).bindPopup('DESTINO: '+destinoSel.nombre).openPopup();if(controlRuta)mapa.removeControl(controlRuta);controlRuta=L.Routing.control({waypoints:[L.latLng(origenSel.lat,origenSel.lng),L.latLng(destinoSel.lat,destinoSel.lng)],routeWhileDragging:false,showAlternatives:false,addWaypoints:false,lineOptions:{styles:[{color:'#22c55e',weight:6,opacity:0.9}]},createMarker:function(){return null;}}).addTo(mapa);setTimeout(function(){var c=document.querySelector('.leaflet-routing-container');if(c)c.style.display='none';},1000);document.getElementById('instruccionTitulo').textContent='Ruta trazada';document.getElementById('instruccionSub').textContent='Toca AGREGAR PARADA para intermedias';document.getElementById('btnAgregarParada').disabled=false;document.getElementById('btnExtender').disabled=false;document.getElementById('btnGuardar').disabled=false;actualizarPanel();}
}

function buscarNombreCercano(lat,lng){
    var coords=(typeof coordenadasLocalidades!=='undefined')?coordenadasLocalidades:{};
    var obj=(typeof localidadesObj!=='undefined')?localidadesObj:{};
    var mejor=null,min=Infinity;
    // Buscar en matriz
    Object.keys(coords).forEach(function(id){var idn=parseInt(id);if(coords[idn]&&obj[idn]){var d=haversine(lat,lng,coords[idn].lat,coords[idn].lng);if(d<0.5&&d<min){min=d;mejor=obj[idn];}}});
    // Buscar en comunidades extra
    if(!mejor){comunidadesExtra.forEach(function(c){var d=haversine(lat,lng,c.lat,c.lng);if(d<0.5&&d<min){min=d;mejor=c.nombre;}});}
    return mejor;
}

function activarModoAgregar(){modoAgregar=true;document.getElementById('instruccionTitulo').textContent='Toca sobre la linea verde';document.getElementById('instruccionSub').textContent='Elige un punto en la carretera';document.getElementById('btnAgregarParada').textContent='MODO AGREGAR ACTIVO';document.getElementById('btnAgregarParada').style.background='var(--verde)';}

function mostrarCercanas(lat,lng){
    var coords=(typeof coordenadasLocalidades!=='undefined')?coordenadasLocalidades:{};
    var obj=(typeof localidadesObj!=='undefined')?localidadesObj:{};
    window._puntoGPS={lat:lat,lng:lng};
    window._seleccionCercana=null;
    
    // Buscar en matriz (max 1 km) + comunidades extra (max 1 km)
    var cercanas=[];
    Object.keys(coords).forEach(function(id){var idn=parseInt(id);if(coords[idn]&&obj[idn]){var d=haversine(lat,lng,coords[idn].lat,coords[idn].lng);if(d<=1)cercanas.push({id:idn,nombre:obj[idn],distancia:d,fuente:'matriz'});}});
    comunidadesExtra.forEach(function(c){var d=haversine(lat,lng,c.lat,c.lng);if(d<=1)cercanas.push({id:nextCustomId,nombre:c.nombre,distancia:d,fuente:'comunidad'});nextCustomId++;});
    cercanas.sort(function(a,b){return a.distancia-b.distancia;});
    
    var lista=document.getElementById('listaCercanas');lista.innerHTML='';
    
    if(cercanas.length>0){
        var t1=document.createElement('div');t1.style.cssText='text-align:center;color:var(--amarillo-texto);font-size:4.5vw;font-weight:700;margin-bottom:2vh;';t1.textContent='COMUNIDADES CERCANAS (max 1 km)';lista.appendChild(t1);
        cercanas.slice(0,8).forEach(function(loc){var item=document.createElement('div');item.className='cercanas-item';var dt=loc.distancia<1?(loc.distancia*1000).toFixed(0)+'m':loc.distancia.toFixed(1)+' km';var etiqueta=loc.fuente==='comunidad'?' 🏘️':'';item.innerHTML='<span style="font-size:4.5vw;">'+loc.nombre+etiqueta+' <small style="color:#888;">('+dt+')</small></span>';item.setAttribute('data-id',loc.id);item.setAttribute('data-nombre',loc.nombre);item.onclick=function(){document.querySelectorAll('#listaCercanas .cercanas-item').forEach(function(el){el.classList.remove('seleccionada');var c=el.querySelector('.check');if(c)c.remove();});this.classList.add('seleccionada');var check=document.createElement('span');check.className='check';check.textContent='✅';this.appendChild(check);window._seleccionCercana={id:parseInt(this.getAttribute('data-id')),nombre:this.getAttribute('data-nombre')};};lista.appendChild(item);});
    }else{
        var t3=document.createElement('div');t3.style.cssText='text-align:center;color:var(--rojo);font-size:4vw;font-weight:700;margin-bottom:2vh;';t3.textContent='No hay comunidades cercanas';lista.appendChild(t3);
    }
    
    var sep=document.createElement('div');sep.style.cssText='border-top:0.2vh solid var(--amarillo);margin:2vh 0;';lista.appendChild(sep);
    var itemManual=document.createElement('div');itemManual.className='cercanas-item';itemManual.style.cssText='border:0.2vh solid var(--azul);';itemManual.innerHTML='<span style="font-size:4vw;">Poner nombre manualmente...</span>';itemManual.onclick=function(){var nombreManual=prompt('Nombre para esta parada:','Parada '+(paradasEnRuta.length+1));if(!nombreManual)return;document.querySelectorAll('#listaCercanas .cercanas-item').forEach(function(el){el.classList.remove('seleccionada');var c=el.querySelector('.check');if(c)c.remove();});this.classList.add('seleccionada');var check=document.createElement('span');check.className='check';check.textContent='✅';this.appendChild(check);window._seleccionCercana={id:nextCustomId,nombre:nombreManual};nextCustomId++;};lista.appendChild(itemManual);
    document.getElementById('modalCercanas').classList.add('active');
}

function confirmarSeleccion(){
    if(!window._seleccionCercana||!puntoTocado)return;
    var sel=window._seleccionCercana;
    var nuevaParada={id:sel.id,nombre:sel.nombre,lat:puntoTocado.lat,lng:puntoTocado.lng};
    paradasEnRuta.push(nuevaParada);
    var m=L.circleMarker([puntoTocado.lat,puntoTocado.lng],{radius:10,color:'#3b82f6',fillColor:'#3b82f6',fillOpacity:0.8,weight:2}).addTo(mapa).bindPopup(sel.nombre);
    markersIntermedios.push(m);
    actualizarPanel();
    document.getElementById('modalCercanas').classList.remove('active');
    document.getElementById('instruccionSub').textContent='Parada agregada: '+sel.nombre;
    puntoTocado=null;
}

function haversine(lat1,lng1,lat2,lng2){var R=6371,dL=(lat2-lat1)*Math.PI/180,dO=(lng2-lng1)*Math.PI/180,a=Math.sin(dL/2)*Math.sin(dL/2)+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dO/2)*Math.sin(dO/2);return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));}

function actualizarPanel(){

}

function quitarIntermedia(index){if(markersIntermedios[index])mapa.removeLayer(markersIntermedios[index]);markersIntermedios.splice(index,1);paradasEnRuta.splice(index,1);actualizarPanel();}

function reiniciar(){
    pasoActual='origen';origenSel=null;destinoSel=null;paradasEnRuta=[];modoAgregar=false;puntoTocado=null;
    if(markerO){mapa.removeLayer(markerO);markerO=null;}if(markerD){mapa.removeLayer(markerD);markerD=null;}
    markersIntermedios.forEach(function(m){mapa.removeLayer(m);});markersIntermedios=[];
    if(controlRuta){mapa.removeControl(controlRuta);controlRuta=null;}
    document.getElementById('instruccionTitulo').textContent='Toca el ORIGEN';
    document.getElementById('instruccionSub').textContent='Toca una localidad o doble toque';

function guardarRuta(){
    var nombre=document.getElementById('nombreRuta').value.trim();if(!nombre){alert('Pon un nombre');return;}
    var todas=[{id:origenSel.id,nombre:origenSel.nombre,lat:origenSel.lat,lng:origenSel.lng}];
    paradasEnRuta.forEach(function(l){todas.push({id:l.id,nombre:l.nombre,lat:l.lat,lng:l.lng});});
    todas.push({id:destinoSel.id,nombre:destinoSel.nombre,lat:destinoSel.lat,lng:destinoSel.lng});

    var guardadas=JSON.parse(localStorage.getItem('rutasPredefinidas')||'[]');guardadas.push(ruta);
    localStorage.setItem('rutasPredefinidas',JSON.stringify(guardadas));localStorage.setItem('rutasPredefinidas_backup',JSON.stringify(guardadas));
    alert('Ruta guardada: '+nombre+'\n'+ruta.origen+' → '+ruta.destino+'\n'+(todas.length-2)+' intermedias');window.location.href='index.html';
}
