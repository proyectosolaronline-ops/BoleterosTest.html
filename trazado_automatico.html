<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Trazado Automático GPS</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
:root{
  --bg:#0a0a0a;--surface:#111827;--surface2:#1e293b;--amber:#f59e0b;--amber2:#fbbf24;
  --green:#22c55e;--red:#ef4444;--blue:#3b82f6;--text:#f1f5f9;--muted:#94a3b8;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;width:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);-webkit-user-select:none;user-select:none}
button,input{font-family:inherit}button{cursor:pointer;border:none}input{outline:none}

.layout{display:flex;flex-direction:column;height:100%}
.topbar{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface);border-bottom:2px solid var(--amber);flex-shrink:0;min-height:48px}
.topbar h1{font-size:14px;font-weight:700;color:var(--amber2);flex:1}
.topbar a{color:var(--amber);text-decoration:none;font-size:12px;font-weight:600;border:1px solid var(--amber);padding:6px 10px;border-radius:6px}

.map-zone{flex:1;position:relative;overflow:hidden}
#mapaGPS{width:100%;height:100%}

/* Buscadores */
.buscadores{position:absolute;top:8px;left:8px;right:8px;z-index:900;display:flex;gap:4px}
.buscador-wrap{flex:1;position:relative}
.buscador-input{width:100%;padding:10px 8px;background:rgba(10,10,10,.9);color:var(--text);border:1px solid var(--amber);border-radius:8px;font-size:10px}
.buscador-input.sel{border-color:var(--green)}
.buscador-input.sel-dest{border-color:var(--red)}
.buscador-drop{position:absolute;top:100%;left:0;right:0;max-height:180px;overflow-y:auto;background:var(--surface2);border:1px solid var(--amber);border-radius:0 0 8px 8px;margin-top:2px;display:none;z-index:1000}
.buscador-drop.open{display:block}
.buscador-item{padding:8px 10px;font-size:10px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.05)}
.buscador-item:hover,.buscador-item:active{background:rgba(245,158,11,.2);color:var(--amber2)}
.buscador-item .km{color:var(--muted);font-size:9px;margin-left:4px}
.buscador-empty{padding:8px 10px;font-size:10px;color:var(--muted);text-align:center}

/* Barra estado */
.estado-bar{position:absolute;top:72px;left:8px;right:8px;z-index:900;display:flex;justify-content:space-between;align-items:center;background:rgba(10,10,10,.9);border:1px solid var(--green);border-radius:8px;padding:6px 10px;font-size:9px}
.estado-bar .txt{color:var(--green);font-weight:700}
.estado-bar .prec{color:var(--muted)}

/* Telemetría */
.telemetria{position:absolute;bottom:60px;left:8px;right:8px;z-index:900;display:none;grid-template-columns:1fr 1fr 1fr 1fr;gap:4px}
.telemetria.active{display:grid}
.tele-box{background:rgba(10,10,10,.9);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:6px 4px;text-align:center}
.tele-box .val{font-size:14px;font-weight:900;color:var(--amber2)}
.tele-box .lbl{font-size:7px;color:var(--muted);text-transform:uppercase}

/* Controles */
.controles{position:absolute;bottom:8px;left:8px;right:8px;z-index:900;display:flex;gap:5px}
.gps-btn{flex:1;padding:12px;border-radius:10px;font-size:13px;font-weight:800;text-align:center;display:none}
.gps-btn:active{transform:scale(.95)}
.gps-btn.iniciar{background:var(--green);color:#fff;display:block}
.gps-btn.pausar{background:var(--amber);color:#000}
.gps-btn.reanudar{background:var(--blue);color:#fff}
.gps-btn.detener{background:var(--red);color:#fff}

/* Animación GPS */
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(0,255,136,0.7)}70%{box-shadow:0 0 0 25px rgba(0,255,136,0)}100%{box-shadow:0 0 0 0 rgba(0,255,136,0)}}
.gps-pulse{animation:pulse 2s infinite}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--surface2);color:var(--text);font-size:10px;padding:6px 16px;border-radius:20px;z-index:5000;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}

/* Etiquetas de localidades */
.etiqueta-localidad{background:rgba(0,0,0,0.75);border:1px solid rgba(255,255,255,0.5);color:#fff;font-size:8px;font-weight:600;padding:2px 5px;border-radius:3px;white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,0.8);pointer-events:none}
</style>
</head>
<body>

<div class="layout">
  <div class="topbar">
    <h1>🛰️ TRAZADO AUTOMÁTICO GPS</h1>
    <a href="index.html">✕</a>
  </div>

  <div class="map-zone">
    <div id="mapaGPS"></div>

    <!-- BUSCADORES -->
    <div class="buscadores">
      <div class="buscador-wrap">
        <input type="text" class="buscador-input" id="gpsSearchOrigen" placeholder="🟢 Origen..." autocomplete="off" oninput="filtrarGPS('origen')" onfocus="filtrarGPS('origen')"/>
        <div class="buscador-drop" id="gpsDropOrigen"></div>
      </div>
      <div class="buscador-wrap">
        <input type="text" class="buscador-input" id="gpsSearchDestino" placeholder="🔴 Destino..." autocomplete="off" oninput="filtrarGPS('destino')" onfocus="filtrarGPS('destino')"/>
        <div class="buscador-drop" id="gpsDropDestino"></div>
      </div>
    </div>

    <!-- ESTADO -->
    <div class="estado-bar">
      <span class="txt" id="gpsEstado">⏳ Selecciona origen y destino</span>
      <span class="prec" id="gpsPrecision">GPS: --</span>
    </div>

    <!-- TELEMETRÍA -->
    <div class="telemetria" id="gpsTelemetria">
      <div class="tele-box"><div class="val" id="teleTiempo">00:00</div><div class="lbl">⏱ Tiempo</div></div>
      <div class="tele-box"><div class="val" id="teleDistancia">0.00</div><div class="lbl">📏 km</div></div>
      <div class="tele-box"><div class="val" id="teleVelocidad">0</div><div class="lbl">🚌 km/h</div></div>
      <div class="tele-box"><div class="val" id="teleParadas">0</div><div class="lbl">📍 Paradas</div></div>
    </div>

    <!-- CONTROLES -->
    <div class="controles">
      <button class="gps-btn iniciar" id="btnIniciarGPS" onclick="iniciarTrazadoGPS()" disabled>▶ INICIAR TRAZADO</button>
      <button class="gps-btn pausar" id="btnPausarGPS" onclick="pausarTrazadoGPS()">⏸ PAUSAR</button>
      <button class="gps-btn reanudar" id="btnReanudarGPS" onclick="reanudarTrazadoGPS()">▶ REANUDAR</button>
      <button class="gps-btn detener" id="btnDetenerGPS" onclick="detenerTrazadoGPS()">⏹ FINALIZAR</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="matriz_queretaro.js?v=18"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ============================================================
// CARGAR DATOS DE MATRIZ QUERÉTARO
// ============================================================
var localidadesArr = [];

(function cargarDatos() {
    if (typeof localidadesObj === 'undefined') { alert('ERROR: No se encontró matriz_queretaro.js'); return; }
    var coords = (typeof coordenadasLocalidades !== 'undefined') ? coordenadasLocalidades : {};
    
    Object.keys(localidadesObj).forEach(function(id) {
        var idn = parseInt(id);
        var km = (typeof MATRIZ_QUERETARO !== 'undefined' && MATRIZ_QUERETARO['1-' + idn]) ? MATRIZ_QUERETARO['1-' + idn].km : 0;
        var c = coords[idn] || {};
        localidadesArr.push({
            id: idn,
            nombre: localidadesObj[idn],
            km: km,
            lat: c.lat || 0,
            lng: c.lng || 0
        });
    });
    localidadesArr.sort(function(a, b) { return a.km - b.km; });
})();

// ============================================================
// HAVERSINE
// ============================================================
function haversine(lat1, lng1, lat2, lng2) {
    var R = 6371;
    var dLat = (lat2 - lat1) * Math.PI / 180;
    var dLng = (lng2 - lng1) * Math.PI / 180;
    var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function localidadMasCercana(lat, lng) {
    var mejor = null, min = Infinity;
    localidadesArr.forEach(function(l) {
        if (!l.lat) return;
        var d = haversine(lat, lng, l.lat, l.lng);
        if (d < min) { min = d; mejor = l; }
    });
    return { loc: mejor, dist: min };
}

// ============================================================
// TOAST
// ============================================================
var _tt;
function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(_tt);
    _tt = setTimeout(function() { t.classList.remove('show'); }, 2500);
}

// ============================================================
// MAPA
// ============================================================
var mapaGPS;
var gpsWatch = null, gpsActivo = false, gpsPausado = false;
var puntosRecorrido = [], paradasGPS = [], puntoAnterior = null;
var distanciaTotal = 0, tiempoInicio = null, timerTelemetria = null;
var markerGPS = null, markerOrigen = null, markerDestino = null, polylineRecorrido = null;
var ultimaParadaTiempo = null, paradaDetectando = false;
var gpsOrigenSel = null, gpsDestinoSel = null;
var UMBRAL_PARADA_KMH = 3, TIEMPO_PARADA_SEG = 8;

function iniciarMapa() {
    mapaGPS = L.map('mapaGPS', { zoomControl: true, attributionControl: false }).setView([20.65, -100.10], 9);
    
    // Satélite
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 18 }).addTo(mapaGPS);
    // Etiquetas
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}{r}.png', { maxZoom: 18, subdomains: 'abcd' }).addTo(mapaGPS);
    
    // Poner todas las localidades en el mapa con etiquetas visibles
    localidadesArr.forEach(function(l) {
        if (!l.lat || !l.lng) return;
        var circle = L.circleMarker([l.lat, l.lng], {
            radius: 5,
            color: '#ffffff',
            fillColor: 'rgba(255,255,255,0.2)',
            fillOpacity: 1,
            weight: 1.5
        }).addTo(mapaGPS);
        circle.bindTooltip(l.nombre + ' (' + l.km + ' km)');
        // Etiqueta permanente
        L.marker([l.lat, l.lng], {
            icon: L.divIcon({
                className: '',
                html: '<div class="etiqueta-localidad">' + l.nombre + '</div>',
                iconAnchor: [40, 0]
            }),
            interactive: false
        }).addTo(mapaGPS);
    });
}

// ============================================================
// BUSCADOR GPS (SOLO LOCALIDADES DE LA MATRIZ)
// ============================================================
function filtrarGPS(tipo) {
    var input = document.getElementById('gpsSearch' + (tipo === 'origen' ? 'Origen' : 'Destino'));
    var drop = document.getElementById('gpsDrop' + (tipo === 'origen' ? 'Origen' : 'Destino'));
    var q = input.value.trim().toLowerCase();
    
    if (!q) { drop.innerHTML = ''; drop.classList.remove('open'); return; }
    
    var resultados = localidadesArr.filter(function(l) {
        return l.nombre.toLowerCase().indexOf(q) >= 0;
    });
    
    if (!resultados.length) {
        drop.innerHTML = '<div class="buscador-empty">Sin resultados en la matriz</div>';
    } else {
        drop.innerHTML = resultados.slice(0, 15).map(function(l) {
            return '<div class="buscador-item" onclick="seleccionarGPS(\'' + tipo + '\',' + l.id + ',\'' + l.nombre.replace(/'/g, "\\'") + '\',' + l.lat + ',' + l.lng + ',' + l.km + ')">📍 ' + l.nombre + ' <span class="km">(' + l.km + ' km)</span></div>';
        }).join('');
    }
    drop.classList.add('open');
}

function seleccionarGPS(tipo, id, nombre, lat, lng, km) {
    var input = document.getElementById('gpsSearch' + (tipo === 'origen' ? 'Origen' : 'Destino'));
    var drop = document.getElementById('gpsDrop' + (tipo === 'origen' ? 'Origen' : 'Destino'));
    
    input.value = nombre;
    input.classList.add(tipo === 'origen' ? 'sel' : 'sel-dest');
    drop.classList.remove('open');
    
    var loc = { id: id, nombre: nombre, lat: lat, lng: lng, km: km };
    
    if (tipo === 'origen') {
        gpsOrigenSel = loc;
        if (markerOrigen) mapaGPS.removeLayer(markerOrigen);
        markerOrigen = L.circleMarker([lat, lng], {
            radius: 14,
            color: '#22c55e',
            fillColor: '#22c55e',
            fillOpacity: 0.9,
            weight: 4
        }).addTo(mapaGPS).bindPopup('🟢 ORIGEN: ' + nombre).openPopup();
        mapaGPS.setView([lat, lng], 13);
        toast('🟢 Origen: ' + nombre);
    } else {
        gpsDestinoSel = loc;
        if (markerDestino) mapaGPS.removeLayer(markerDestino);
        markerDestino = L.circleMarker([lat, lng], {
            radius: 14,
            color: '#ef4444',
            fillColor: '#ef4444',
            fillOpacity: 0.9,
            weight: 4
        }).addTo(mapaGPS).bindPopup('🔴 DESTINO: ' + nombre).openPopup();
        mapaGPS.setView([lat, lng], 13);
        toast('🔴 Destino: ' + nombre);
    }
    
    verificarListo();
}

function verificarListo() {
    if (gpsOrigenSel && gpsDestinoSel) {
        if (gpsOrigenSel.id === gpsDestinoSel.id) {
            toast('⚠️ Origen y destino no pueden ser iguales');
            return;
        }
        document.getElementById('btnIniciarGPS').disabled = false;
        document.getElementById('gpsEstado').textContent = '✅ ' + gpsOrigenSel.nombre + ' → ' + gpsDestinoSel.nombre;
        document.getElementById('gpsEstado').style.color = 'var(--amber2)';
    }
}

// Cerrar dropdowns al tocar fuera
document.addEventListener('click', function(e) {
    if (!e.target.closest('.buscador-wrap')) {
        document.getElementById('gpsDropOrigen').classList.remove('open');
        document.getElementById('gpsDropDestino').classList.remove('open');
    }
});

// ============================================================
// TRAZADO GPS
// ============================================================
function iniciarTrazadoGPS() {
    if (!navigator.geolocation) { alert('⚠ GPS no disponible en este dispositivo'); return; }
    if (!gpsOrigenSel || !gpsDestinoSel) { toast('⚠ Selecciona origen y destino'); return; }
    
    gpsActivo = true;
    gpsPausado = false;
    puntosRecorrido = [];
    paradasGPS = [];
    puntoAnterior = null;
    distanciaTotal = 0;
    tiempoInicio = Date.now();
    ultimaParadaTiempo = null;
    paradaDetectando = false;
    
    if (markerGPS) { mapaGPS.removeLayer(markerGPS); markerGPS = null; }
    if (polylineRecorrido) mapaGPS.removeLayer(polylineRecorrido);
    
    document.getElementById('gpsTelemetria').classList.add('active');
    
    document.getElementById('btnIniciarGPS').style.display = 'none';
    document.getElementById('btnPausarGPS').style.display = 'block';
    document.getElementById('btnDetenerGPS').style.display = 'block';
    document.getElementById('btnReanudarGPS').style.display = 'none';
    
    document.getElementById('gpsEstado').textContent = '🛰️ TRAZANDO...';
    document.getElementById('gpsEstado').style.color = '#00ff88';
    
    if (gpsWatch) navigator.geolocation.clearWatch(gpsWatch);
    
    // Forzar primera lectura en iOS
    navigator.geolocation.getCurrentPosition(function(pos) {
        onPosicionGPS(pos);
    }, onErrorGPS, { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 });
    
    gpsWatch = navigator.geolocation.watchPosition(onPosicionGPS, onErrorGPS, {
        enableHighAccuracy: true,
        maximumAge: 1000,
        timeout: 10000
    });
    
    timerTelemetria = setInterval(actualizarTelemetria, 1000);
    toast('🛰️ Trazado iniciado');
}

function onPosicionGPS(pos) {
    if (!gpsActivo || gpsPausado) return;
    
    var lat = pos.coords.latitude;
    var lng = pos.coords.longitude;
    var prec = Math.round(pos.coords.accuracy);
    var ahora = Date.now();
    
    document.getElementById('gpsPrecision').textContent = 'GPS: ±' + prec + 'm';
    
    if (markerGPS) mapaGPS.removeLayer(markerGPS);
    var esPrimerPunto = puntosRecorrido.length === 0;
    markerGPS = L.circleMarker([lat, lng], {
        radius: 9,
        color: '#00ff88',
        fillColor: '#00ff88',
        fillOpacity: 0.9,
        weight: 4,
        className: 'gps-pulse'
    }).addTo(mapaGPS).bindPopup('📍 Tú');
    if (esPrimerPunto) mapaGPS.setView([lat, lng], 16);
    
    var velocidad = 0;
    if (puntoAnterior) {
        var dist = haversine(puntoAnterior.lat, puntoAnterior.lng, lat, lng);
        if (dist < 0.5) {
            distanciaTotal += dist;
            var deltaT = (ahora - puntoAnterior.tiempo) / 1000;
            velocidad = deltaT > 0 ? (dist / deltaT) * 3600 : 0;
            
            if (velocidad < UMBRAL_PARADA_KMH) {
                if (!paradaDetectando) {
                    paradaDetectando = true;
                    ultimaParadaTiempo = ahora;
                } else if ((ahora - ultimaParadaTiempo) >= TIEMPO_PARADA_SEG * 1000) {
                    var yaExiste = paradasGPS.find(function(p) {
                        return haversine(p.lat, p.lng, lat, lng) < 0.1;
                    });
                    if (!yaExiste) {
                        var cercana = localidadMasCercana(lat, lng);
                        var nombreSugerido = (cercana && cercana.dist < 1.5) ? cercana.loc.nombre : ('Parada ' + (paradasGPS.length + 1));
                        var nombreParada = prompt('📍 Parada detectada\n\nSugerencia: ' + nombreSugerido + '\n\nEscribe el nombre o presiona OK para aceptar:', nombreSugerido);
                        if (!nombreParada || nombreParada.trim() === '') nombreParada = nombreSugerido;
                        paradasGPS.push({
                            orden: paradasGPS.length + 1,
                            lat: lat,
                            lng: lng,
                            nombre: nombreParada,
                            timestamp: new Date().toLocaleTimeString('es-MX')
                        });
                        L.circleMarker([lat, lng], {
                            radius: 10,
                            color: '#f59e0b',
                            fillColor: '#f59e0b',
                            fillOpacity: 0.8,
                            weight: 2
                        }).addTo(mapaGPS).bindPopup('📍 ' + nombreParada);
                        document.getElementById('teleParadas').textContent = paradasGPS.length;
                        toast('📍 ' + nombreParada + ' registrada');
                    }
                    paradaDetectando = false;
                }
            } else {
                paradaDetectando = false;
            }
        }
    }
    
    puntosRecorrido.push({ lat: lat, lng: lng, tiempo: ahora, velocidad: velocidad });
    puntoAnterior = puntosRecorrido[puntosRecorrido.length - 1];
    
    if (puntosRecorrido.length >= 2) {
        if (polylineRecorrido) mapaGPS.removeLayer(polylineRecorrido);
        var coords = puntosRecorrido.map(function(p) { return [p.lat, p.lng]; });
        polylineRecorrido = L.polyline(coords, { color: '#ffffff', weight: 5, opacity: 0.95 }).addTo(mapaGPS);
    }
}

function onErrorGPS(err) {
    document.getElementById('gpsEstado').textContent = '⚠ Error GPS';
    document.getElementById('gpsEstado').style.color = 'var(--red)';
}

function actualizarTelemetria() {
    if (!gpsActivo || gpsPausado) return;
    var transcurrido = Math.floor((Date.now() - tiempoInicio) / 1000);
    var mins = Math.floor(transcurrido / 60);
    var segs = transcurrido % 60;
    document.getElementById('teleTiempo').textContent = (mins < 10 ? '0' : '') + mins + ':' + (segs < 10 ? '0' : '') + segs;
    document.getElementById('teleDistancia').textContent = distanciaTotal.toFixed(2);
    var velActual = puntoAnterior ? (puntoAnterior.velocidad || 0) : 0;
    document.getElementById('teleVelocidad').textContent = Math.round(velActual);
    document.getElementById('teleParadas').textContent = paradasGPS.length;
}

function pausarTrazadoGPS() {
    gpsPausado = true;
    document.getElementById('btnPausarGPS').style.display = 'none';
    document.getElementById('btnReanudarGPS').style.display = 'block';
    document.getElementById('gpsEstado').textContent = '⏸ PAUSADO';
    document.getElementById('gpsEstado').style.color = 'var(--amber)';
    toast('⏸ Trazado pausado');
}

function reanudarTrazadoGPS() {
    gpsPausado = false;
    document.getElementById('btnReanudarGPS').style.display = 'none';
    document.getElementById('btnPausarGPS').style.display = 'block';
    document.getElementById('gpsEstado').textContent = '🛰️ TRAZANDO...';
    document.getElementById('gpsEstado').style.color = '#00ff88';
    toast('▶ Trazado reanudado');
}

function detenerTrazadoGPS() {
    if (!confirm('⏹ ¿Finalizar trazado?\n\nDistancia: ' + distanciaTotal.toFixed(2) + ' km\nParadas detectadas: ' + paradasGPS.length + '\n\nSe guardará en el historial.')) return;
    
    gpsActivo = false;
    gpsPausado = false;
    if (gpsWatch) { navigator.geolocation.clearWatch(gpsWatch); gpsWatch = null; }
    if (timerTelemetria) { clearInterval(timerTelemetria); timerTelemetria = null; }
    
    document.getElementById('btnIniciarGPS').style.display = 'block';
    document.getElementById('btnPausarGPS').style.display = 'none';
    document.getElementById('btnDetenerGPS').style.display = 'none';
    document.getElementById('btnReanudarGPS').style.display = 'none';
    document.getElementById('gpsEstado').textContent = '⏹ Finalizado';
    document.getElementById('gpsEstado').style.color = 'var(--muted)';
    document.getElementById('gpsTelemetria').classList.remove('active');
    
    var tiempoTotal = Math.floor((Date.now() - tiempoInicio) / 1000);
    var h = Math.floor(tiempoTotal / 3600), m = Math.floor((tiempoTotal % 3600) / 60), s = tiempoTotal % 60;
    var velMax = 0;
    puntosRecorrido.forEach(function(p) { if (p.velocidad > velMax) velMax = p.velocidad; });
    
    var trazado = {
        id: 'TRZ-' + Date.now(),
        nombre: gpsOrigenSel.nombre + ' → ' + gpsDestinoSel.nombre,
        fecha: new Date().toLocaleDateString('es-MX'),
        horaInicio: new Date(tiempoInicio).toLocaleTimeString('es-MX'),
        horaFin: new Date().toLocaleTimeString('es-MX'),
        origen: gpsOrigenSel.nombre,
        destino: gpsDestinoSel.nombre,
        origenId: gpsOrigenSel.id,
        destinoId: gpsDestinoSel.id,
        telemetria: {
            distanciaTotal: parseFloat(distanciaTotal.toFixed(2)),
            tiempoTotal: (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s,
            velocidadPromedio: distanciaTotal > 0 ? parseFloat((distanciaTotal / (tiempoTotal / 3600)).toFixed(1)) : 0,
            velocidadMaxima: parseFloat(velMax.toFixed(1)),
            paradasDetectadas: paradasGPS.length,
            puntosGPS: puntosRecorrido.length
        },
        paradas: paradasGPS,
        recorrido: puntosRecorrido.map(function(p) { return [p.lat, p.lng]; })
    };
    
    var historial = JSON.parse(localStorage.getItem('trazadosGPS') || '[]');
    historial.push(trazado);
    localStorage.setItem('trazadosGPS', JSON.stringify(historial));
    
    puntosRecorrido = [];
    paradasGPS = [];
    puntoAnterior = null;
    distanciaTotal = 0;
    tiempoInicio = null;
    if (markerGPS) { mapaGPS.removeLayer(markerGPS); markerGPS = null; }
    if (polylineRecorrido) { mapaGPS.removeLayer(polylineRecorrido); polylineRecorrido = null; }
    document.getElementById('teleTiempo').textContent = '00:00';
    document.getElementById('teleDistancia').textContent = '0.00';
    document.getElementById('teleVelocidad').textContent = '0';
    document.getElementById('teleParadas').textContent = '0';
    
    toast('✅ Trazado guardado: ' + trazado.nombre);
}

// ============================================================
// INICIAR
// ============================================================
iniciarMapa();
</script>
